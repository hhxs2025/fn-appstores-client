<style>
    .source-container {
        padding: 0 10px;
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    .source-add-form {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px 16px;
        margin-bottom: 12px;
        flex-shrink: 0;
    }
    .source-add-form .form-row {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
    }
    .source-add-form .form-row input {
        flex: 1;
        min-width: 100px;
        padding: 4px 10px;
        border: 1px solid var(--border);
        border-radius: 4px;
        font-size: 12px;
        background: var(--bg);
        color: var(--text-primary);
    }
    .source-add-form .form-row input:focus { outline: none; border-color: #4a6a8a; }
    .source-add-form .form-row .btn {
        padding: 4px 12px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: transparent;
        color: var(--text-secondary);
        cursor: pointer;
        font-size: 11px;
        transition: all 0.2s;
    }
    .source-add-form .form-row .btn:hover { background: var(--hover-bg); }
    .source-add-form .form-row .btn-primary { background: #2563ea; color: #fff; border: none; }
    .source-add-form .form-row .btn-primary:hover { background: #1d4ed8; }
    .source-add-form .test-result { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

    .source-list {
        flex: 1;
        overflow-y: auto;
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 4px 0;
        background: var(--card-bg);
    }

    .source-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 12px;
        border-bottom: 1px solid var(--border);
    }
    .source-item:last-child { border-bottom: none; }
    .source-item .info { flex: 1; min-width: 0; }
    .source-item .info .name-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .source-item .info .name-row .name { font-size: 13px; font-weight: 500; color: var(--text-primary); }
    .source-item .info .name-row .badge { font-size: 8px; background: #e8eaed; color: #6b6b6b; padding: 0 6px; border-radius: 3px; }
    .source-item .info .name-row .status { font-size: 9px; }
    .source-item .info .url { font-size: 10px; color: var(--text-muted); word-break: break-all; }
    .source-item .info .status-msg { font-size: 9px; color: #b55a5a; }

    .source-item .actions {
        display: flex;
        gap: 4px;
        flex-shrink: 0;
        margin-left: 8px;
    }
    .source-item .actions .btn {
        padding: 1px 8px;
        border: 1px solid var(--border);
        border-radius: 3px;
        background: transparent;
        cursor: pointer;
        font-size: 9px;
        transition: all 0.2s;
    }
    .source-item .actions .btn-enable { border-color: #5a8a5a; color: #5a8a5a; }
    .source-item .actions .btn-disable { border-color: #999; color: #999; }
    .source-item .actions .btn-delete { border-color: #b55a5a; color: #b55a5a; }
    .source-item .actions .btn:hover { opacity: 0.7; }

    body.dark-mode .source-add-form { background: #1e2a45; border-color: #2a3a5a; }
    body.dark-mode .source-list { background: #1e2a45; border-color: #2a3a5a; }
    body.dark-mode .source-item { border-bottom-color: #2a3a5a; }
    body.dark-mode .source-item .info .name-row .badge { background: #2a3a5a; color: #8a9aaa; }
</style>

<div class="toolbar"><div class="left"><span class="count">应用源管理</span></div><button class="refresh-btn" onclick="loadSources(true)">刷新</button></div>
<div class="source-container">
    <div class="source-add-form">
        <div class="form-row">
            <input type="text" id="newSourceName" placeholder="源名称">
            <input type="text" id="newSourceUrl" placeholder="http://xxx:5660">
            <button class="btn" onclick="testSourceUrl()">测试</button>
            <button class="btn btn-primary" onclick="addSource()">添加</button>
        </div>
        <div class="test-result" id="testResult"></div>
    </div>
    <div class="source-list" id="sourceList"><div style="text-align:center;padding:12px;color:var(--text-muted);font-size:11px;">加载中...</div></div>
</div>

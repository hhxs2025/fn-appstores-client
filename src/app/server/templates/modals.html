{{define "modals"}}
<style>
    .modal-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(60,60,60,0.3);
        z-index: 1000;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal-content {
        background: var(--card-bg);
        border-radius: 10px;
        max-width: 480px;
        width: 100%;
        max-height: 85vh;
        overflow-y: auto;
        padding: 20px 24px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.06);
        animation: modalIn 0.2s;
    }
    @keyframes modalIn {
        from { opacity:0; transform:scale(0.98) translateY(6px); }
        to { opacity:1; transform:scale(1) translateY(0); }
    }
    .modal-close { float: right; background: none; border: none; font-size: 18px; cursor: pointer; color: var(--text-muted); line-height: 1; padding: 0 4px; }
    .modal-close:hover { color: var(--text-primary); }
    .modal-title { font-size: 16px; font-weight: 500; color: var(--text-primary); margin-bottom: 14px; }

    /* 大图预览 */
    .modal-overlay-image {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(30,30,30,0.85);
        z-index: 2000;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }
    .modal-overlay-image.active { display: flex; }
    .modal-content-image {
        background: #1a1a1a;
        border-radius: 10px;
        max-width: 94vw;
        max-height: 94vh;
        padding: 12px 16px 16px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.4);
        animation: modalIn 0.2s;
        position: relative;
    }
    .modal-close-image {
        position: absolute;
        top: -10px; right: -10px;
        background: rgba(60,60,60,0.7);
        border: none;
        font-size: 20px;
        cursor: pointer;
        color: #fff;
        z-index: 10;
        line-height: 1;
        padding: 4px 10px;
        border-radius: 50%;
        width: 34px; height: 34px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .modal-close-image:hover { background: rgba(100,100,100,0.9); }
    .image-container {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 200px;
        max-height: 82vh;
        position: relative;
    }
    .image-container img { max-width: 100%; max-height: 82vh; object-fit: contain; border-radius: 4px; background: #111; }
    .image-nav-btn {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(60,60,60,0.4);
        color: white;
        border: none;
        width: 36px; height: 36px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.15s;
        z-index: 5;
    }
    .image-nav-btn:hover { background: rgba(80,80,80,0.6); }
    .image-nav-btn.prev { left: -16px; }
    .image-nav-btn.next { right: -16px; }
    .image-counter { text-align: center; font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 6px; }

    /* 向导 */
    .wizard-field { margin-bottom: 10px; }
    .wizard-field label { display: block; font-size: 12px; font-weight: 400; margin-bottom: 2px; color: var(--text-secondary); }
    .wizard-field input, .wizard-field select, .wizard-field textarea {
        width: 100%;
        padding: 6px 10px;
        border: 1px solid #d5d7dd;
        border-radius: 4px;
        font-size: 12px;
        outline: none;
        background: var(--card-bg);
        color: var(--text-primary);
        transition: all 0.2s;
    }
    .wizard-field input:focus, .wizard-field select:focus, .wizard-field textarea:focus { border-color: #b0a8a0; box-shadow: 0 0 0 2px rgba(0,0,0,0.03); }
    .wizard-field .hint { font-size: 10px; color: var(--text-muted); margin-top: 1px; }
    .wizard-field .required { color: #b55a5a; margin-left: 2px; }

    body.dark-mode .modal-overlay { background: rgba(0,0,0,0.6); }
    body.dark-mode .modal-content { background: #1e2a45; color: var(--text-primary); }
    body.dark-mode .modal-close { color: var(--text-muted); }
    body.dark-mode .modal-close:hover { color: var(--text-primary); }

    /* ============================================ */
    /* 安装进度弹窗 */
    /* ============================================ */
    .install-modal-content {
        background: var(--card-bg);
        border-radius: 12px;
        width: 480px;
        max-width: 94vw;
        padding: 24px 28px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.12);
        animation: modalIn 0.2s;
    }
    .install-modal-head {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
    }
    .install-modal-icon {
        width: 48px;
        height: 48px;
        border-radius: 10px;
        background: #e8eaed;
        overflow: hidden;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
    }
    .install-modal-icon img { width: 100%; height: 100%; object-fit: cover; }
    .install-modal-title { flex: 1; min-width: 0; }
    .install-modal-title .name {
        font-size: 15px;
        font-weight: 600;
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .install-modal-title .stage {
        font-size: 11px;
        color: var(--text-muted);
        margin-top: 2px;
    }
    .install-modal-close {
        background: none;
        border: none;
        font-size: 18px;
        cursor: pointer;
        color: var(--text-muted);
        line-height: 1;
        padding: 4px 6px;
        border-radius: 4px;
        transition: all 0.15s;
    }
    .install-modal-close:hover { color: var(--text-primary); background: rgba(0,0,0,0.05); }

    .install-modal-bar-wrap { margin: 6px 0 8px; }
    .install-modal-bar-bg {
        width: 100%;
        height: 6px;
        background: #e8e8e8;
        border-radius: 3px;
        overflow: hidden;
    }
    .install-modal-bar-fill {
        height: 100%;
        width: 0%;
        border-radius: 3px;
        background: linear-gradient(90deg, #4a9eff, #2563ea);
        transition: width 0.3s ease;
    }
    .install-modal-bar-fill.success { background: linear-gradient(90deg, #5aad5a, #4a8a4a); }
    .install-modal-bar-fill.error { background: linear-gradient(90deg, #d96a6a, #b54a4a); }

    .install-modal-info {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: 12px;
        color: var(--text-secondary);
        margin-bottom: 4px;
    }
    .install-modal-info .pct {
        font-size: 20px;
        font-weight: 700;
        color: var(--text-primary);
        font-variant-numeric: tabular-nums;
    }
    .install-modal-info .pct.success { color: #4a8a4a; }
    .install-modal-info .pct.error   { color: #b54a4a; }

    .install-modal-status {
        font-size: 12px;
        color: var(--text-secondary);
        min-height: 18px;
        margin-bottom: 2px;
        word-break: break-all;
    }
    .install-modal-status.success { color: #4a8a4a; }
    .install-modal-status.error   { color: #b54a4a; }

    .install-modal-detail {
        font-size: 11px;
        color: var(--text-muted);
        min-height: 16px;
        font-variant-numeric: tabular-nums;
    }

    .install-modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 16px;
    }
    .install-modal-actions .btn {
        padding: 6px 22px;
        border-radius: 6px;
        font-size: 13px;
        cursor: pointer;
        transition: all 0.15s;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text-secondary);
    }
    .install-modal-actions .btn:hover { background: #e8eaed; }
    .install-modal-actions .btn-primary {
        background: #2563ea;
        color: #fff;
        border: none;
    }
    .install-modal-actions .btn-primary:hover { background: #1d4ed8; }

    body.dark-mode .install-modal-bar-bg { background: #2a3a5a; }
    body.dark-mode .install-modal-close:hover { background: rgba(255,255,255,0.08); }
    body.dark-mode .install-modal-actions .btn:hover { background: #2a3a5a; }

    /* ============================================ */
    /* 手动安装弹窗 */
    /* ============================================ */
    .manual-install-actions {
        display: flex;
        gap: 8px;
        margin-top: 14px;
    }

    /* 手动安装弹窗里的进度条 */
    .manual-progress-wrap { display: none; margin-top: 12px; }
    .manual-progress-bg {
        height: 6px;
        background: #e8e8e8;
        border-radius: 3px;
        overflow: hidden;
    }
    .manual-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #4a9eff, #2563ea);
        border-radius: 3px;
        transition: width 0.3s;
    }
    .manual-progress-text {
        font-size: 11px;
        color: var(--text-muted);
        margin-top: 4px;
        font-variant-numeric: tabular-nums;
    }

    /* 手动安装弹窗里的日志框 */
    .manual-log {
        display: none;
        margin-top: 12px;
        padding: 10px;
        background: #f5f5f5;
        border-radius: 6px;
        font-size: 11px;
        max-height: 280px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-all;
        font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        color: #333;
        line-height: 1.5;
    }

    body.dark-mode .manual-progress-bg { background: #2a3a5a; }
    body.dark-mode .manual-log { background: #141c30; color: #c8d4e8; }

    /* 手动安装弹窗的 file input */
    .manual-file-input {
        font-size: 12px;
        color: var(--text-secondary);
    }
    .manual-file-input::file-selector-button {
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text-secondary);
        padding: 5px 12px;
        border-radius: 6px;
        font-size: 12px;
        cursor: pointer;
        margin-right: 10px;
        transition: all 0.15s;
    }
    .manual-file-input::file-selector-button:hover {
        background: var(--bg);
    }

    @media (max-width: 550px) {
        .install-modal-content { padding: 18px 20px; }
        .install-modal-icon { width: 40px; height: 40px; font-size: 18px; }
        .install-modal-info .pct { font-size: 17px; }
    }
</style>

<!-- 公告详情弹窗 -->
<div class="modal-overlay" id="noticeDetailModal" onclick="if(event.target===this) closeNoticeDetail()">
    <div class="modal-content">
        <button class="modal-close" onclick="closeNoticeDetail()">✕</button>
        <div class="modal-title" id="noticeDetailTitle">📢公告详情</div>
        <div id="noticeDetailBody" style="font-size:13px;color:var(--text-secondary);line-height:1.8;max-height:60vh;overflow-y:auto;">加载中...</div>
    </div>
</div>

<!-- 大图预览弹窗 -->
<div class="modal-overlay-image" id="imageModal" onclick="if(event.target===this) closeImageModal()">
    <div class="modal-content-image">
        <button class="modal-close-image" onclick="closeImageModal()">✕</button>
        <div class="image-container">
            <button class="image-nav-btn prev" id="imagePrevBtn" onclick="imagePrev()">‹</button>
            <img id="modalImage" src="" alt="应用截图">
            <button class="image-nav-btn next" id="imageNextBtn" onclick="imageNext()">›</button>
        </div>
        <div class="image-counter" id="imageCounter">1 / 1</div>
    </div>
</div>

<!-- 安装进度弹窗 -->
<div class="modal-overlay" id="installModal">
    <div class="install-modal-content" onclick="event.stopPropagation()">
        <div class="install-modal-head">
            <div class="install-modal-icon" id="installModalIcon"></div>
            <div class="install-modal-title">
                <div class="name" id="installModalName">应用名</div>
                <div class="stage" id="installModalStage">准备中</div>
            </div>
            <button class="install-modal-close" id="installModalClose" onclick="closeInstallModal()" style="display:none;">✕</button>
        </div>

        <div class="install-modal-bar-wrap">
            <div class="install-modal-bar-bg">
                <div class="install-modal-bar-fill" id="installModalBar"></div>
            </div>
        </div>

        <div class="install-modal-info">
            <span id="installModalStatus">准备中...</span>
            <span class="pct" id="installModalPct">0%</span>
        </div>

        <div class="install-modal-detail" id="installModalDetail"></div>

        <div class="install-modal-actions" id="installModalActions" style="display:none;">
            <button class="btn" onclick="closeInstallModal()">关闭</button>
        </div>
    </div>
</div>

<!-- 向导安装弹窗 -->
<div class="modal-overlay" id="wizardModal" onclick="if(event.target===this) closeWizard()">
    <div class="modal-content">
        <button class="modal-close" onclick="closeWizard()">✕</button>
        <div class="modal-title" id="wizardTitle">安装向导</div>
        <div id="wizardBody"></div>
        <div style="margin-top:12px;display:flex;gap:6px;">
            <button class="btn btn-primary" id="wizardSubmitBtn" onclick="submitWizard()">确认安装</button>
            <button class="btn" style="background:transparent;border:1px solid var(--border);color:var(--text-secondary);" onclick="closeWizard()">取消</button>
        </div>
        <div id="wizardStatus" style="margin-top:6px;font-size:11px;color:var(--text-muted);"></div>
    </div>
</div>

<!-- ★ 手动上传安装弹窗 -->
<div class="modal-overlay" id="manualInstallModal" onclick="if(event.target===this) closeManualInstall()">
    <div class="modal-content" style="max-width: 560px;">
        <button class="modal-close" onclick="closeManualInstall()">✕</button>
        <div class="modal-title">手动安装 FPK</div>
        <div style="font-size:12px;color:var(--text-muted);margin-bottom:14px;line-height:1.6;">
            选择本地 FPK 文件直接安装。用于调试、排查故障，避免反复从外链下载。
        </div>

        <input type="file" id="manualFpkFile" accept=".fpk" class="manual-file-input">

        <div class="manual-install-actions">
            <button class="card-btn btn-install" id="manualInstallBtn" onclick="doManualInstall()"
                    style="padding: 7px 22px; font-size: 13px;">
                开始安装
            </button>
            <button id="manualSecondaryBtn" onclick="manualSecondaryAction()"
                    style="display:inline-flex;align-items:center;background:transparent;color:var(--text-secondary);border:1px solid var(--border);padding:7px 20px;border-radius:6px;font-size:13px;cursor:pointer;transition:all 0.15s;">
                关闭
            </button>
        </div>

        <div class="manual-progress-wrap" id="manualInstallProgressWrap">
            <div class="manual-progress-bg">
                <div class="manual-progress-bar" id="manualInstallProgressBar"></div>
            </div>
            <div class="manual-progress-text" id="manualInstallProgressText"></div>
        </div>

        <div id="manualInstallStatus" style="margin-top:12px;font-size:12px;"></div>
        <pre class="manual-log" id="manualInstallLog"></pre>
    </div>
</div>

<script>
// 详情弹窗已改为页面切换，这里只保留兼容函数
function closeDetail() {
    if (typeof backToAppsList === 'function') backToAppsList();
    if (typeof currentDetailApp !== 'undefined') currentDetailApp = null;
}

function closeNoticeDetail() {
    var modal = document.getElementById('noticeDetailModal');
    if (modal) modal.classList.remove('active');
}

function closeImageModal() {
    var modal = document.getElementById('imageModal');
    if (modal) modal.classList.remove('active');
}

function closeWizard() {
    var modal = document.getElementById('wizardModal');
    if (modal) modal.classList.remove('active');
}

// 保留空实现，兼容旧引用
function modalInstall() {}
function switchDetailTab(tabName) {}
function goToSlide(index) {}
</script>
{{end}}

{{define "layout"}}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
    <title>FN软仓</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #f3f3f3;
            --content-bg: #f8fafc;
            --card-bg: #ffffff;
            --sidebar-bg: #f0f2f5;
            --text-primary: #3c3c3c;
            --text-secondary: #6b6b6b;
            --text-muted: #a0a0a0;
            --border: #e5e7eb;
            --blue: #2563ea;
            --sidebar-width: 140px;
            --max-width: 1500px;
            --nav-item-height: 40px;
        }

        html, body { height: 100%; overflow: hidden; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            margin: 0;
            padding: 0;
            transition: background 0.25s, color 0.25s;
        }

        .header {
            background: var(--card-bg);
            padding: 6px 16px 4px;
            flex-shrink: 0;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 44px;
            z-index: 100;
        }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .header-left .hamburger {
            display: none;
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 4px;
        }
        .header-left .app-name { font-size: 15px; font-weight: 500; color: var(--text-primary); }
        .header-left .app-version { font-size: 11px; color: var(--text-muted); font-weight: 400; }

        .header-right {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 9px;
            color: var(--text-muted);
        }
        .header-right .sep { color: #d5d5dd; }

        .app-layout {
            display: flex;
            flex: 1;
            min-height: 0;
            overflow: hidden;
            max-width: var(--max-width);
            margin: 0 auto;
            width: 100%;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            padding: 12px 0 8px;
            overflow-y: auto;
            z-index: 50;
        }

        .sidebar-search {
            padding: 0 10px 10px;
            flex-shrink: 0;
        }
        .sidebar-search input {
            width: 100%;
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 12px;
            background: var(--card-bg);
            color: var(--text-primary);
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.15s;
        }
        .sidebar-search input:focus {
            border-color: var(--blue);
        }
        .sidebar-search input::placeholder {
            color: var(--text-muted);
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 0 8px;
            flex: 1;
        }
        .sidebar-nav .nav-item {
            display: flex !important;
            flex-direction: row !important;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
            padding: 0 12px;
            height: var(--nav-item-height);
            border: none;
            background: transparent;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            text-align: left;
            box-sizing: border-box;
        }
        .sidebar-nav .nav-item:hover { background: rgba(0,0,0,0.05); color: var(--text-primary); }
        .sidebar-nav .nav-item.active { background: rgba(37,99,235,0.1); color: var(--blue); }
        .sidebar-nav .nav-item .label {
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sidebar-nav .nav-icon {
            display: block;
            width: 18px;
            height: 18px;
            min-width: 18px;
            min-height: 18px;
            max-width: 18px;
            max-height: 18px;
            flex: 0 0 18px;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        .sidebar-nav .nav-item:hover .nav-icon,
        .sidebar-nav .nav-item.active .nav-icon {
            opacity: 1;
        }

        .sidebar-footer {
            padding: 8px 12px 0;
            border-top: 1px solid var(--border);
            margin-top: 8px;
            font-size: 10px;
            color: var(--text-muted);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--content-bg);
            padding: 0 20px 0;
            min-width: 0;
        }

        .tab-content {
            display: none;
            flex: 1;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
            padding: 4px 0 8px;
        }
        .tab-content.active { display: flex; }

        /* ===== 暗色模式：变量合并到 html 和 body 上 ===== */
        html.dark-mode,
        body.dark-mode {
            --bg: #1a1a2e;
            --content-bg: #16213e;
            --card-bg: #1e2a45;
            --sidebar-bg: #141c30;
            --border: #2a3a5a;
            --text-primary: #e8e8f0;
            --text-secondary: #a8b8d0;
            --text-muted: #6a7a9a;
            background: #1a1a2e;
            color: #e8e8f0;
        }
        html.dark-mode .header,
        body.dark-mode .header { background: #16213e; border-bottom-color: var(--border); }
        html.dark-mode .sidebar,
        body.dark-mode .sidebar { background: #141c30; border-right-color: var(--border); }
        html.dark-mode .sidebar-nav .nav-item:hover,
        body.dark-mode .sidebar-nav .nav-item:hover { background: rgba(255,255,255,0.05); }
        html.dark-mode .sidebar-nav .nav-item.active,
        body.dark-mode .sidebar-nav .nav-item.active { background: rgba(37,99,235,0.2); color: #60a5fa; }
        html.dark-mode .sidebar-footer,
        body.dark-mode .sidebar-footer { border-top-color: var(--border); }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d5d5dd; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #b8bac2; }
        body.dark-mode ::-webkit-scrollbar-thumb { background: #2a3a5a; }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(40,40,40,0.92);
            color: #fff;
            padding: 8px 20px;
            border-radius: 6px;
            font-size: 12px;
            z-index: 9999;
            opacity: 0;
            transition: all 0.3s;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.success { background: rgba(40,70,40,0.92); }
        .toast.error { background: rgba(80,40,40,0.92); }
        .toast.warning { background: rgba(80,70,40,0.92); }

        @media (max-width: 1100px) {
            .sidebar { width: 48px; }
            .sidebar-footer { display: none; }
            .sidebar-search { display: none; }
            .sidebar-nav { padding: 0 4px; }
            .sidebar-nav .nav-item {
                font-size: 0;
                padding: 0 8px;
                justify-content: center;
                gap: 0;
            }
            .sidebar-nav .nav-item .label { display: none; }
            .sidebar-nav .nav-icon {
                width: 20px; height: 20px;
                min-width: 20px; min-height: 20px;
                max-width: 20px; max-height: 20px;
                flex: 0 0 20px;
            }
            .main-content { padding: 0 12px; }
        }

        @media (max-width: 768px) {
            .header-left .hamburger { display: block; }
            .header-right { font-size: 8px; gap: 4px; }
            .header-right .sep { display: none; }
            .sidebar {
                position: fixed; top: 0; left: 0;
                height: 100vh; width: 180px;
                transform: translateX(-100%);
                box-shadow: 2px 0 16px rgba(0,0,0,0.1);
                z-index: 200;
                padding-top: 12px;
            }
            .sidebar.open { transform: translateX(0); }
            .sidebar .sidebar-search { display: block; }
            .sidebar .sidebar-nav .nav-item {
                font-size: 14px;
                justify-content: flex-start;
                padding: 0 12px;
                gap: 10px;
            }
            .sidebar .sidebar-nav .nav-item .label { display: inline; flex: 1; }
            .sidebar .sidebar-footer { display: block; }
            .sidebar-overlay {
                display: none;
                position: fixed; top: 0; left: 0;
                width: 100%; height: 100%;
                background: rgba(0,0,0,0.3);
                z-index: 150;
            }
            .sidebar-overlay.active { display: block; }
            .main-content { padding: 0 8px; }
            .header { padding: 4px 8px; height: 44px; }
            .header-left .app-name { font-size: 14px; }
            .header-left .app-version { font-size: 10px; }
        }

        @media (max-width: 480px) {
            .header { height: 40px; padding: 3px 6px; }
            .header-left .app-name { font-size: 13px; }
            .header-left .app-version { font-size: 9px; }
            .header-right { font-size: 7px; }
            .main-content { padding: 0 4px; }
        }
    </style>

    <script>
    (function() {
        try {
            var u = localStorage.getItem('fnsoft_theme');
            var s = localStorage.getItem('fnsoft_system_theme');
            var theme = (u === 'light' || u === 'dark') ? u : ((s === 'light' || s === 'dark') ? s : 'light');
            if (theme === 'dark') {
                document.documentElement.classList.add('dark-mode');
            }
        } catch (e) {}
    })();
    </script>
</head>
<body>

    <header class="header">
        <div class="header-left">
            <button class="hamburger" id="hamburgerBtn" onclick="toggleSidebar()">☰</button>
            <span class="app-name">FN软仓</span>
            <span class="app-version" id="appVersion">{{.Version}}</span>
        </div>
        <div class="header-right">
            <span>飞牛第三方应用市场</span>
            <span class="sep">·</span>
            <span>开发者:晦华先生</span>
        </div>
    </header>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <div class="app-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-search">
                <input type="text" id="globalSearchInput" placeholder="搜索应用..." oninput="onGlobalSearchInput(this.value)">
            </div>

            <nav class="sidebar-nav">
                <button class="nav-item active" data-tab="home" onclick="switchTab('home')">
                    <svg class="nav-icon" viewBox="0 0 24 24" preserveAspectRatio="xMidYMid meet" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2h-4v-7h-6v7H5a2 2 0 0 1-2-2z"/></svg>
                    <span class="label">首&nbsp;&nbsp;&nbsp;页</span>
                </button>
                <button class="nav-item" data-tab="apps" onclick="switchTab('apps')">
                    <svg class="nav-icon" viewBox="0 0 24 24" preserveAspectRatio="xMidYMid meet" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg>
                    <span class="label">应&nbsp;&nbsp;&nbsp;用</span>
                </button>
                <button class="nav-item" data-tab="developers" onclick="switchTab('developers')">
                    <svg class="nav-icon" viewBox="0 0 24 24" preserveAspectRatio="xMidYMid meet" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>
                    <span class="label">开发者</span>
                </button>
                <button class="nav-item" data-tab="sources" onclick="switchTab('sources')">
                    <svg class="nav-icon" viewBox="0 0 24 24" preserveAspectRatio="xMidYMid meet" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="5" cy="18" r="2"/><circle cx="19" cy="18" r="2"/><path d="M7 7.5l3 3M17 7.5l-3 3M7 16.5l3-3M17 16.5l-3-3"/></svg>
                    <span class="label">源管理</span>
                </button>
                <button class="nav-item" data-tab="settings" onclick="switchTab('settings')">
                    <svg class="nav-icon" viewBox="0 0 24 24" preserveAspectRatio="xMidYMid meet" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.09a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.09a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                    <span class="label">设&nbsp;&nbsp;&nbsp;置</span>
                </button>
            </nav>
            <div class="sidebar-footer">FN软仓 v{{.Version}}-MIT</div>
        </aside>

        <main class="main-content">
            {{template "content" .}}
        </main>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        function toggleSidebar() {
            var sidebar = document.getElementById('sidebar');
            var overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }

        function closeSidebar() {
            var sidebar = document.getElementById('sidebar');
            var overlay = document.getElementById('sidebarOverlay');
            if (sidebar) sidebar.classList.remove('open');
            if (overlay) overlay.classList.remove('active');
        }

        // ============================================================
        // 主题系统（简化版：只有一个深色模式开关）
        //
        //   状态：
        //     - USER_THEME_KEY 存在 → 用户手动模式（'dark' / 'light'）
        //     - USER_THEME_KEY 不存在 → 跟随系统（用 SYS_THEME_KEY）
        //
        //   用户操作：
        //     - 拨动"深色模式"开关 → 进入手动模式
        //     - 点"恢复跟随系统" → 清除 USER_THEME_KEY，回到跟随系统
        // ============================================================
        var USER_THEME_KEY = 'fnsoft_theme';
        var SYS_THEME_KEY = 'fnsoft_system_theme';

        function applyThemeClass(theme) {
            if (theme === 'dark') {
                document.body.classList.add('dark-mode');
                document.documentElement.classList.add('dark-mode');
            } else {
                document.body.classList.remove('dark-mode');
                document.documentElement.classList.remove('dark-mode');
            }
            syncThemeSwitches();
        }

        // 计算当前应该显示的主题（用户手动优先，否则跟系统）
        function getTheme() {
            var u = localStorage.getItem(USER_THEME_KEY);
            if (u === 'light' || u === 'dark') return u;
            var s = localStorage.getItem(SYS_THEME_KEY);
            if (s === 'light' || s === 'dark') return s;
            return 'light';
        }

        // 系统主题更新（由轮询调用）
        function setSystemTheme(theme) {
            if (theme !== 'light' && theme !== 'dark') return;
            var old = localStorage.getItem(SYS_THEME_KEY);
            localStorage.setItem(SYS_THEME_KEY, theme);
            if (old !== theme) {
                console.log('[theme] 系统主题更新:', old, '→', theme,
                            '| 用户手动 =', localStorage.getItem(USER_THEME_KEY));
            }
            // 只有跟随系统时才应用
            if (!localStorage.getItem(USER_THEME_KEY)) {
                applyThemeClass(theme);
            }
        }

        function resolveSystemTheme(theme) {
            if (theme === 'light' || theme === 'dark') return theme;
            if (theme === 'auto') {
                return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
            }
            return 'light';
        }

        function bindMatchMedia() {
            if (!window.matchMedia) return;
            var mq = window.matchMedia('(prefers-color-scheme: dark)');
            var handler = function (e) {
                setSystemTheme(e.matches ? 'dark' : 'light');
            };
            if (mq.addEventListener) mq.addEventListener('change', handler);
            else if (mq.addListener) mq.addListener(handler);
            setSystemTheme(mq.matches ? 'dark' : 'light');
        }

        function initTheme() {
            applyThemeClass(getTheme());
            syncThemeSwitches();
        }

        // ============================================================
        // initSystemTheme：轮询 + $on 加速
        // ============================================================
        async function initSystemTheme() {
            var sdk = window.trimSdk;
            if (!sdk) {
                try {
                    var mod = await Promise.race([
                        import('https://cdn.jsdelivr.net/npm/@trimjs/web-app/+esm'),
                        new Promise(function(_, rej){ setTimeout(function(){ rej(new Error('CDN 加载超时')); }, 3000); })
                    ]);
                    sdk = new mod.TrimApp();
                    window.trimSdk = sdk;
                    console.log('[theme] SDK 首次加载完成');
                } catch (e) {
                    console.warn('[theme] SDK 加载失败/超时，退回 matchMedia:', e);
                    bindMatchMedia();
                    return;
                }
            } else {
                console.log('[theme] 复用已有 SDK 实例');
            }

            console.log('[theme] sdk.isWeb:', sdk.isWeb, 'isStandaloneWeb:', sdk.isStandaloneWeb);

            async function fetchRealTheme() {
                try {
                    var config = await Promise.race([
                        sdk.getPlatformConfig(),
                        new Promise(function(_, rej){ setTimeout(function(){ rej(new Error('timeout')); }, 2000); })
                    ]);
                    if (config && config.theme) {
                        return resolveSystemTheme(config.theme);
                    }
                } catch (e) {
                    console.warn('[theme] getPlatformConfig 失败:', e);
                }
                return null;
            }

            // 首次拉取
            var initial = await fetchRealTheme();
            if (initial) {
                console.log('[theme] 初始系统主题:', initial);
                setSystemTheme(initial);
            } else {
                console.warn('[theme] 初始系统主题获取失败，退回 matchMedia');
                bindMatchMedia();
            }

            // 每 2 秒轮询
            var lastPolled = localStorage.getItem(SYS_THEME_KEY);
            function poll() {
                if (document.hidden) return;
                fetchRealTheme().then(function(real) {
                    if (real && real !== lastPolled) {
                        lastPolled = real;
                        setSystemTheme(real);
                    }
                });
            }
            setInterval(poll, 2000);

            // $on 事件 → 立即触发一次轮询
            if (sdk.isWeb === true && sdk.isStandaloneWeb === false) {
                try {
                    var ret = sdk.$on('os/theme', function (theme) {
                        console.log('[theme] $on 事件:', theme, '→ 立即触发轮询');
                        setTimeout(poll, 100);
                    });
                    if (ret && typeof ret.catch === 'function') {
                        ret.catch(function(e) {
                            console.warn('[theme] $on 监听失败（不影响轮询）:', e);
                        });
                    }
                } catch (e) {
                    console.warn('[theme] $on 抛异常（不影响轮询）:', e);
                }
            }

            // 页面重新可见时立即轮询
            document.addEventListener('visibilitychange', function() {
                if (!document.hidden) setTimeout(poll, 200);
            });
        }

        // ============================================================
        // 开关逻辑（方案 A）
        // ============================================================

        // 拨动"深色模式"开关 → 进入用户手动模式
        function handleThemeSwitch(checked) {
            var theme = checked ? 'dark' : 'light';
            localStorage.setItem(USER_THEME_KEY, theme);
            applyThemeClass(theme);
            syncThemeSwitches();
            console.log('[theme] 用户手动切换:', theme);
        }

        // 点"恢复跟随系统" → 回到跟随系统
        function resetToSystemTheme() {
            localStorage.removeItem(USER_THEME_KEY);
            applyThemeClass(getTheme());
            syncThemeSwitches();
            console.log('[theme] 恢复跟随系统，当前系统主题 =',
                        localStorage.getItem(SYS_THEME_KEY));
        }

        // 同步 UI 状态
        function syncThemeSwitches() {
            var themeSwitch = document.getElementById('themeSwitch');
            var followHint = document.getElementById('followSystemHint');

            var isAuto = !localStorage.getItem(USER_THEME_KEY);

            if (themeSwitch) {
                themeSwitch.checked = (getTheme() === 'dark');
            }
            if (followHint) {
                followHint.style.display = isAuto ? 'none' : '';
            }
        }

        function onGlobalSearchInput(val) {
            var appsTab = document.getElementById('tabApps');
            if (appsTab && !appsTab.classList.contains('active')) {
                switchTab('apps');
            }
            var localInput = document.getElementById('searchInput');
            if (localInput) {
                localInput.value = val;
                if (typeof searchApps === 'function') searchApps();
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(function(el) {
                el.classList.remove('active');
            });
            document.querySelectorAll('.sidebar-nav .nav-item').forEach(function(el) {
                el.classList.remove('active');
            });

            var target = document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1));
            if (target) target.classList.add('active');

            var navBtn = document.querySelector('.sidebar-nav .nav-item[data-tab="' + tab + '"]');
            if (navBtn) navBtn.classList.add('active');

            closeSidebar();

            if (tab === 'apps' && typeof backToAppsList === 'function') {
                if (!window._pendingDetailAppId) {
                    backToAppsList();
                }
            }
            if (tab === 'apps' && typeof restoreAppsView === 'function') {
                restoreAppsView();
            }
            if (tab === 'developers' && typeof renderDevelopers === 'function') {
                setTimeout(function() { renderDevelopers(); }, 50);
            }
            if (tab === 'sources' && typeof loadSources === 'function') {
                loadSources();
            }
            if (tab === 'home' && typeof loadHome === 'function') {
                loadHome();
            }
            if (tab === 'settings' && typeof syncThemeSwitches === 'function') {
                setTimeout(function() { syncThemeSwitches(); }, 30);
            }

            if (tab === 'apps' && window._pendingDetailAppId && typeof openDetail === 'function') {
                var id = window._pendingDetailAppId;
                window._pendingDetailAppId = null;
                setTimeout(function () {
                    openDetail(id);
                }, 100);
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            initTheme();
            initSystemTheme();

            switchTab('home');

            setTimeout(function() {
                if (typeof loadHome === 'function') loadHome();
                if (typeof loadApps === 'function') loadApps();
                if (typeof loadSources === 'function') loadSources();
            }, 300);

            document.addEventListener('click', function(e) {
                if (window.innerWidth > 768) return;
                var sidebar = document.getElementById('sidebar');
                var ham = document.getElementById('hamburgerBtn');
                if (sidebar && !sidebar.contains(e.target) && e.target !== ham && ham && !ham.contains(e.target)) {
                    closeSidebar();
                }
            });

            window.addEventListener('beforeunload', function() {
                if (typeof window.__cleanupWebSocket === 'function') {
                    window.__cleanupWebSocket();
                }
            });
        });
    </script>

    {{template "extra_js" .}}
</body>
</html>
{{end}}

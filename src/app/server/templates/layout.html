<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FN软仓{% endblock %}</title>
    <style>
        /* ===== 全局样式保持不变 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #f3f3f3;
            --content-bg: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #3c3c3c;
            --text-secondary: #6b6b6b;
            --text-muted: #a0a0a0;
            --border: #e5e7eb;
            --shadow: rgba(0, 0, 0, 0.02);
            --radius: 8px;
            --blue: #2563ea;
            --blue-hover: #1d4ed8;
            --green: #6b9b7a;
            --red: #c47a7a;
            --yellow: #c4a06a;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            margin: 0;
            padding: 0;
            transition: background 0.25s ease, color 0.25s ease;
        }

        /* 头部 */
        .header {
            background: #f8fafc;
            padding: 8px 16px 6px;
            flex-shrink: 0;
            border-bottom: 1px solid #e5e7eb;
            transition: background 0.25s ease, border-color 0.25s ease;
        }

        .header-top {
            display: flex;
            align-items: baseline;
            gap: 8px;
            flex-wrap: nowrap;
        }

        .header-top .app-name {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-primary);
            letter-spacing: 0.5px;
            transition: color 0.25s ease;
        }

        .header-top .app-version {
            font-size: 9%;
            color: var(--text-muted);
            font-weight: 400;
            transition: color 0.25s ease;
        }

        .header-top .update-badge {
            display: none;
            background: var(--yellow);
            color: #fff;
            font-size: 8px;
            padding: 0 10px;
            border-radius: 12px;
            cursor: pointer;
            line-height: 16px;
            font-weight: 500;
        }

        .header-top .update-badge:hover {
            opacity: 0.8;
        }

        .header-bottom {
            font-size: 9px;
            color: var(--text-muted);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px;
            margin-top: 2px;
            transition: color 0.25s ease;
        }

        .header-bottom .sep {
            color: #d5d5dd;
            transition: color 0.25s ease;
        }

        .header-bottom a {
            color: var(--text-secondary);
            text-decoration: none;
        }

        .header-bottom a:hover {
            color: var(--text-primary);
        }

        .theme-btn-header {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 9px;
            padding: 0 4px;
            display: inline-flex;
            align-items: center;
            gap: 2px;
            transition: color 0.25s ease;
        }

        .theme-btn-header:hover {
            color: var(--text-secondary);
        }

        .theme-btn-header .theme-icon {
            font-size: 11px;
        }

        .theme-btn-header .theme-label {
            font-size: 9px;
        }

        /* 内容区 */
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0 16px 0;
            overflow: hidden;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
            min-height: 0;
            background: #f8fafc;
            transition: background 0.25s ease;
        }

        .tab-content {
            display: none;
            flex: 1;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .tab-content.active {
            display: flex;
        }

        /* 底部导航 */
        .bottom-nav {
            display: flex;
            flex-shrink: 0;
            background: #f3f3f3;
            border-top: 1px solid #e5e7eb;
            padding: 6px 16px 8px;
            margin: 0 -16px;
            gap: 2px;
            transition: background 0.25s ease, border-color 0.25s ease;
        }

        .nav-btn {
            flex: 1;
            border: none;
            background: transparent;
            padding: 6px 8px;
            cursor: pointer;
            color: var(--text-muted);
            text-align: center;
            border-radius: var(--radius);
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .nav-btn .nav-icon {
            font-size: 16px;
            line-height: 1;
        }

        .nav-btn .nav-label {
            font-size: 11px;
            line-height: 1;
        }

        .nav-btn:hover {
            color: var(--text-secondary);
            background: #e8eaed;
        }

        .nav-btn.active {
            color: var(--text-primary);
            background: #e8eaed;
            font-weight: 500;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 56px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--text-primary);
            color: #f5f0eb;
            padding: 6px 18px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 400;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            opacity: 0;
            transition: all 0.35s ease;
            z-index: 999;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.success {
            background: var(--green);
            color: #fff;
        }

        .toast.error {
            background: var(--red);
            color: #fff;
        }

        .toast.warning {
            background: var(--yellow);
            color: #fff;
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #d5d5dd;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #b8bac2;
        }

        /* 深色模式 */
        body.dark-mode {
            --bg: #1a1a2e;
            --content-bg: #16213e;
            --card-bg: #1e2a45;
            --border: #2a3a5a;
            --text-primary: #e8e8f0;
            --text-secondary: #a8b8d0;
            --text-muted: #6a7a9a;
        }

        body.dark-mode .header {
            background: #16213e;
            border-bottom-color: #2a3a5a;
        }

        body.dark-mode .header-top .app-name {
            color: #e8e8f0;
        }

        body.dark-mode .header-top .app-version {
            color: #6a7a9a;
        }

        body.dark-mode .header-bottom {
            color: #6a7a9a;
        }

        body.dark-mode .header-bottom .sep {
            color: #3a4a6a;
        }

        body.dark-mode .theme-btn-header {
            color: #6a7a9a;
        }

        body.dark-mode .theme-btn-header:hover {
            color: #a8b8d0;
        }

        body.dark-mode .container {
            background: #16213e;
        }

        body.dark-mode .bottom-nav {
            background: #1a1a2e;
            border-top-color: #2a3a5a;
        }

        body.dark-mode .nav-btn {
            color: #6a7a9a;
        }

        body.dark-mode .nav-btn:hover {
            background: #2a3a5a;
            color: #a8b8d0;
        }

        body.dark-mode .nav-btn.active {
            background: #2a3a5a;
            color: #e8e8f0;
        }

        body.dark-mode .toast {
            background: rgba(30, 30, 50, 0.95);
            color: #e8e8f0;
        }

        body.dark-mode ::-webkit-scrollbar-thumb {
            background: #3a4a6a;
        }

        body.dark-mode ::-webkit-scrollbar-thumb:hover {
            background: #4a5a7a;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .container {
                padding: 0 8px;
            }
            .bottom-nav {
                padding: 4px 8px 6px;
                margin: 0 -8px;
            }
            .header {
                padding: 6px 8px 4px;
            }
            .header-top .app-name {
                font-size: 14px;
            }
            .header-bottom {
                font-size: 8px;
            }
            .nav-btn .nav-icon {
                font-size: 14px;
            }
            .nav-btn .nav-label {
                font-size: 10px;
            }
            .theme-btn-header .theme-icon {
                font-size: 10px;
            }
            .theme-btn-header .theme-label {
                font-size: 8px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 0 4px;
            }
            .bottom-nav {
                padding: 3px 4px 5px;
                margin: 0 -4px;
            }
            .header {
                padding: 4px 4px 3px;
            }
            .header-top .app-name {
                font-size: 13px;
            }
            .header-bottom {
                font-size: 7px;
            }
            .nav-btn .nav-icon {
                font-size: 13px;
            }
            .nav-btn .nav-label {
                font-size: 9px;
            }
            .theme-btn-header .theme-icon {
                font-size: 9px;
            }
            .theme-btn-header .theme-label {
                font-size: 7px;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>

<body>

    <header class="header">
        <div class="header-top">
            <span class="app-name">FN软仓</span>
            <span class="app-version" id="appVersion">2.4.1</span>
            <span class="update-badge" id="updateBadge" onclick="goUpdate()">有新版本</span>
        </div>
        <div class="header-bottom">
            <span>飞牛第三方应用市场</span>
            <span class="sep">·</span>
            <span>开源共建</span>
            <span class="sep">·</span>
            <span>开发者:晦华先生</span>
            <span class="sep">·</span>
            <a href="https://f.wps.cn/g/L7KeYADl/" target="_blank" style="color:var(--text-secondary);text-decoration:none;">📝 应用接入</a>
            <span class="sep">·</span>
            <a href="https://gitee.com/hhxs2025/fn-appstores/raw/master/源.md" target="_blank" style="color:var(--text-secondary);text-decoration:none;">📡 官方源查询</a>
            <span class="sep">·</span>
            <button class="theme-btn-header" onclick="toggleTheme()">
                <span class="theme-icon" id="themeIconHeader">🌙</span>
                <span class="theme-label" id="themeLabelHeader">深色</span>
            </button>
            <span id="updateNotice" style="display:none; color:#b55a5a; margin-left:10px; font-weight:500;">
                ⚠️ 发现应用更新，若更新失败请先在官方应用中心卸载旧版再安装
            </span>
        </div>
    </header>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <div class="toast" id="toast"></div>

    <!-- ===== 底部导航 ===== -->
    <div class="bottom-nav">
        <button class="nav-btn active" data-tab="apps" onclick="switchTab('apps')">
            <span class="nav-icon">□</span>
            <span class="nav-label">应用</span>
        </button>
        <button class="nav-btn" data-tab="sources" onclick="switchTab('sources')">
            <span class="nav-icon">⊕</span>
            <span class="nav-label">源管理</span>
        </button>
        <button class="nav-btn" data-tab="about" onclick="switchTab('about')">
            <span class="nav-icon">○</span>
            <span class="nav-label">关于</span>
        </button>
    </div>

    <script>
        // ================================================================
        // 主题切换
        // ================================================================
        function getTheme() {
            return localStorage.getItem('fnsoft_theme') || 'light';
        }

        function setTheme(theme) {
            localStorage.setItem('fnsoft_theme', theme);
            if (theme === 'dark') {
                document.body.classList.add('dark-mode');
                document.getElementById('themeIconHeader').textContent = '☀️';
                document.getElementById('themeLabelHeader').textContent = '浅色';
            } else {
                document.body.classList.remove('dark-mode');
                document.getElementById('themeIconHeader').textContent = '🌙';
                document.getElementById('themeLabelHeader').textContent = '深色';
            }
        }

        function toggleTheme() {
            var current = getTheme();
            setTheme(current === 'dark' ? 'light' : 'dark');
        }

        function initTheme() {
            var theme = getTheme();
            setTheme(theme);
        }

        // ================================================================
        // 标签页切换
        // ================================================================
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(function (el) {
                el.classList.remove('active');
            });
            document.querySelectorAll('.nav-btn').forEach(function (el) {
                el.classList.remove('active');
            });
            var target = document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1));
            if (target) target.classList.add('active');
            document.querySelector('.nav-btn[data-tab="' + tab + '"]').classList.add('active');

            if (tab === 'apps') {
                if (typeof restoreAppsView === 'function') {
                    restoreAppsView();
                } else if (typeof loadApps === 'function') {
                    loadApps();
                }
            }
            if (tab === 'sources') {
                if (typeof loadSources === 'function') {
                    loadSources();
                }
            }
        }

        // ================================================================
        // Toast
        // ================================================================
        function showToast(msg, type) {
            var toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast show ' + (type || '');
            var durations = {success: 2500, error: 4000, warning: 3000, info: 2000};
            var duration = durations[type] || 3000;
            clearTimeout(toast._timer);
            toast._timer = setTimeout(function () {toast.classList.remove('show');}, duration);
        }

        // ================================================================
        // WebSocket
        // ================================================================
        var ws = null;
        var wsReady = false;
        var reconnectTimer = null;

        function connectWS() {
            var url = 'ws://' + window.location.host + '/ws';
            try {
                if (ws && (ws.readyState === WebSocket.CONNECTING || ws.readyState === WebSocket.OPEN)) return;
                ws = new WebSocket(url);
                ws.onopen = function () {console.log('WebSocket 已连接'); wsReady = true;};
                ws.onmessage = function (e) {
                    try {
                        var msg = JSON.parse(e.data);
                        if (typeof handleWsMessage === 'function') {
                            handleWsMessage(msg);
                        }
                    } catch (err) {
                        console.warn('解析WS消息失败:', err);
                    }
                };
                ws.onclose = function () {
                    console.log('WebSocket 已断开');
                    wsReady = false;
                    ws = null;
                    if (reconnectTimer) clearTimeout(reconnectTimer);
                    reconnectTimer = setTimeout(connectWS, 3000);
                };
                ws.onerror = function () {ws.close();};
            } catch (e) {
                wsReady = false;
                if (reconnectTimer) clearTimeout(reconnectTimer);
                reconnectTimer = setTimeout(connectWS, 3000);
            }
        }

        // ================================================================
        // 检查更新
        // ================================================================
        async function checkUpdate() {
            try {
                var resp = await fetch('/api/check-update');
                var data = await resp.json();
                if (data.has_update) {
                    var badge = document.getElementById('updateBadge');
                    badge.style.display = 'inline';
                    badge.title = '发现新版本 ' + data.version;
                    window._updateUrl = data.download_url;
                    console.log('发现新版本:', data.version);
                }
            } catch (e) {
                console.log('检查更新失败:', e);
            }
        }

        function goUpdate() {
            if (window._updateUrl) {
                window.open(window._updateUrl, '_blank');
                showToast('正在跳转下载页面...', 'info');
            } else {
                window.open('https://gitee.com/hhxs2025/fn-appstores/releases', '_blank');
            }
        }

        // ================================================================
        // 页面可见性监听
        // ================================================================
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) {
                var activeTab = document.querySelector('.nav-btn.active');
                if (activeTab && activeTab.dataset.tab === 'apps') {
                    if (typeof restoreAppsView === 'function') {
                        restoreAppsView();
                    } else if (typeof loadApps === 'function') {
                        loadApps();
                    }
                }
            }
        });

        // ================================================================
        // 初始化
        // ================================================================
        document.addEventListener('DOMContentLoaded', function () {
            initTheme();
            connectWS();
            if (typeof loadApps === 'function') {
                setTimeout(function() {
                    loadApps();
                }, 300);
            }
            if (typeof loadLogs === 'function') {
                loadLogs();
            }
            setTimeout(function () {
                if (typeof checkUpdate === 'function') {
                    checkUpdate();
                    setInterval(checkUpdate, 3600000);
                }
            }, 2000);
        });
    </script>

    {% block extra_js %}{% endblock %}

</body>

</html>

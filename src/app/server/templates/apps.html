<style>
    .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 4px;
        flex-shrink: 0;
        margin-bottom: 2px;
        padding: 4px 0 2px;
    }
    .toolbar .left { display: flex; align-items: center; gap: 8px; }
    .toolbar .count { color: var(--text-secondary); font-size: 11px; font-weight: 400; }
    .toolbar .count strong { color: var(--text-primary); font-weight: 500; }
    .toolbar .badge {
        padding: 1px 10px;
        border-radius: 4px;
        font-size: 9px;
        font-weight: 400;
        background: #e8eaed;
        color: #6b6b6b;
    }
    .toolbar .badge.cached { background: #e8eaed; color: #6b6b6b; }
    .toolbar .badge.connected { background: #e8eaed; color: #6b6b6b; }
    .toolbar .badge.loading { background: #e8eaed; color: #6b6b6b; }
    .toolbar .badge.error { background: #f5e6e0; color: #b55a5a; }

    .refresh-btn {
        background: transparent;
        color: var(--text-secondary);
        border: 1px solid #d5d7dd;
        padding: 2px 14px;
        border-radius: 4px;
        font-size: 10px;
        font-weight: 400;
        cursor: pointer;
        min-width: 56px;
        transition: all 0.2s;
    }
    .refresh-btn:hover:not(:disabled) { background: #e8eaed; border-color: #b8bac2; }
    .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .refresh-btn.cooldown { color: var(--text-muted); border-color: var(--border); }

    .search-bar {
        display: flex;
        gap: 4px;
        flex-shrink: 0;
        margin-bottom: 4px;
        padding: 2px 0;
    }
    .search-bar input {
        flex: 1;
        padding: 5px 12px;
        border: 1px solid #d5d7dd;
        border-radius: 6px;
        font-size: 11px;
        outline: none;
        transition: all 0.2s;
        background: #fff;
        color: var(--text-primary);
    }
    .search-bar input:focus { border-color: #b0a8a0; box-shadow: 0 0 0 2px rgba(0,0,0,0.03); }
    .search-bar input::placeholder { color: var(--text-muted); }

    .filter-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        flex-shrink: 0;
        margin-bottom: 4px;
        padding: 2px 0;
        justify-content: flex-start;
    }
    .filter-btn {
        background: transparent;
        border: 1px solid #d5d7dd;
        padding: 2px 12px;
        border-radius: 4px;
        font-size: 10px;
        font-weight: 400;
        cursor: pointer;
        color: var(--text-secondary);
        line-height: 1.4;
        transition: all 0.2s;
    }
    .filter-btn:hover { background: #e8eaed; border-color: #b8bac2; }
    .filter-btn.active { background: #e8eaed; border-color: #b0a8a0; color: var(--text-primary); }

    .type-filter-bar {
        display: flex;
        gap: 4px;
        flex-shrink: 0;
        margin: 4px 0 6px;
        flex-wrap: wrap;
    }
    .type-filter-btn {
        background: transparent;
        border: 1px solid #d5d7dd;
        padding: 2px 12px;
        border-radius: 4px;
        font-size: 10px;
        font-weight: 400;
        cursor: pointer;
        color: var(--text-secondary);
        line-height: 1.4;
        transition: all 0.2s;
    }
    .type-filter-btn:hover { background: #e8eaed; border-color: #b8bac2; }
    .type-filter-btn.active { background: #e8eaed; border-color: #b0a8a0; color: var(--text-primary); }

    .app-grid-wrapper {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
    }
    .app-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 10px;
        flex: 1;
        align-content: start;
        overflow-y: auto;
        padding: 4px 0 8px;
        min-height: 0;
        height: 100%;
        max-height: 100%;
    }

    .app-card {
        background: var(--card-bg);
        border-radius: 10px;
        padding: 14px 16px;
        border: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        cursor: pointer;
        transition: all 0.25s;
        min-height: 148px;
        height: 100%;
        width: 100%;
        box-sizing: border-box;
    }
    .app-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.06); border-color: #c5c7d0; transform: translateY(-1px); background: var(--hover-bg, #fafcfd); }

    .app-card .top { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 4px; flex-shrink: 0; }
    .app-card .icon {
        width: 38px;
        height: 38px;
        border-radius: 8px;
        background: #e8eaed;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        overflow: hidden;
    }
    .app-card .icon img { width: 100%; height: 100%; object-fit: cover; }

    .app-card .info { flex: 1; min-width: 0; }
    .app-card .info .name { font-size: 14px; font-weight: 500; color: var(--text-primary); display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
    .app-card .info .name .app-name-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .app-card .info .version-text { font-size: 9px; color: var(--text-muted); font-weight: 400; flex-shrink: 0; }
    .app-card .info .update-badge { font-size: 8px; color: #8a7a5a; background: #f5efe0; padding: 0 6px; border-radius: 3px; font-weight: 400; flex-shrink: 0; }
    .app-card .info .installed-badge { font-size: 8px; color: #4a7a5a; background: #e6f0e6; padding: 0 6px; border-radius: 3px; font-weight: 400; flex-shrink: 0; }
    .app-card .info .author { font-size: 11px; color: var(--text-secondary); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .app-card .info .source-tag { color: var(--text-muted); font-size: 9px; background: transparent; padding: 0; display: inline-block; margin-top: 2px; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

    .app-card .tags { margin: 2px 0 5px; display: flex; flex-wrap: wrap; gap: 3px; flex-shrink: 0; }
    .app-card .tags .tag { background: #eff6ff; color: #2563eb; font-size: 9px; padding: 0 10px; border-radius: 3px; font-weight: 400; border: none; }

    .app-card .desc { font-size: 11px; color: var(--text-secondary); line-height: 1.4; margin: 0 0 5px; flex: 1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 0; }

    .app-card .actions { display: flex; gap: 4px; margin-top: auto; flex-wrap: wrap; flex-shrink: 0; align-items: center; }
    .app-card .actions .btn {
        padding: 3px 16px;
        border: none;
        border-radius: 4px;
        font-size: 10px;
        font-weight: 400;
        cursor: pointer;
        flex: none;
        text-align: center;
        transition: all 0.2s;
    }
    .app-card .actions .btn-primary { background: #2563ea; color: #fff; }
    .app-card .actions .btn-primary:hover:not(:disabled) { background: #1d4ed8; }
    .app-card .actions .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .app-card .actions .btn-danger { background: transparent; color: #b55a5a; border: 1px solid #e8d0d0; padding: 3px 16px; }
    .app-card .actions .btn-danger:hover:not(:disabled) { background: #f5e8e8; border-color: #d0b0b0; }
    .app-card .actions .btn-warning { background: #fef3c7; color: #92400e; border: none; }
    .app-card .actions .btn-warning:hover:not(:disabled) { background: #fde68a; }
    .app-card .actions .btn-secondary { background: #e6f0e6; color: #4a7a5a; border: none; cursor: default; }
    .app-card .actions .btn-repo {
        background: transparent;
        color: var(--text-secondary);
        border: 1px solid #d5d7dd;
        padding: 3px 12px;
        border-radius: 4px;
        font-size: 10px;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        transition: all 0.2s;
        cursor: pointer;
    }
    .app-card .actions .btn-repo:hover { background: #e8eaed; border-color: #b8bac2; }
    .app-card .actions .download-count { font-size: 10px; color: var(--text-muted); margin-left: auto; white-space: nowrap; }

    .app-card .progress-container { display: none; margin-top: 6px; padding: 4px 0 2px; }
    .app-card .progress-container.show { display: block; }
    .app-card .progress-bar-bg { width: 100%; height: 3px; background: #e8e0d8; border-radius: 2px; overflow: hidden; }
    .app-card .progress-bar-fill { height: 100%; width: 0%; border-radius: 2px; background: #8aacd0; transition: width 0.3s; }
    .app-card .progress-bar-fill.complete { background: #7a9b7a; }
    .app-card .progress-bar-fill.error { background: #c47a7a; }
    .app-card .progress-text { font-size: 9px; color: var(--text-secondary); margin-top: 3px; display: flex; justify-content: space-between; }
    .app-card .progress-text .status-msg { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .app-card .progress-details { font-size: 8px; color: var(--text-muted); margin-top: 1px; display: flex; gap: 10px; flex-wrap: wrap; }
    .app-card .progress-details .speed { color: var(--text-secondary); }

    .app-card .status-text { font-size: 9px; display: none; padding: 1px 0; margin-top: 2px; }
    .app-card .status-text.show { display: block; }
    .app-card .status-text.success { color: #5a8a5a; }
    .app-card .status-text.error { color: #b55a5a; }
    .app-card .status-text.installing { color: var(--text-muted); }

    .empty-state { grid-column: 1 / -1; text-align: center; padding: 40px 20px; color: var(--text-muted); }
    .empty-state .icon { font-size: 36px; margin-bottom: 8px; opacity: 0.5; }
    .empty-state p { font-size: 12px; }

    .pagination {
        display: none;
        justify-content: center;
        align-items: center;
        gap: 8px;
        padding: 4px 0 2px;
        flex-shrink: 0;
    }
    .pagination.show { display: flex; }
    .page-btn {
        background: transparent;
        color: var(--text-secondary);
        border: 1px solid #d5d7dd;
        padding: 1px 12px;
        border-radius: 4px;
        font-size: 10px;
        cursor: pointer;
        transition: all 0.2s;
    }
    .page-btn:hover:not(:disabled) { background: #e8eaed; }
    .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    #pageInfo { color: var(--text-muted); font-size: 11px; }

    /* 深色覆盖 */
    body.dark-mode .app-card { background: #1e2a45; border-color: #2a3a5a; }
    body.dark-mode .app-card:hover { background: #223050; border-color: #3a4a6a; }
    body.dark-mode .search-bar input { background: #1a2a3a; border-color: #2a3a5a; color: #e8e8f0; }
    body.dark-mode .search-bar input:focus { border-color: #4a6a8a; }
    body.dark-mode .filter-btn { border-color: #2a3a5a; color: var(--text-secondary); }
    body.dark-mode .filter-btn:hover { background: #2a3a5a; }
    body.dark-mode .filter-btn.active { background: #2a3a5a; border-color: #4a6a8a; color: var(--text-primary); }
    body.dark-mode .refresh-btn { border-color: #2a3a5a; color: var(--text-secondary); }
    body.dark-mode .refresh-btn:hover:not(:disabled) { background: #2a3a5a; }
    body.dark-mode .app-card .actions .btn-repo { border-color: #2a3a5a; color: var(--text-secondary); }
    body.dark-mode .app-card .actions .btn-repo:hover { background: #2a3a5a; }

    @media (max-width: 768px) {
        .app-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
        .app-card { padding: 12px 14px; }
        .app-card .info .name { font-size: 13px; }
        .app-card .desc { font-size: 10px; }
    }

    @media (max-width: 550px) {
        .app-grid { grid-template-columns: repeat(2, 1fr); gap: 6px; }
        .app-card { padding: 10px 12px; min-height: 120px; }
        .app-card .info .name { font-size: 12px; }
        .app-card .info .author { font-size: 10px; }
        .app-card .desc { font-size: 9px; -webkit-line-clamp: 1; }
        .app-card .icon { width: 32px; height: 32px; font-size: 14px; }
        .app-card .progress-details { font-size: 7px; }
    }

    @media (max-width: 400px) {
        .app-grid { grid-template-columns: 1fr; gap: 6px; }
        .app-card .top { flex-direction: row; align-items: center; }
        .app-card .icon { width: 28px; height: 28px; font-size: 12px; }
    }
</style>

<div class="toolbar">
    <div class="left">
        <span class="badge" id="statusBadge">在线</span>
        <span class="count">共 <strong id="appCount">0</strong> 个应用</span>
        <span class="count" style="font-size:10px;color:var(--text-muted);" id="lastRefresh">--</span>
    </div>
    <button class="refresh-btn" id="refreshBtn" onclick="refreshApps()">刷新</button>
</div>

<div class="search-bar">
    <input type="text" id="searchInput" placeholder="搜索应用名称、描述、作者..." oninput="searchApps()">
</div>

<div class="filter-bar" id="filterBar"></div>

<div class="type-filter-bar">
    <button class="type-filter-btn active" data-type="all" onclick="filterByAppType('all')">全部</button>
    <button class="type-filter-btn" data-type="docker" onclick="filterByAppType('docker')">Docker应用</button>
    <button class="type-filter-btn" data-type="native" onclick="filterByAppType('native')">原生应用</button>
</div>

<div class="app-grid-wrapper">
    <div class="app-grid" id="appGrid"><div class="empty-state"><div class="icon">·</div><p>加载中...</p></div></div>
    <div class="pagination" id="pagination">
        <button class="page-btn" onclick="prevPage()" id="prevBtn">上一页</button>
        <span id="pageInfo">1/1</span>
        <button class="page-btn" onclick="nextPage()" id="nextBtn">下一页</button>
    </div>
</div>

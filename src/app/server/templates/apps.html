{{define "apps"}}
<style>
    /* ========= 视图切换 ========= */
    .apps-view {
        display: none;
        flex: 1;
        min-height: 0;
        overflow: hidden;
    }

    #appsListView.active {
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    #appsDetailView {
        padding: 4px 0 20px;
        overflow-y: auto;
        overflow-x: hidden;
    }

    #appsDetailView.active {
        display: block;
        flex: 1;
        min-height: 0;
    }

    /* ========= 工具栏 ========= */
    .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 4px;
        padding: 4px 0 2px;
        flex-shrink: 0;
    }

    .toolbar .left {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .toolbar .count {
        color: var(--text-secondary);
        font-size: 11px;
    }

    .toolbar .count strong {
        color: var(--text-primary);
        font-weight: 500;
    }

    .toolbar .badge {
        padding: 1px 10px;
        border-radius: 4px;
        font-size: 9px;
        background: #e8eaed;
        color: #6b6b6b;
    }

    body.dark-mode .toolbar .badge {
        background: #2a3a5a;
        color: #8a9aaa;
    }

    .toolbar .right {
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .toolbar .sort-select {
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 2px 6px;
        font-size: 10px;
        color: var(--text-secondary);
        height: 24px;
        cursor: pointer;
        outline: none;
    }

    .toolbar .refresh-btn {
        background: transparent;
        color: var(--text-secondary);
        border: 1px solid var(--border);
        padding: 2px 14px;
        border-radius: 4px;
        font-size: 10px;
        cursor: pointer;
        min-width: 48px;
        white-space: nowrap;
        transition: all 0.2s;
    }

    .toolbar .refresh-btn:hover:not(:disabled) {
        background: var(--bg);
    }

    .toolbar .refresh-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    /* ========= 搜索栏 ========= */
    .search-bar {
        display: flex;
        gap: 4px;
        flex-shrink: 0;
        margin-bottom: 4px;
    }

    .search-bar input {
        flex: 1;
        padding: 5px 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        font-size: 11px;
        outline: none;
        background: var(--card-bg);
        color: var(--text-primary);
    }

    .search-bar input:focus {
        border-color: #b0a8a0;
    }

    /* ★ 加在这里：宽屏时隐藏应用页搜索框（侧边栏已有全局搜索） */
    @media (min-width: 1101px) {
        .search-bar {
            display: none;
        }
    }

    /* ========= 筛选 ========= */
    .filter-bar,
    .type-filter-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        flex-shrink: 0;
        padding: 2px 0;
    }

    .filter-bar {
        margin-bottom: 4px;
    }

    .type-filter-bar {
        margin: 4px 0 6px;
        align-items: center;
    }

    .filter-btn,
    .type-filter-btn {
        background: transparent;
        border: 1px solid var(--border);
        padding: 2px 12px;
        border-radius: 4px;
        font-size: 10px;
        cursor: pointer;
        color: var(--text-secondary);
        white-space: nowrap;
        transition: all 0.2s;
    }

    .filter-btn:hover,
    .type-filter-btn:hover {
        background: var(--bg);
    }

    .filter-btn.active,
    .type-filter-btn.active {
        background: var(--bg);
        border-color: #b0a8a0;
        color: var(--text-primary);
    }

    .source-filter-select {
        background: transparent;
        border: 1px solid var(--border);
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 10px;
        color: var(--text-secondary);
        height: 24px;
        cursor: pointer;
        outline: none;
    }

    /* ========= 应用网格 ========= */
    .app-grid-wrapper {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    .app-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 10px;
        flex: 1;
        align-content: start;
        overflow-y: auto;
        padding: 4px 0 8px;
        min-height: 0;
    }

    /* ========= 卡片 ========= */
    .app-card {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.2s;
        min-height: 76px;
    }

    .app-card:hover {
        border-color: #c5c7d0;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        transform: translateY(-1px);
    }

    .card-icon {
        width: 42px;
        height: 42px;
        border-radius: 10px;
        background: #e8eaed;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        overflow: hidden;
    }

    .card-icon img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .card-info {
        flex: 1;
        min-width: 0;
    }

    .card-name {
        font-size: 14px;
        font-weight: 500;
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        display: flex;
        align-items: center;
    }

    .card-subtitle {
        font-size: 11px;
        color: var(--text-muted);
        margin-top: 3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .rating-inline {
        font-size: 11px;
        color: #B8860B;
        margin-left: 6px;
        font-weight: 500;
        flex-shrink: 0;
    }

    .update-dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #B45309;
        border-radius: 50%;
        margin-left: 6px;
        flex-shrink: 0;
    }

    .card-action {
        flex-shrink: 0;
    }

    .card-btn {
        border: none;
        padding: 6px 18px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        white-space: nowrap;
        transition: all 0.15s;
    }

    .btn-install {
        background: #EAF2FF;
        color: #2563ea;
    }

    .btn-install:hover {
        background: #D6E6FF;
    }

    .btn-update {
        background: #FFF4E5;
        color: #B45309;
    }

    .btn-update:hover {
        background: #FFE8CC;
    }

    .btn-opened {
        background: #F0F0F0;
        color: #6B6B6B;
        cursor: default;
    }

    body.dark-mode .btn-install {
        background: rgba(37, 99, 235, 0.18);
        color: #7FB0FF;
    }

    body.dark-mode .btn-install:hover {
        background: rgba(37, 99, 235, 0.28);
    }

    body.dark-mode .btn-update {
        background: rgba(180, 83, 9, 0.22);
        color: #FBBF24;
    }

    body.dark-mode .btn-update:hover {
        background: rgba(180, 83, 9, 0.32);
    }

    body.dark-mode .btn-opened {
        background: #2a3a5a;
        color: #8a9aaa;
    }

    /* ========= 空状态 ========= */
    .empty-state {
        grid-column: 1 / -1;
        text-align: center;
        padding: 60px 20px;
    }

    .empty-state .icon {
        font-size: 36px;
        margin-bottom: 8px;
        opacity: 0.4;
    }

    .empty-state p {
        font-size: 12px;
        color: var(--text-muted);
    }

    /* ★ 分页已取消：DOM 保留但强制隐藏 */
    .pagination {
        display: none !important;
    }

    /* ============================================================ */
    /* ========= 详情视图 ========= */
    /* ============================================================ */
    .detail-back {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: transparent;
        border: none;
        color: var(--text-secondary);
        font-size: 13px;
        cursor: pointer;
        padding: 6px 10px 6px 0;
        margin-bottom: 8px;
        transition: color 0.15s;
    }

    .detail-back:hover {
        color: var(--text-primary);
    }

    .detail-back svg {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
    }

    .detail-head {
        display: flex;
        gap: 16px;
        align-items: flex-start;
        padding: 4px 0 20px;
        flex-shrink: 0;
    }

    .detail-icon {
        width: 72px;
        height: 72px;
        border-radius: 16px;
        background: #e8eaed;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        overflow: hidden;
    }

    .detail-icon img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .detail-head-info {
        flex: 1;
        min-width: 0;
        padding-top: 4px;
    }

    .detail-title {
        font-size: 20px;
        font-weight: 600;
        color: var(--text-primary);
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .detail-title .rating-inline {
        font-size: 13px;
        margin-left: 0;
    }

    .detail-subtitle {
        font-size: 13px;
        color: var(--text-muted);
        margin-top: 6px;
    }

    .detail-actions {
        display: flex;
        gap: 8px;
        margin-top: 14px;
        flex-wrap: wrap;
    }

    .detail-actions .card-btn {
        padding: 7px 24px;
        font-size: 13px;
    }

    .detail-actions .repo-btn {
        display: inline-flex;
        align-items: center;
        background: transparent;
        color: var(--text-secondary);
        border: 1px solid var(--border);
        padding: 7px 18px;
        border-radius: 6px;
        font-size: 13px;
        text-decoration: none;
        white-space: nowrap;
        transition: all 0.15s;
    }

    .detail-actions .repo-btn:hover {
        background: var(--bg);
        border-color: #c5c7d0;
    }

    .detail-meta {
        display: flex;
        gap: 36px;
        padding: 16px 0;
        border-top: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
        flex-wrap: wrap;
        flex-shrink: 0;
    }

    .detail-meta .meta-item {
        min-width: 60px;
    }

    .detail-meta .meta-label {
        font-size: 11px;
        color: var(--text-muted);
        margin-bottom: 5px;
    }

    .detail-meta .meta-value {
        font-size: 14px;
        font-weight: 500;
        color: var(--text-primary);
    }

    .detail-section {
        padding: 22px 0 0;
        flex-shrink: 0;
    }

    .detail-section-title {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 14px;
    }

    .detail-section-body {
        font-size: 13px;
        color: var(--text-secondary);
        line-height: 1.8;
    }

    .detail-section-body p {
        margin: 0 0 8px;
    }

    .detail-section-body p:last-child {
        margin-bottom: 0;
    }

    .changelog-list {
        padding-left: 22px;
        margin: 0;
    }

    .changelog-list li {
        font-size: 13px;
        color: var(--text-secondary);
        line-height: 1.9;
        padding-left: 4px;
    }

    .carousel-container {
        position: relative;
        overflow: hidden;
        border-radius: 8px;
        background: #e8eaed;
        min-height: 100px;
        display: none;
    }

    .carousel-track {
        display: flex;
        transition: transform 0.35s ease;
    }

    .carousel-track img {
        width: 100%;
        flex-shrink: 0;
        max-height: 380px;
        object-fit: contain;
        background: var(--bg);
        cursor: pointer;
    }

    .carousel-btn {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(60, 60, 60, 0.35);
        color: #fff;
        border: none;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 16px;
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 5;
    }

    .carousel-btn:hover {
        background: rgba(60, 60, 60, 0.6);
    }

    .carousel-btn.prev {
        left: 10px;
    }

    .carousel-btn.next {
        right: 10px;
    }

    .carousel-btn.show {
        display: flex;
    }

    .carousel-dots {
        display: flex;
        justify-content: center;
        gap: 4px;
        padding: 8px 0 2px;
    }

    .carousel-dots .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #d0c8c0;
        border: none;
        cursor: pointer;
        padding: 0;
        transition: all 0.15s;
    }

    .carousel-dots .dot.active {
        background: #8a8a8a;
        width: 16px;
        border-radius: 3px;
    }

    .rating-row {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
    }

    .rating-stars {
        display: inline-flex;
        gap: 3px;
        cursor: pointer;
        user-select: none;
    }

    .rating-stars .star {
        font-size: 24px;
        color: #d0d0d0;
        transition: color 0.15s, transform 0.15s;
        line-height: 1;
    }

    .rating-stars .star.active,
    .rating-stars .star.hover {
        color: #f5b301;
        transform: scale(1.05);
    }

    .rating-info {
        font-size: 13px;
        color: var(--text-muted);
    }

    .rating-info.loading {
        font-style: italic;
    }

    .rating-info.error {
        color: #b55a5a;
    }

    .my-rating-hint {
        font-size: 12px;
        color: #B8860B;
        padding: 6px 0 0;
        display: none;
    }

    .my-rating-hint.show {
        display: block;
    }

    body.dark-mode .rating-stars .star {
        color: #3a4a6a;
    }

    body.dark-mode .rating-stars .star.active,
    body.dark-mode .rating-stars .star.hover {
        color: #ffd76a;
    }

    body.dark-mode .detail-icon {
        background: #2a3a5a;
    }

    body.dark-mode .card-icon {
        background: #2a3a5a;
    }

    body.dark-mode .carousel-container {
        background: #2a3a5a;
    }

    @media (max-width: 768px) {
        .app-grid {
            grid-template-columns: 1fr;
            gap: 8px;
        }

        /* ★ 手机端：工具栏换行布局，避免按钮被挤压成竖排 */
        .toolbar {
            flex-wrap: wrap;
            row-gap: 6px;
        }

        .toolbar .left {
            flex: 1 1 auto;
            min-width: 0;
        }

        .toolbar .right {
            flex: 1 1 auto;
            justify-content: flex-end;
        }

        .toolbar .count,
        .toolbar .sort-select,
        .toolbar .refresh-btn {
            flex-shrink: 0;
        }

        /* ★ 手机端隐藏"上次刷新"，节省横向空间 */
        #lastRefresh {
            display: none;
        }

        .detail-icon {
            width: 60px;
            height: 60px;
            font-size: 26px;
        }

        .detail-title {
            font-size: 17px;
        }

        .detail-meta {
            gap: 24px;
        }

        .detail-meta .meta-item {
            min-width: 50px;
        }

        .detail-meta .meta-value {
            font-size: 13px;
        }

        .detail-actions .card-btn {
            padding: 6px 18px;
            font-size: 12px;
        }

        .detail-actions .repo-btn {
            padding: 6px 14px;
            font-size: 12px;
        }
    }
</style>

<div id="appsListView" class="apps-view active">

    <div class="toolbar">
        <div class="left">
            <span class="badge" id="statusBadge">在线</span>
            <span class="count">共 <strong id="appCount">0</strong> 个应用</span>
            <span class="count" style="font-size:10px;color:var(--text-muted);" id="lastRefresh">--</span>
        </div>
        <div class="right">
            <select class="sort-select" id="sortSelect" onchange="changeSort()">
                <option value="default">默认排序</option>
                <option value="name">按名称</option>
                <option value="downloads">按下载量</option>
                <option value="updated">按更新时间</option>
            </select>
            <button class="refresh-btn" onclick="showManualInstall()">手动安装</button>
            <button class="refresh-btn" id="refreshBtn" onclick="refreshApps()">刷新</button>
        </div>
    </div>

    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="搜索应用名称、描述、作者..." oninput="searchAppsDebounced()">
    </div>

    <div class="filter-bar" id="filterBar"></div>

    <div class="type-filter-bar">
        <button class="type-filter-btn active" data-type="all" onclick="filterByAppType('all')">全部</button>
        <button class="type-filter-btn" data-type="docker" onclick="filterByAppType('docker')">Docker应用</button>
        <button class="type-filter-btn" data-type="native" onclick="filterByAppType('native')">原生应用</button>
        <select class="source-filter-select" id="sourceFilterSelect" onchange="filterBySource(this.value)">
            <option value="all">全部源</option>
        </select>
    </div>

    <div class="app-grid-wrapper">
        <div class="app-grid" id="appGrid">
            <div class="empty-state">
                <div class="icon">·</div>
                <p>加载中...</p>
            </div>
        </div>
        <!-- 分页 DOM 保留但被 CSS 隐藏（取消分页） -->
        <div class="pagination" id="pagination">
            <button class="page-btn" onclick="prevPage()" id="prevBtn">上一页</button>
            <span id="pageInfo">1/1</span>
            <button class="page-btn" onclick="nextPage()" id="nextBtn">下一页</button>
        </div>
    </div>

</div>

<div id="appsDetailView" class="apps-view">

    <button class="detail-back" onclick="backToAppsList()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
        <span>返回</span>
    </button>

    <div class="detail-head">
        <div class="detail-icon" id="detailIcon">·</div>
        <div class="detail-head-info">
            <div class="detail-title">
                <span id="detailTitle">应用名</span>
                <span class="rating-inline" id="detailRatingInline" style="display:none;"></span>
            </div>
            <div class="detail-subtitle" id="detailSubtitle">—</div>
            <div class="detail-actions">
                <button class="card-btn btn-install" id="detailInstallBtn" onclick="detailInstall()">安装</button>
                <a href="#" id="detailRepoBtn" target="_blank" class="repo-btn" style="display:none;">查看 README</a>
            </div>
        </div>
    </div>

    <div class="detail-meta">
        <div class="meta-item">
            <div class="meta-label">开发者</div>
            <div class="meta-value" id="detailMetaAuthor">-</div>
        </div>
        <div class="meta-item">
            <div class="meta-label">版本</div>
            <div class="meta-value" id="detailMetaVersion">-</div>
        </div>
        <div class="meta-item">
            <div class="meta-label">来源</div>
            <div class="meta-value" id="detailMetaSource">-</div>
        </div>
        <div class="meta-item">
            <div class="meta-label">下载</div>
            <div class="meta-value" id="detailMetaDownloads">-</div>
        </div>
        <div class="meta-item">
            <div class="meta-label">更新</div>
            <div class="meta-value" id="detailMetaUpdated">-</div>
        </div>
        <div class="meta-item">
            <div class="meta-label">类型</div>
            <div class="meta-value" id="detailMetaType">-</div>
        </div>
    </div>

    <div class="detail-section" id="detailChangelogSection" style="display:none;">
        <div class="detail-section-title">更新内容</div>
        <div class="detail-section-body" id="detailChangelog"></div>
    </div>

    <div class="detail-section">
        <div class="detail-section-title">应用介绍</div>
        <div class="detail-section-body" id="detailDesc">暂无描述</div>
    </div>

    <div class="detail-section" id="detailScreenshotsSection" style="display:none;">
        <div class="detail-section-title">预览</div>
        <div class="carousel-container" id="carouselContainer">
            <div class="carousel-track" id="carouselTrack"></div>
            <button class="carousel-btn prev" id="carouselPrev" onclick="carouselPrev()">‹</button>
            <button class="carousel-btn next" id="carouselNext" onclick="carouselNext()">›</button>
            <div class="carousel-dots" id="carouselDots"></div>
        </div>
    </div>

    <div class="detail-section">
        <div class="detail-section-title">评分</div>
        <div class="rating-row">
            <span class="rating-stars" id="ratingStars">
                <span class="star" data-value="1">★</span>
                <span class="star" data-value="2">★</span>
                <span class="star" data-value="3">★</span>
                <span class="star" data-value="4">★</span>
                <span class="star" data-value="5">★</span>
            </span>
            <span class="rating-info" id="ratingInfo">加载中...</span>
        </div>
        <div class="my-rating-hint" id="myRatingHint"></div>
    </div>

</div>
{{end}}

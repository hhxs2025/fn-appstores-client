<style>
    .home-container {
        width: 100%;
        max-width: 100%;
        margin: 0 auto;
        padding: 0;
        overflow-y: auto;
        height: 100%;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .home-top-row {
        display: flex;
        flex-direction: row;
        gap: 0;
        border-radius: 10px;
        overflow: hidden;
        background: var(--card-bg);
        border: 1px solid var(--border);
        height: 320px;
        flex-shrink: 0;
    }

    .home-carousel-wrapper {
        flex: 0 0 70%;
        position: relative;
        overflow: hidden;
        background: var(--card-bg);
        height: 100%;
    }
    .home-carousel-track {
        display: flex;
        height: 100%;
        transition: transform 0.5s ease;
        will-change: transform;
    }
    .home-carousel-slide {
        flex: 0 0 100%;
        height: 100%;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }
    .home-carousel-btn {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(0,0,0,0.35);
        color: white;
        border: none;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 5;
        transition: background 0.2s;
        opacity: 0.5;
    }
    .home-carousel-btn:hover { background: rgba(0,0,0,0.65); opacity: 1; }
    .home-carousel-btn.prev { left: 8px; }
    .home-carousel-btn.next { right: 8px; }

    .home-carousel-dots {
        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 6px;
        z-index: 5;
    }
    .home-carousel-dots .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: rgba(255,255,255,0.4);
        border: none;
        cursor: pointer;
        padding: 0;
        transition: all 0.2s;
    }
    .home-carousel-dots .dot.active { background: #fff; transform: scale(1.2); }

    .home-notice-wrapper {
        flex: 0 0 30%;
        padding: 16px 18px;
        overflow: hidden;
        background: var(--card-bg);
        border-left: 1px solid var(--border);
        height: 100%;
        display: flex;
        flex-direction: column;
        gap: 4px;
    }
    .home-notice-wrapper .notice-label {
        font-size: 11px;
        font-weight: 600;
        color: var(--blue);
        letter-spacing: 0.5px;
        flex-shrink: 0;
    }

    .notice-records {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding-right: 2px;
    }
    .notice-record {
        padding: 4px 6px;
        border-radius: 4px;
        cursor: pointer;
        transition: background 0.15s;
        border-bottom: 1px solid var(--border);
    }
    .notice-record:last-child { border-bottom: none; }
    .notice-record:hover { background: var(--bg); }
    .notice-record .record-date { font-size: 9px; color: var(--text-muted); }
    .notice-record .record-title {
        font-size: 12px;
        font-weight: 500;
        color: var(--text-primary);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .notice-more {
        font-size: 11px;
        color: var(--blue);
        cursor: pointer;
        padding: 4px 6px;
        text-align: right;
        flex-shrink: 0;
    }
    .notice-more:hover { text-decoration: underline; }

    .home-quick-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        flex-shrink: 0;
    }

    .home-quick-card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        min-height: 160px;
        max-height: 280px;
        overflow: hidden;
        transition: all 0.2s;
    }
    .home-quick-card:hover { border-color: var(--blue); box-shadow: 0 2px 8px rgba(37,99,235,0.06); }
    .home-quick-card .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 6px;
        flex-shrink: 0;
    }
    .home-quick-card .card-header .title { font-size: 13px; font-weight: 700; color: var(--text-primary); }
    .home-quick-card .card-header .badge {
        font-size: 10px;
        color: var(--text-muted);
        background: var(--bg);
        padding: 0 8px;
        border-radius: 10px;
        flex-shrink: 0;
    }
    .home-quick-card .card-list {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 3px;
    }
    .home-quick-card .card-list .item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 3px 4px;
        border-radius: 4px;
        font-size: 12px;
        color: var(--text-secondary);
        cursor: pointer;
        transition: background 0.15s;
    }
    .home-quick-card .card-list .item:hover { background: var(--bg); }
    .home-quick-card .card-list .item .icon-sm {
        width: 20px;
        height: 20px;
        border-radius: 4px;
        flex-shrink: 0;
        overflow: hidden;
        background: #e8eaed;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
    }
    .home-quick-card .card-list .item .icon-sm img { width: 100%; height: 100%; object-fit: cover; }
    .home-quick-card .card-list .item .name {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .home-quick-card .card-list .item .meta {
        font-size: 10px;
        color: var(--text-muted);
        flex-shrink: 0;
        margin-left: 4px;
    }
    .home-quick-card .card-list .empty {
        font-size: 11px;
        color: var(--text-muted);
        text-align: center;
        padding: 12px 0;
    }

    @media (max-width: 768px) {
        .home-top-row {
            flex-direction: column;
            height: auto;
            min-height: 340px;
        }
        .home-carousel-wrapper {
            flex: 0 0 auto;
            width: 100%;
            height: 200px;
            min-height: 160px;
        }
        .home-notice-wrapper {
            flex: 0 0 auto;
            width: 100%;
            border-left: none;
            border-top: 1px solid var(--border);
            min-height: 100px;
            max-height: 220px;
            padding: 12px 16px;
        }
        .home-quick-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .home-quick-card { min-height: 140px; max-height: 220px; }
        .home-quick-card .card-list .item { font-size: 11px; }
    }

    @media (max-width: 550px) {
        .home-top-row { min-height: 280px; }
        .home-carousel-wrapper { height: 150px; min-height: 120px; }
        .home-carousel-btn { width: 26px; height: 26px; font-size: 13px; }
        .home-carousel-btn.prev { left: 4px; }
        .home-carousel-btn.next { right: 4px; }
        .home-notice-wrapper { max-height: 180px; min-height: 70px; padding: 10px 14px; }
        .notice-record .record-title { font-size: 11px; }
        .home-quick-grid { grid-template-columns: 1fr 1fr; gap: 6px; }
        .home-quick-card { min-height: 120px; max-height: 200px; padding: 10px 12px; }
        .home-quick-card .card-header .title { font-size: 12px; }
        .home-quick-card .card-list .item { font-size: 10px; padding: 2px 3px; }
    }

    @media (max-width: 400px) {
        .home-top-row { min-height: 240px; }
        .home-carousel-wrapper { height: 120px; min-height: 100px; }
        .home-carousel-btn { width: 22px; height: 22px; font-size: 11px; }
        .home-notice-wrapper { max-height: 140px; min-height: 60px; padding: 8px 12px; }
        .notice-record .record-title { font-size: 10px; }
        .home-quick-grid { grid-template-columns: 1fr; gap: 6px; }
        .home-quick-card { min-height: 100px; max-height: 180px; }
    }
</style>

<div class="home-container" id="homeContainer">
    <div class="home-top-row">
        <div class="home-carousel-wrapper" id="homeCarouselWrapper">
            <div class="home-carousel-track" id="homeCarouselTrack"></div>
            <button class="home-carousel-btn prev" onclick="homeCarouselPrev(event)">‹</button>
            <button class="home-carousel-btn next" onclick="homeCarouselNext(event)">›</button>
            <div class="home-carousel-dots" id="homeCarouselDots"></div>
        </div>
        <div class="home-notice-wrapper" id="homeNoticeWrapper">
            <div class="notice-label">📢 公告记录</div>
            <div class="notice-records" id="homeNoticeContent">
                <div style="color:var(--text-muted);font-size:12px;text-align:center;padding:12px 0;">加载中...</div>
            </div>
        </div>
    </div>

    <div class="home-quick-grid">
        <div class="home-quick-card" id="quickInstalled">
            <div class="card-header"><span class="title">已安装</span><span class="badge" id="quickInstalledCount">0</span></div>
            <div class="card-list" id="quickInstalledList"><div class="empty">加载中...</div></div>
        </div>
        <div class="home-quick-card" id="quickUpdatable">
            <div class="card-header"><span class="title">可更新</span><span class="badge" id="quickUpdatableCount">0</span></div>
            <div class="card-list" id="quickUpdatableList"><div class="empty">加载中...</div></div>
        </div>
        <div class="home-quick-card" id="quickHot">
            <div class="card-header"><span class="title">热度榜</span><span class="badge">Top10</span></div>
            <div class="card-list" id="quickHotList"><div class="empty">加载中...</div></div>
        </div>
        <div class="home-quick-card" id="quickNewest">
            <div class="card-header"><span class="title">新应用</span><span class="badge">最新</span></div>
            <div class="card-list" id="quickNewestList"><div class="empty">加载中...</div></div>
        </div>
    </div>
</div>

<script>
// 注意：以下函数由 index.html 统一调用，此处仅提供定义（已做空值保护）
function updateHomeQuickCards() {
    // 检查全局数据是否就绪
    if (typeof allAppsData === 'undefined' || !allAppsData || allAppsData.length === 0) {
        ['quickInstalledList', 'quickUpdatableList', 'quickHotList', 'quickNewestList'].forEach(function(id) {
            var el = document.getElementById(id);
            if (el) el.innerHTML = '<div class="empty">加载中...</div>';
        });
        return;
    }
    var filteredData = allAppsData.filter(function(app) { return app.id !== 'fn-appstores-client'; });
    var installed = filteredData.filter(function(app) { return app.installed; });
    var installedCount = document.getElementById('quickInstalledCount');
    if (installedCount) installedCount.textContent = installed.length;
    renderQuickList('quickInstalledList', installed, 'installed');

    var updatable = filteredData.filter(function(app) { return app.has_update; });
    var updatableCount = document.getElementById('quickUpdatableCount');
    if (updatableCount) updatableCount.textContent = updatable.length;
    renderQuickList('quickUpdatableList', updatable, 'updatable');

    var hot = filteredData.slice().sort(function(a, b) { return (b.downloads || 0) - (a.downloads || 0); }).slice(0, 10);
    renderQuickList('quickHotList', hot, 'hot');

    var newest = filteredData.slice().sort(function(a, b) {
        return new Date(b.updated_at || '1970-01-01') - new Date(a.updated_at || '1970-01-01');
    }).slice(0, 10);
    renderQuickList('quickNewestList', newest, 'newest');
}

function renderQuickList(containerId, apps, type) {
    var container = document.getElementById(containerId);
    if (!container) return;
    if (!apps || apps.length === 0) { container.innerHTML = '<div class="empty">暂无应用</div>'; return; }
    var html = '';
    apps.forEach(function(app) {
        var iconHtml = app.icon ? '<img src="' + app.icon + '" alt="">' : '·';
        var meta = type === 'hot' ? '↓ ' + (app.downloads || 0) :
            type === 'installed' ? 'v' + (app.installed_version || app.version) :
            type === 'updatable' ? '⬆ ' + app.version :
            '📅 ' + (app.updated_at || '');
        html += '<div class="item" onclick="openDetail(\'' + app.id + '\')">' +
            '<span class="icon-sm">' + iconHtml + '</span>' +
            '<span class="name">' + app.name + '</span>' +
            '<span class="meta">' + meta + '</span>' +
            '</div>';
    });
    container.innerHTML = html;
}

// 注意：loadHome 等已在 index.html 中定义并调用，此处不重复定义
</script>

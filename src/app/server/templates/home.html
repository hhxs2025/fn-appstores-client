<meta data-page-node-id="Sp3HINktGWeKRaTDubFhD7" charset="UTF-8"><!--pnid:Be24xsA2tdlfi9ThMb00MM-->{{define "home"}}
<style data-page-node-id="gJKMvuXvMi4kNFtrCuUtxv" data-pnid-children="zPPLGXC6XoTBuPBsam1BaW">
    /* ★ 隐藏整体页面的滚动条，但保留滚动能力 */
    .home-container {
        width: 100%;
        max-width: 100%;
        margin: 0 auto;
        padding: 0;
        overflow-y: auto;
        scrollbar-width: none; /* Firefox */
        height: 100%;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    .home-container::-webkit-scrollbar { display: none; } /* Chrome/Safari */

    .home-top-row {
        display: flex;
        flex-direction: row;
        gap: 0;
        border-radius: 10px;
        overflow: hidden;
        background: var(--card-bg);
        border: 1px solid var(--border);
        height: 320px;
        flex-shrink: 0;
    }

    .home-carousel-wrapper {
        flex: 0 0 70%;
        position: relative;
        overflow: hidden;
        background: var(--card-bg);
        height: 100%;
    }
    .home-carousel-track {
        display: flex;
        height: 100%;
        transition: transform 0.5s ease;
        will-change: transform;
    }
    .home-carousel-slide {
        flex: 0 0 100%;
        height: 100%;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }
    .home-carousel-btn {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(0,0,0,0.35);
        color: white;
        border: none;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 5;
        transition: background 0.2s;
        opacity: 0.5;
    }
    .home-carousel-btn:hover { background: rgba(0,0,0,0.65); opacity: 1; }
    .home-carousel-btn.prev { left: 8px; }
    .home-carousel-btn.next { right: 8px; }

    .home-carousel-dots {
        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 6px;
        z-index: 5;
    }
    .home-carousel-dots .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: rgba(255,255,255,0.4);
        border: none;
        cursor: pointer;
        padding: 0;
        transition: all 0.2s;
    }
    .home-carousel-dots .dot.active { background: #fff; transform: scale(1.2); }

    /* ★ 新增：顶部左侧毛玻璃数据概览浮层 */
    .home-banner-overlay {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 10;
        background: rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 12px;
        padding: 16px 20px;
        color: #fff;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        transition: all 0.3s ease;
        pointer-events: none; /* 防止遮挡底层轮播图的点击 */
    }
    .home-banner-overlay .welcome {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 8px;
        letter-spacing: 0.5px;
        text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }
    .home-banner-overlay .stats {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.8);
    }
    .home-banner-overlay .stats strong {
        color: #fff;
        font-size: 15px;
        font-weight: 700;
        margin: 0 2px;
    }
    .home-banner-overlay .stats-divider {
        width: 1px;
        height: 12px;
        background: rgba(255, 255, 255, 0.3);
    }
    /* 如果没配轮播图，把浮层底色加深以适配浅色背景 */
    .home-carousel-wrapper.no-image .home-banner-overlay {
        background: rgba(30, 41, 59, 0.75);
    }

    .home-notice-wrapper {
        flex: 0 0 30%;
        padding: 16px 18px;
        overflow: hidden;
        background: var(--card-bg);
        border-left: 1px solid var(--border);
        height: 100%;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    .home-notice-wrapper .notice-label {
        font-size: 14px; 
        font-weight: 600;
        color: var(--blue);
        letter-spacing: 0.5px;
        flex-shrink: 0;
    }

    /* ★ 隐藏公告列表的滚动条 */
    .notice-records {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding-right: 2px;
        scrollbar-width: none;
    }
    .notice-records::-webkit-scrollbar { display: none; }

    .notice-record {
        position: relative;
        padding: 6px 6px 6px 14px;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.15s;
        border-bottom: 1px solid var(--border);
    }
    .notice-record:last-child { border-bottom: none; }
    .notice-record:hover { background: var(--bg); }

    .notice-record .record-unread-dot {
        position: absolute;
        left: 3px;
        top: 50%;
        transform: translateY(-50%);
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #e53935;
        box-shadow: 0 0 0 2px var(--card-bg);
        display: none;
    }
    .notice-record.unread .record-unread-dot {
        display: block;
        animation: noticeUnreadPulse 1.8s ease-in-out infinite;
    }
    @keyframes noticeUnreadPulse {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.55; }
    }

    .notice-record.unread .record-title {
        font-weight: 600;
    }

    .notice-record .record-date { 
        font-size: 11px; 
        color: var(--text-muted); 
        margin-bottom: 2px;
    }
    .notice-record .record-title {
        font-size: 13px; 
        font-weight: 500;
        color: var(--text-primary);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .notice-all-item {
        position: relative;
        padding-left: 14px;
    }
    .notice-all-item .notice-all-unread {
        position: absolute;
        left: 0;
        top: 6px;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #e53935;
        display: none;
    }
    .notice-all-item.unread .notice-all-unread { display: block; }

    .notice-more {
        font-size: 13px; 
        color: var(--blue);
        cursor: pointer;
        padding: 6px 6px;
        text-align: right;
        flex-shrink: 0;
    }
    .notice-more:hover { text-decoration: underline; }

    .home-quick-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        flex-shrink: 0;
    }

    .home-quick-card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        min-height: 160px;
        max-height: 280px;
        overflow: hidden;
        transition: all 0.2s;
    }
    .home-quick-card:hover { border-color: var(--blue); box-shadow: 0 2px 8px rgba(37,99,235,0.06); }
    
    .home-quick-card .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
        flex-shrink: 0;
    }
    .home-quick-card .card-header .title { 
        font-size: 15px; 
        font-weight: 700; 
        color: var(--text-primary); 
    }
    .home-quick-card .card-header .badge {
        font-size: 12px;
        color: var(--text-muted);
        background: var(--bg);
        padding: 1px 8px;
        border-radius: 10px;
        flex-shrink: 0;
    }
    
    /* ★ 隐藏快捷卡片内部的滚动条 */
    .home-quick-card .card-list {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 4px;
        scrollbar-width: none;
    }
    .home-quick-card .card-list::-webkit-scrollbar { display: none; }
    
    .home-quick-card .card-list .item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 4px;
        border-radius: 6px;
        font-size: 14px; 
        color: var(--text-secondary);
        cursor: pointer;
        transition: background 0.15s;
    }
    .home-quick-card .card-list .item:hover { background: var(--bg); }
    
    .home-quick-card .card-list .item .icon-sm {
        width: 24px; 
        height: 24px;
        border-radius: 6px;
        flex-shrink: 0;
        overflow: hidden;
        background: #e8eaed;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
    }
    .home-quick-card .card-list .item .icon-sm img { width: 100%; height: 100%; object-fit: cover; }
    
    .home-quick-card .card-list .item .name {
        flex: 1;
        min-width: 0; 
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 500;
    }
    
    .home-quick-card .card-list .item .meta {
        font-size: 12px; 
        color: var(--text-muted);
        flex-shrink: 0;
        margin-left: 4px;
    }
    
    .home-quick-card .card-list .empty {
        font-size: 13px;
        color: var(--text-muted);
        text-align: center;
        padding: 20px 0;
    }

    @media (max-width: 768px) {
        .home-top-row {
            flex-direction: column;
            height: auto;
            min-height: 340px;
        }
        .home-carousel-wrapper {
            flex: 0 0 auto;
            width: 100%;
            height: 200px;
            min-height: 160px;
        }
        .home-banner-overlay {
            top: 10px;
            left: 10px;
            padding: 10px 14px;
        }
        .home-banner-overlay .welcome { font-size: 15px; margin-bottom: 4px; }
        .home-banner-overlay .stats { font-size: 11px; gap: 8px; }
        .home-banner-overlay .stats strong { font-size: 13px; }
        .home-notice-wrapper {
            flex: 0 0 auto;
            width: 100%;
            border-left: none;
            border-top: 1px solid var(--border);
            min-height: 100px;
            max-height: 220px;
            padding: 12px 16px;
        }
        .home-quick-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .home-quick-card { min-height: 140px; max-height: 220px; }
        .home-quick-card .card-list .item { font-size: 13px; }
    }

    @media (max-width: 550px) {
        .home-top-row { min-height: 280px; }
        .home-carousel-wrapper { height: 150px; min-height: 120px; }
        .home-carousel-btn { width: 26px; height: 26px; font-size: 13px; }
        .home-carousel-btn.prev { left: 4px; }
        .home-carousel-btn.next { right: 4px; }
        .home-notice-wrapper { max-height: 180px; min-height: 70px; padding: 10px 14px; }
        .notice-record .record-title { font-size: 12px; }
        .home-quick-grid { grid-template-columns: 1fr 1fr; gap: 6px; }
        .home-quick-card { min-height: 120px; max-height: 200px; padding: 10px 12px; }
        .home-quick-card .card-header .title { font-size: 14px; }
        .home-quick-card .card-list .item { font-size: 12px; padding: 4px 2px; }
    }

    @media (max-width: 400px) {
        .home-top-row { min-height: 240px; }
        .home-carousel-wrapper { height: 120px; min-height: 100px; }
        .home-carousel-btn { width: 22px; height: 22px; font-size: 11px; }
        .home-notice-wrapper { max-height: 140px; min-height: 60px; padding: 8px 12px; }
        .notice-record .record-title { font-size: 11px; }
        .home-quick-grid { grid-template-columns: 1fr; gap: 6px; }
        .home-quick-card { min-height: 100px; max-height: 180px; }
    }
</style>

// ================================================================
// 图片地址包装
// ================================================================
function wrapImageUrl(url) {
    if (!url) return '';
    if (url.startsWith('/')) {
        return window.location.origin + url;
    }
    if (window.location.protocol === 'https:' && url.startsWith('http://')) {
        return API_BASE + '/api/proxy-image?url=' + encodeURIComponent(url);
    }
    return url;
}

// ================================================================
// Toast
// ================================================================
function showToast(msg, type) {
    var toast = document.getElementById('toast');
    if (!toast) {
        console.warn('Toast 元素不存在');
        return;
    }
    toast.textContent = msg;
    toast.className = 'toast show ' + (type || '');
    var durations = { success: 2500, error: 4000, warning: 3000, info: 2000 };
    clearTimeout(toast._timer);
    toast._timer = setTimeout(function() {
        toast.classList.remove('show');
    }, durations[type] || 3000);
}

// ================================================================
// 工具函数
// ================================================================
function compareVersions(v1, v2) {
    if (!v1 || !v2) return 0;
    v1 = String(v1).replace(/^v/, '');
    v2 = String(v2).replace(/^v/, '');
    var parts1 = v1.split('.').map(Number);
    var parts2 = v2.split('.').map(Number);
    for (var i = 0; i < Math.max(parts1.length, parts2.length); i++) {
        var a = parts1[i] || 0;
        var b = parts2[i] || 0;
        if (a > b) return 1;
        if (a < b) return -1;
    }
    return 0;
}

function getTagsArray(tags) {
    if (!tags) return [];
    if (Array.isArray(tags)) return tags;
    if (typeof tags === 'string') {
        return tags.split(',').map(function(s) { return s.trim(); }).filter(function(s) { return s; });
    }
    return [];
}

// ================================================================
// 缓存读写
// ================================================================
function readAppsCache() {
    try {
        var cached = localStorage.getItem(CACHE_KEY);
        if (!cached) return null;
        var data = JSON.parse(cached);
        if (data._version !== CACHE_VERSION) {
            localStorage.removeItem(CACHE_KEY);
            return null;
        }
        if (Date.now() - data.timestamp > 10 * 60 * 1000) {
            return null;
        }
        return data.data;
    } catch (e) {
        return null;
    }
}

function writeAppsCache(data) {
    try {
        localStorage.setItem(CACHE_KEY, JSON.stringify({
            _version: CACHE_VERSION,
            timestamp: Date.now(),
            data: data
        }));
    } catch (e) { console.warn('写入缓存失败:', e); }
}

function clearAppsCache() {
    localStorage.removeItem(CACHE_KEY);
    localStorage.removeItem('fnsoft_notice_cache');
    localStorage.removeItem('fnsoft_downloaded_version');
}

function exportLogs() {

    clearAppsCache();
    showToast('缓存已清除，即将刷新页面', 'success');

}

var MY_RATINGS_KEY = 'fnsoft_my_ratings';

function getMyRatings() {
    try { return JSON.parse(localStorage.getItem(MY_RATINGS_KEY) || '{}'); } catch (e) { return {}; }
}
function getMyRating(appId) {
    var all = getMyRatings();
    return all[appId] || 0;
}
function setMyRating(appId, rating) {
    try {
        var all = getMyRatings();
        all[appId] = rating;
        localStorage.setItem(MY_RATINGS_KEY, JSON.stringify(all));
    } catch (e) {}
}
function getClientId() {
    var id = localStorage.getItem('fnsoft_client_id');
    if (!id) {
        id = (window.crypto && crypto.randomUUID && crypto.randomUUID()) ||
            ('cid_' + Date.now() + '_' + Math.random().toString(36).slice(2));
        localStorage.setItem('fnsoft_client_id', id);
    }
    return id;
}

async function loadRating(appId) {
    var stars = document.querySelectorAll('#ratingStars .star');
    var info = document.getElementById('ratingInfo');
    var myHint = document.getElementById('myRatingHint');
    if (!stars.length || !info) return;

    stars.forEach(function(s) { s.classList.remove('active', 'hover'); });
    info.className = 'rating-info loading';
    info.textContent = '加载中...';

    var myRating = getMyRating(appId);
    if (myHint) {
        if (myRating > 0) {
            myHint.textContent = '你已评分：' + myRating + ' 星（点击星星可修改）';
            myHint.className = 'my-rating-hint show';
            stars.forEach(function(s, i) { if (i < myRating) s.classList.add('active'); });
        } else {
            myHint.className = 'my-rating-hint';
            myHint.textContent = '';
        }
    }

    try {
        var resp = await fetch(API_BASE + '/api/rating/' + appId);
        var data = await resp.json();
        if (data.success && data.data) {
            var avg = data.data.rating_avg || 0;
            var count = data.data.rating_count || 0;
            if (myRating === 0) {
                var rounded = Math.round(avg);
                stars.forEach(function(s, i) { if (i < rounded) s.classList.add('active'); });
            }
            if (count > 0) {
                info.className = 'rating-info';
                info.textContent = avg.toFixed(1) + ' 分 · ' + count + ' 人评分';
            } else {
                info.className = 'rating-info';
                info.textContent = '暂无评分，点击星星评分';
            }
        } else {
            info.className = 'rating-info';
            info.textContent = '暂无评分';
        }
    } catch (e) {
        info.className = 'rating-info error';
        info.textContent = '加载失败';
    }
}

async function submitRating(appId, rating) {
    var info = document.getElementById('ratingInfo');
    var myHint = document.getElementById('myRatingHint');
    if (info) { info.className = 'rating-info loading'; info.textContent = '提交中...'; }
    try {
        var resp = await fetch(API_BASE + '/api/rating/' + appId, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ client_id: getClientId(), rating: rating })
        });
        var data = await resp.json();
        if (data.success && data.data) {
            var avg = data.data.rating_avg || 0;
            var count = data.data.rating_count || 0;
            var stars = document.querySelectorAll('#ratingStars .star');
            stars.forEach(function(s, i) { s.classList.toggle('active', i < rating); });
            if (info) {
                info.className = 'rating-info';
                info.textContent = avg.toFixed(1) + ' 分 · ' + count + ' 人评分';
            }
            setMyRating(appId, rating);
            if (myHint) {
                myHint.textContent = '你已评分：' + rating + ' 星（点击星星可修改）';
                myHint.className = 'my-rating-hint show';
            }
            var ratingInline = document.getElementById('detailRatingInline');
            if (ratingInline) { ratingInline.textContent = '★ ' + avg.toFixed(1); ratingInline.style.display = ''; }
            showToast('已提交 ' + rating + ' 星评分', 'success');

            var app = allAppsData.find(function (a) {return a.id === appId;});
            if (app) {
                app.rating_avg = avg;
                app.rating_count = count;
                writeAppsCache(allAppsData);
            }
        } else {
            if (info) { info.className = 'rating-info error'; info.textContent = data.message || '提交失败'; }
            showToast(data.message || '评分失败', 'error');
        }
    } catch (e) {
        if (info) { info.className = 'rating-info error'; info.textContent = '提交失败'; }
        showToast('评分失败: ' + e.message, 'error');
    }
}

function initRatingWidget() {
    var stars = document.querySelectorAll('#ratingStars .star');
    stars.forEach(function (star) {
        star.addEventListener('mouseenter', function () {
            var v = parseInt(star.dataset.value);
            stars.forEach(function (s, i) { s.classList.toggle('hover', i < v); });
        });
        star.addEventListener('mouseleave', function () {
            stars.forEach(function (s) {s.classList.remove('hover');});
        });
        star.addEventListener('click', function (e) {
            e.stopPropagation();
            if (!currentDetailApp) return;
            var v = parseInt(star.dataset.value);
            submitRating(currentDetailApp.id, v);
        });
    });
}

var _installModalAppId = null;

function showInstallModal(appId, appName, appVersion, iconUrl) {
    _installModalAppId = appId;
    var modal = document.getElementById('installModal');
    if (!modal) return;
    var iconEl = document.getElementById('installModalIcon');
    if (iconEl) iconEl.innerHTML = iconUrl ? '<img src="' + wrapImageUrl(iconUrl) + '" alt="">' : '';
    var nameEl = document.getElementById('installModalName');
    if (nameEl) nameEl.textContent = appName + (appVersion ? ' v' + appVersion : '');
    var bar = document.getElementById('installModalBar');
    if (bar) { bar.style.width = '0%'; bar.className = 'install-modal-bar-fill'; }
    var pctEl = document.getElementById('installModalPct');
    if (pctEl) { pctEl.textContent = '0%'; pctEl.className = 'pct'; }
    var stageEl = document.getElementById('installModalStage');
    if (stageEl) stageEl.textContent = '准备中';
    var statusEl = document.getElementById('installModalStatus');
    if (statusEl) { statusEl.textContent = '准备中...'; statusEl.className = 'install-modal-status'; }
    var detailEl = document.getElementById('installModalDetail');
    if (detailEl) detailEl.textContent = '';
    var closeBtn = document.getElementById('installModalClose');
    if (closeBtn) closeBtn.style.display = 'none';
    var actionsEl = document.getElementById('installModalActions');
    if (actionsEl) actionsEl.style.display = 'none';
    modal.classList.add('active');
}

function updateInstallModalProgress(data) {
    var modal = document.getElementById('installModal');
    if (!modal || !modal.classList.contains('active')) return;
    var pct = Math.min(100, Math.max(0, data.progress || 0));
    var bar = document.getElementById('installModalBar');
    if (bar) bar.style.width = pct + '%';
    var pctEl = document.getElementById('installModalPct');
    if (pctEl) pctEl.textContent = pct + '%';
    var stageEl = document.getElementById('installModalStage');
    if (stageEl) {
        var stage = data.stage || '';
        if (stage === 'download')      stageEl.textContent = '下载中';
        else if (stage === 'extract')  stageEl.textContent = '解压中';
        else if (stage === 'install')  stageEl.textContent = '安装中';
        else                           stageEl.textContent = '处理中';
    }
    var statusEl = document.getElementById('installModalStatus');
    if (statusEl) statusEl.textContent = data.msg || '处理中...';
    var detailEl = document.getElementById('installModalDetail');
    if (detailEl) {
        if (data.speed_str && data.downloaded && data.total && data.total > 0) {
            detailEl.textContent = data.speed_str + ' · ' + (data.downloaded / 1024 / 1024).toFixed(1) + ' MB / ' + (data.total / 1024 / 1024).toFixed(1) + ' MB';
        } else if (data.speed_str && data.downloaded) {
            detailEl.textContent = data.speed_str + ' · 已下载 ' + (data.downloaded / 1024 / 1024).toFixed(1) + ' MB';
        } else if (data.speed_str) {
            detailEl.textContent = data.speed_str;
        } else {
            detailEl.textContent = '';
        }
    }
}

function setInstallModalResult(success, message) {
    var modal = document.getElementById('installModal');
    if (!modal || !modal.classList.contains('active')) return;
    var bar = document.getElementById('installModalBar');
    var pctEl = document.getElementById('installModalPct');
    var statusEl = document.getElementById('installModalStatus');
    var stageEl = document.getElementById('installModalStage');
    var closeBtn = document.getElementById('installModalClose');
    var actionsEl = document.getElementById('installModalActions');
    if (success) {
        if (bar) { bar.style.width = '100%'; bar.className = 'install-modal-bar-fill success'; }
        if (pctEl) { pctEl.textContent = '100%'; pctEl.className = 'pct success'; }
        if (stageEl) stageEl.textContent = '完成';
        if (statusEl) { statusEl.textContent = message || '安装成功'; statusEl.className = 'install-modal-status success'; }
        if (closeBtn) closeBtn.style.display = 'block';
        if (actionsEl) actionsEl.style.display = 'flex';
        setTimeout(function () {closeInstallModal();}, 3000);
    } else {
        if (bar) bar.className = 'install-modal-bar-fill error';
        if (pctEl) pctEl.className = 'pct error';
        if (stageEl) stageEl.textContent = '失败';
        if (statusEl) { statusEl.textContent = message || '安装失败'; statusEl.className = 'install-modal-status error'; }
        if (closeBtn) closeBtn.style.display = 'block';
        if (actionsEl) actionsEl.style.display = 'flex';
    }
}

function closeInstallModal() {
    var modal = document.getElementById('installModal');
    if (modal) modal.classList.remove('active');
    _installModalAppId = null;
}

function searchApps() { currentPage = 1; renderFilteredApps(); }

function filterByTag(tag) {
    currentTag = tag;

        btn.classList.toggle('active', btn.dataset.tag === tag);
    });

function filterByAppType(type) {
    currentAppType = type;
    document.querySelectorAll('.type-filter-btn').forEach(function(btn) {
        btn.classList.toggle('active', btn.dataset.type === type);
    });
    currentPage = 1;
    renderFilteredApps();
}

function filterBySource(sourceName) {
    currentSourceFilter = sourceName || 'all';
    currentPage = 1;
    renderFilteredApps();
}

function changeSort() {
    var select = document.getElementById('sortSelect');
    if (!select) return;
    currentSort = select.value || 'default';
    currentPage = 1;
    renderFilteredApps();
}

function renderFilterButtons() {
    var container = document.getElementById('filterBar');
    if (!container) return;
    var html = '';
    FIXED_TAGS.forEach(function(tag) {
        html += '<button class="filter-btn' + (tag === currentTag ? ' active' : '') + '" data-tag="' + tag + '" onclick="filterByTag(\'' + tag + '\')">' + tag + '</button>';
    });
    container.innerHTML = html;
}

function getUniqueSourceNames() {
    var names = {};
    allAppsData.forEach(function(app) {
        if (app.id === 'fn-appstores-client') return;
        var src = app._source_name || '未知源';
        names[src] = true;
    });
    return Object.keys(names).sort();
}

function updateSourceFilterOptions() {
    var select = document.getElementById('sourceFilterSelect');
    if (!select) return;
    var names = getUniqueSourceNames();
    var html = '<option value="all">全部源</option>';
    names.forEach(function(name) {
        var selected = currentSourceFilter === name ? ' selected' : '';
        html += '<option value="' + name + '"' + selected + '>' + name + '</option>';
    });
    select.innerHTML = html;
}

function sortApps(apps) {
    if (currentSort === 'default') return apps;
    var sorted = apps.slice();
    switch (currentSort) {
        case 'name':
            sorted.sort(function(a, b) { return (a.name || '').localeCompare(b.name || ''); });
            break;
        case 'downloads':
            sorted.sort(function(a, b) { return (b.downloads || 0) - (a.downloads || 0); });
            break;
        case 'updated':
            sorted.sort(function(a, b) {
                return new Date(b.updated_at || '1970-01-01') - new Date(a.updated_at || '1970-01-01');
            });
            break;
    }
    return sorted;
}

function getCurrentPageData(apps) { return apps; }
function renderPagination() {}
function prevPage() {}
function nextPage() {}

function getFilteredApps() {
    var result = allAppsData.filter(function(app) { return app.id !== 'fn-appstores-client'; });
    var keywordEl = document.getElementById('searchInput');
    if (keywordEl) {
        var keyword = keywordEl.value.toLowerCase().trim();
        if (keyword) {
            result = result.filter(function(app) {
                return (app.name && app.name.toLowerCase().includes(keyword)) ||
                    (app.desc && app.desc.toLowerCase().includes(keyword)) ||
                    (app.author && app.author.toLowerCase().includes(keyword));
            });
        }
    }
    if (currentTag !== '全部') {
        result = result.filter(function(app) {
            var appTags = getTagsArray(app.tags);
            return appTags.some(function(t) { return t === currentTag; });
        });
    }
    if (currentAppType === 'docker') {
        result = result.filter(function(app) {
            if (app.type) {
                var typeLower = String(app.type).toLowerCase();
                if (typeLower === 'docker' || typeLower === '容器') return true;
            }
            var tags = getTagsArray(app.tags);
            return tags.some(function(t) {
                var tl = t.toLowerCase();
                return tl.includes('docker') || tl.includes('容器');
            });
        });
    } else if (currentAppType === 'native') {
        result = result.filter(function(app) {
            if (app.type) {
                var typeLower = String(app.type).toLowerCase();
                if (typeLower === '原生' || typeLower === 'native' || typeLower === '本地') return true;
                if (typeLower === 'docker' || typeLower === '容器') return false;
            }
            var tags = getTagsArray(app.tags);
            return !tags.some(function(t) {
                var tl = t.toLowerCase();
                return tl.includes('docker') || tl.includes('容器');
            });
        });
    }
    if (currentSourceFilter !== 'all') {
        result = result.filter(function(app) {
            return (app._source_name || '未知源') === currentSourceFilter;
        });
    }
    return sortApps(result);
}

function renderFilteredApps() {
    var filtered = getFilteredApps();
    renderApps(filtered);
    var countEl = document.getElementById('appCount');
    if (countEl) countEl.textContent = filtered.length;
    updateSettingsStats();
}

function initCarousel(screenshots) {
    var container = document.getElementById('carouselContainer');
    if (!container) return;
    var track = document.getElementById('carouselTrack');
    var dotsContainer = document.getElementById('carouselDots');
    slideCount = screenshots ? screenshots.length : 0;
    currentSlide = 0;
    if (slideCount === 0) { container.style.display = 'none'; return; }
    container.style.display = 'block';
    window._currentScreenshots = screenshots;
    if (track) {
        track.innerHTML = screenshots.map(function(url, index) {
            return '<img src="' + wrapImageUrl(url) + '" alt="应用截图" loading="lazy" onerror="this.style.display=\'none\'" onclick="event.stopPropagation();openImageModal(window._currentScreenshots || [], ' + index + ')">';
        }).join('');
    }
    var prevBtn = document.getElementById('carouselPrev');
    var nextBtn = document.getElementById('carouselNext');
    if (prevBtn) prevBtn.classList.toggle('show', slideCount > 1);
    if (nextBtn) nextBtn.classList.toggle('show', slideCount > 1);
    if (dotsContainer) {
        dotsContainer.innerHTML = slideCount > 1 ? screenshots.map(function(_, i) {
            return '<button class="dot' + (i === 0 ? ' active' : '') + '" onclick="goToSlide(' + i + ')"></button>';
        }).join('') : '';
    }
    updateCarousel();
}

function updateCarousel() {
    var track = document.getElementById('carouselTrack');
    if (track) track.style.transform = 'translateX(-' + (currentSlide * 100) + '%)';
    document.querySelectorAll('.carousel-dots .dot').forEach(function(dot, i) {
        dot.classList.toggle('active', i === currentSlide);
    });
}

function carouselPrev() { if (slideCount > 1) { currentSlide = (currentSlide - 1 + slideCount) % slideCount; updateCarousel(); } }
function carouselNext() { if (slideCount > 1) { currentSlide = (currentSlide + 1) % slideCount; updateCarousel(); } }
function goToSlide(index) { currentSlide = index; updateCarousel(); }

function openImageModal(images, index) {
    if (!images || images.length === 0) return;
    imageList = images;
    currentImageIndex = index || 0;
    var img = document.getElementById('modalImage');
    if (!img) return;
    img.src = wrapImageUrl(imageList[currentImageIndex]);
    var counter = document.getElementById('imageCounter');
    if (counter) counter.textContent = (currentImageIndex + 1) + ' / ' + imageList.length;
    var prevBtn = document.getElementById('imagePrevBtn');
    var nextBtn = document.getElementById('imageNextBtn');
    if (prevBtn) prevBtn.style.display = imageList.length > 1 ? 'flex' : 'none';
    if (nextBtn) nextBtn.style.display = imageList.length > 1 ? 'flex' : 'none';
    var modal = document.getElementById('imageModal');
    if (modal) modal.classList.add('active');
}
function closeImageModal() {
    var modal = document.getElementById('imageModal');
    if (modal) modal.classList.remove('active');
}
function imagePrev() {
    if (imageList.length === 0) return;
    currentImageIndex = (currentImageIndex - 1 + imageList.length) % imageList.length;
    var img = document.getElementById('modalImage');
    if (img) img.src = wrapImageUrl(imageList[currentImageIndex]);
    var counter = document.getElementById('imageCounter');
    if (counter) counter.textContent = (currentImageIndex + 1) + ' / ' + imageList.length;
}
function imageNext() {
    if (imageList.length === 0) return;

    if (img) img.src = wrapImageUrl(imageList[currentImageIndex]);

    if (!modal || !modal.classList.contains('active')) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); imagePrev(); }

});

function openDetail(appId) {
    if (appId === 'fn-appstores-client') {
        switchTab('settings');
        setTimeout(function() { switchSettingTab('system'); }, 300);
        showToast('请在「设置 → 系统」中检查更新', 'info');
        return;
    }
    var app = allAppsData.find(function(a) { return a.id === appId; });
    if (!app) {
        showToast('应用数据不存在，请刷新重试', 'error');
        return;
    }

    var appsTab = document.getElementById('tabApps');
    if (!appsTab || !appsTab.classList.contains('active')) {
        window._pendingDetailAppId = appId;
        if (typeof switchTab === 'function') {
            switchTab('apps');
        }
        return;
    }

    currentDetailApp = app;

    var listView = document.getElementById('appsListView');
    var detailView = document.getElementById('appsDetailView');
    if (listView) listView.classList.remove('active');
    if (detailView) {
        detailView.classList.add('active');
        detailView.scrollTop = 0;
    }

    var iconEl = document.getElementById('detailIcon');
    if (iconEl) iconEl.innerHTML = app.icon ? '<img src="' + wrapImageUrl(app.icon) + '" alt="">' : '·';

    var titleEl = document.getElementById('detailTitle');
    if (titleEl) titleEl.textContent = app.name;

    var ratingInline = document.getElementById('detailRatingInline');
    if (ratingInline) {
        if (app.rating_count > 0) {
            ratingInline.textContent = '★ ' + (app.rating_avg || 0).toFixed(1);
            ratingInline.style.display = '';
        } else {
            ratingInline.style.display = 'none';
        }
    }

    var tags = getTagsArray(app.tags);
    var category = tags.length > 0 ? tags[0] : '';
    var sourceName = '';
    if (app._source_id === 'official') {
        sourceName = '🎖️官方';
    } else if (app._source_name) {
        sourceName = '🎖️三方';
    }
    var parts = [];
    if (category) parts.push(category);
    if (sourceName) parts.push(sourceName);
    var subtitleEl = document.getElementById('detailSubtitle');
    if (subtitleEl) subtitleEl.textContent = parts.join(' · ') || '—';

    document.getElementById('detailMetaAuthor').textContent = app.author || '-';
    document.getElementById('detailMetaVersion').textContent = app.version ? 'v' + app.version : '-';
    document.getElementById('detailMetaSource').textContent =
        app._source_id === 'official' ? '🎖️官方' : '🎖️三方';
    document.getElementById('detailMetaDownloads').textContent = (app.downloads || 0);
    document.getElementById('detailMetaUpdated').textContent = app.updated_at || '-';
    document.getElementById('detailMetaType').textContent = app.type || '未指定';

    var changelogSection = document.getElementById('detailChangelogSection');
    var changelogEl = document.getElementById('detailChangelog');
    if (changelogEl && changelogSection) {
        var rawText = (app.desc || '').replace(/<[^>]+>/g, '').trim();
        var lines = rawText.split(/\n+/).map(function (s) { return s.trim(); }).filter(function (s) { return s; });
        if (lines.length >= 2) {
            var html = '<ol class="changelog-list">';
            lines.forEach(function (line) { html += '<li>' + line + '</li>'; });
            html += '</ol>';
            changelogEl.innerHTML = html;
            changelogSection.style.display = '';
        } else {
            changelogSection.style.display = 'none';
        }
    }

    var descEl = document.getElementById('detailDesc');
    if (descEl) descEl.innerHTML = app.desc || '暂无描述';

    var btn = document.getElementById('detailInstallBtn');
    if (btn) {
        if (app.installed && app.has_update) {
            btn.textContent = '更新';
            btn.className = 'card-btn btn-update';
            btn.disabled = false;
            btn.dataset.action = 'update';
        } else if (app.installed) {
            btn.textContent = '已安装';
            btn.className = 'card-btn btn-opened';
            btn.disabled = true;
            btn.dataset.action = 'none';
        } else {
            btn.textContent = '安装';
            btn.className = 'card-btn btn-install';
            btn.disabled = false;
            btn.dataset.action = 'install';
        }
        btn.dataset.appId = app.id;
    }

    var repoBtn = document.getElementById('detailRepoBtn');
    if (repoBtn) {
        if (app.repo) {
            repoBtn.href = app.repo;
            repoBtn.style.display = 'inline-flex';
        } else {
            repoBtn.style.display = 'none';
        }
    }

    var scSection = document.getElementById('detailScreenshotsSection');
    if (app.screenshots && app.screenshots.length > 0) {
        if (scSection) scSection.style.display = '';
        initCarousel(app.screenshots);
    } else {
        if (scSection) scSection.style.display = 'none';
    }

    loadRating(app.id);
}

// ================================================================
// WebSocket 管理
// ================================================================
function connectWS() {
    if (ws && (ws.readyState === WebSocket.CONNECTING || ws.readyState === WebSocket.OPEN)) return;
    if (ws) { try {ws.close();} catch (e) {} ws = null; }
    var protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    var url = protocol + '//' + window.location.host + API_BASE + '/ws';
    console.log('连接 WebSocket:', url);
    try {
        ws = new WebSocket(url);
        ws.onopen = function () {
            console.log('✅ WebSocket 已连接');
            wsReady = true;
            wsReconnectAttempts = 0;
            if (isInstalling) { isInstalling = false; }
            processInstallQueue();
        };
        ws.onmessage = function (e) {
            try { handleWsMessage(JSON.parse(e.data)); } catch (err) { console.warn('解析WS消息失败:', err); }
        };
        ws.onclose = function (e) {
            console.log('WebSocket 已断开, code:', e.code);
            wsReady = false; ws = null; isInstalling = false;
            if (window._isClosing) return;
            scheduleReconnect();
        };
        ws.onerror = function (e) { if (ws) ws.close(); };
    } catch (e) {
        ws = null; wsReady = false;
        scheduleReconnect();
    }
}

function scheduleReconnect() {
    if (wsReconnectTimer) { clearTimeout(wsReconnectTimer); wsReconnectTimer = null; }
    if (window._isClosing) return;
    if (wsReconnectAttempts >= WS_MAX_RECONNECT_ATTEMPTS) return;
    var delay = Math.min(1000 * Math.pow(1.5, wsReconnectAttempts), 30000);
    wsReconnectAttempts++;
    wsReconnectTimer = setTimeout(function () {
        wsReconnectTimer = null;
        if (!window._isClosing) connectWS();
    }, delay);
}

window.__cleanupWebSocket = function () {
    window._isClosing = true;
    if (wsReconnectTimer) { clearTimeout(wsReconnectTimer); wsReconnectTimer = null; }
    if (ws) { try {ws.close();} catch (e) {} ws = null; }
    wsReady = false;
};

// ★ v4：processInstallQueue 发送 download_urls 数组（兼容 download_url）
function processInstallQueue() {
    if (isInstalling || pendingInstallQueue.length === 0) return;
    if (!wsReady || !ws || ws.readyState !== WebSocket.OPEN) {
        if (!wsReady) connectWS();
        return;
    }
    isInstalling = true;
    if (installTimeoutTimer) clearTimeout(installTimeoutTimer);
    installTimeoutTimer = setTimeout(function () {
        isInstalling = false;
        installTimeoutTimer = null;
        processInstallQueue();
    }, 30 * 60 * 1000);

    var task = pendingInstallQueue.shift();
    if (task) {
        try {
            var urls = task.downloadUrls || [];
            ws.send(JSON.stringify({
                event: 'install',
                data: {
                    app_id: task.appId,
                    download_url: urls[0] || '',
                    download_urls: urls
                }
            }));
        } catch (e) {
            isInstalling = false;
            if (installTimeoutTimer) { clearTimeout(installTimeoutTimer); installTimeoutTimer = null; }
            if (task) pendingInstallQueue.push(task);
            setTimeout(processInstallQueue, 1000);
        }
    } else {
        isInstalling = false;
        if (installTimeoutTimer) { clearTimeout(installTimeoutTimer); installTimeoutTimer = null; }
    }
}

function addInstallTask(appId, downloadUrls) {
    var existing = pendingInstallQueue.some(function (t) {return t.appId === appId;});
    if (existing) { processInstallQueue(); return; }
    pendingInstallQueue.push({appId: appId, downloadUrls: downloadUrls});
    processInstallQueue();
}

function updateInstallButtonUI(appId, state) {
    var cardBtn = document.getElementById('installBtn-' + appId);
    var detailBtn = document.getElementById('detailInstallBtn');
    var isDetailForThis = detailBtn && detailBtn.dataset.appId === appId;

    if (cardBtn) {
        if (state === 'installing') { cardBtn.disabled = true; cardBtn.textContent = '安装中...'; }
        else if (state === 'installed') {
            cardBtn.disabled = true; cardBtn.textContent = '已安装';
            cardBtn.className = 'card-btn btn-opened';
        }
        else if (state === 'idle') { cardBtn.disabled = false; cardBtn.textContent = '安装'; }
    }
    if (isDetailForThis) {
        if (state === 'installing') { detailBtn.disabled = true; detailBtn.textContent = '安装中...'; }
        else if (state === 'installed') {
            detailBtn.disabled = true; detailBtn.textContent = '已安装';
            detailBtn.className = 'card-btn btn-opened';
        }
        else if (state === 'idle') { detailBtn.disabled = false; detailBtn.textContent = '安装'; }
    }
}

function handleWsMessage(msg) {
    if (msg.event === 'wizard.show') {
        isInstalling = false;
        if (installTimeoutTimer) { clearTimeout(installTimeoutTimer); installTimeoutTimer = null; }
        closeInstallModal();
        showWizardFromSession(msg.data.session_id, msg.data.steps, msg.data.title, msg.data.app_id);
        processInstallQueue();
        return;
    }
    if (msg.event === 'progress') {
        var data = msg.data;
        updateInstallModalProgress(data);
        updateInstallButtonUI(data.app_id, 'installing');
        return;
    }
    if (msg.event === 'result') {
        var data = msg.data;
        var appId = data.app_id;
        isInstalling = false;
        if (installTimeoutTimer) { clearTimeout(installTimeoutTimer); installTimeoutTimer = null; }

        if (data.status === 'error' && data.missing_dep) {
            (function(depName) {
                setTimeout(function() {
                    if (typeof showMissingDepModal === 'function') {
                        showMissingDepModal(depName);
                    } else if (typeof showToast === 'function') {
                        showToast('缺少依赖「' + depName + '」，请在飞牛应用中心安装后重试', 'warning');
                    }
                }, 500);
            })(data.missing_dep);
        }

        setInstallModalResult(data.status === 'success', data.msg || (data.status === 'success' ? '安装成功' : '安装失败'));

        if (data.status === 'success') {
            updateInstallButtonUI(appId, 'installed');
            var app = allAppsData.find(function (a) {return a.id === appId;});
            showToast((app ? app.name : appId) + ' 安装成功', 'success');
            if (app) {
                app.installed = true;
                app.installed_version = data.version || app.version;
                app.has_update = false;
                app._justInstalledAt = Date.now();
                if (typeof updateHomeQuickCards === 'function') updateHomeQuickCards();
                updateSettingsStats();
                writeAppsCache(allAppsData);
            }
            setTimeout(function () {refreshApps();}, 12000);
            setTimeout(processInstallQueue, 500);
        } else {
            updateInstallButtonUI(appId, 'idle');
            showToast(data.msg, 'error');
            setTimeout(processInstallQueue, 500);
        }
        return;
    }
}

// ================================================================
// 安装 / 更新：读取 download_urls 数组（回退 download_url）
// ================================================================
async function installApp(appId) {
    if (appId === 'fn-appstores-client') {
        showToast('请到「设置 → 系统」中安装更新', 'info');
        switchTab('settings');
        setTimeout(function () {switchSettingTab('system');}, 300);
        return;
    }
    if (!ws || ws.readyState !== WebSocket.OPEN) {
        showToast('连接中，请稍候...', '');
        connectWS();
        setTimeout(function () {
            if (ws && ws.readyState === WebSocket.OPEN) installApp(appId);
            else showToast('连接失败，请刷新页面重试', 'error');
        }, 2000);
        return;
    }
    updateInstallButtonUI(appId, 'installing');
    try {
        var resp = await fetch(API_BASE + '/api/app/' + appId);
        var data = await resp.json();
        if (!data.success) {
            showToast('获取应用信息失败', 'error');
            updateInstallButtonUI(appId, 'idle');
            return;
        }
        var urls = data.data.download_urls || [];
        if (urls.length === 0 && data.data.download_url) {
            urls = [data.data.download_url];
        }
        if (urls.length === 0) {
            showToast('获取下载地址失败', 'error');
            updateInstallButtonUI(appId, 'idle');
            return;
        }
        var app = allAppsData.find(function (a) {return a.id === appId;});
        showInstallModal(appId, (app ? app.name : appId), (app ? app.version : ''), (app ? app.icon : ''));
        addInstallTask(appId, urls);
    } catch (e) {
        showToast(e.message, 'error');
        updateInstallButtonUI(appId, 'idle');
    }
}

// 客户端自更新
// ================================================================
async function checkClientUpdate() {
    var btn = document.getElementById('checkUpdateBtn');
    var status = document.getElementById('updateStatus');
    if (!btn || !status) return;
    btn.disabled = true;
    btn.textContent = '检查中...';
    status.textContent = '正在检查...';
    try {
        var resp = await fetch(API_BASE + '/api/check-update');
        var data = await resp.json();
        if (data.has_update) {
            var downloadedVer = localStorage.getItem('fnsoft_downloaded_version');
            if (downloadedVer && downloadedVer === data.version) {
                if (confirm('已下载 v' + data.version + '，是否重新下载？（如果文件已删除请点"确定"）')) {
                    localStorage.removeItem('fnsoft_downloaded_version');
                    downloadAndInstall(data);
                } else {
                    btn.disabled = false;
                    btn.textContent = '检查更新';
                    status.textContent = '';
                    btn.onclick = function () {checkClientUpdate();};
                }
                return;
            }
            downloadAndInstall(data);
        } else {
            status.textContent = '已是最新版本 (' + data.version + ')';
            btn.textContent = '已是最新';
            btn.disabled = true;
        }
    } catch (e) {
        status.textContent = '检查失败: ' + e.message;
        btn.textContent = '重试';
        btn.disabled = false;
    }
}

function downloadAndInstall(data) {
    var btn = document.getElementById('checkUpdateBtn');
    var status = document.getElementById('updateStatus');
    if (!btn || !status) return;
    status.textContent = '发现新版本 ' + data.version + '，开始下载...';
    btn.textContent = '下载中...';
    btn.disabled = true;
    var a = document.createElement('a');
    a.href = data.download_url;
    a.download = 'fn-appstores-client-' + data.version + '.fpk';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    status.textContent = 'v' + data.version + ' 已下载！请到应用中心手动安装。';
    btn.textContent = '重新下载';
    btn.disabled = false;
    btn.onclick = function () {reDownload();};
    localStorage.setItem('fnsoft_downloaded_version', data.version);
    setTimeout(function () {
        alert('FPK 已下载完成！\n\n请前往：飞牛应用中心 → 手动安装 → 上传 FPK 文件');
    }, 500);
}

function reDownload() {
    localStorage.removeItem('fnsoft_downloaded_version');
    var btn = document.getElementById('checkUpdateBtn');
    var status = document.getElementById('updateStatus');
    if (btn) {
        btn.textContent = '检查更新';
        btn.disabled = false;
        btn.onclick = function () {checkClientUpdate();};
    }
    if (status) status.textContent = '';
    checkClientUpdate();
}

function checkAndShowDownloaded() {
    var downloadedVer = localStorage.getItem('fnsoft_downloaded_version');
    if (downloadedVer) {
        var status = document.getElementById('updateStatus');
        var btn = document.getElementById('checkUpdateBtn');
        if (status) {
            status.textContent = 'v' + downloadedVer + ' 已下载，请到应用中心手动安装，或点击重新下载';
            status.style.color = 'var(--blue)';
        }
        if (btn) {
            btn.textContent = '重新下载';
            btn.disabled = false;
            btn.onclick = function () {reDownload();};
        }
    }
}

// ================================================================
// 向导
// ================================================================
function showWizardFromSession(sessionId, steps, title, appId) {
    currentWizardSessionId = sessionId;
    _wizardPendingAppID = appId || null;
    var modal = document.getElementById('wizardModal');
    if (!modal) return;
    var body = document.getElementById('wizardBody');
    var status = document.getElementById('wizardStatus');
    var titleEl = document.getElementById('wizardTitle');
    if (titleEl) titleEl.textContent = title || '安装向导';
    if (status) status.textContent = '请填写配置项';

    var htmlContent = '';
    if (steps && steps.length > 0) {
        var items = steps.flatMap(function (step) {return step.items || [];});
        if (items.length === 0) {
            htmlContent = '<p>无配置项，点击确认安装</p>';
        } else {
            items.forEach(function (item) {
                if (item.type === 'tips') {
                    htmlContent += '<div class="wizard-field"><div class="hint" style="margin-bottom:8px;">' + (item.helpText || item.label || item.initValue || '提示信息') + '</div></div>';
                    return;
                }
                var required = item.rules && item.rules.some(function (r) {return r.required;});
                htmlContent += '<div class="wizard-field"><label>' + (item.label || item.field) + (required ? ' <span class="required">*</span>' : '') + '</label>';
                if (item.type === 'text' || item.type === 'password') {
                    var inputType = item.type === 'password' ? 'password' : 'text';
                    htmlContent += '<input type="' + inputType + '" id="wizard_' + item.field + '" name="' + item.field + '" value="' + (item.initValue || '') + '"' + (required ? ' required' : '') + '>';
                } else if (item.type === 'radio' || item.type === 'select') {
                    htmlContent += '<select id="wizard_' + item.field + '" name="' + item.field + '">';
                    (item.options || []).forEach(function (opt) {
                        htmlContent += '<option value="' + opt.value + '"' + (opt.value === item.initValue ? ' selected' : '') + '>' + opt.label + '</option>';
                    });
                    htmlContent += '</select>';
                } else if (item.type === 'switch') {
                    var checked = item.initValue === 'true' || item.initValue === true;
                    htmlContent += '<div style="display:flex;align-items:center;gap:4px;"><input type="checkbox" id="wizard_' + item.field + '" name="' + item.field + '"' + (checked ? ' checked' : '') + '> ' + item.label + '</div>';
                } else {
                    htmlContent += '<input type="text" id="wizard_' + item.field + '" name="' + item.field + '" value="' + (item.initValue || '') + '">';
                }
                if (item.helpText && item.type !== 'tips') htmlContent += '<div class="hint">' + item.helpText + '</div>';
                htmlContent += '</div>';
            });
        }
    } else {
        htmlContent = '<p>无配置项，点击确认安装</p>';
    }
    if (body) body.innerHTML = htmlContent;
    var submitBtn = document.getElementById('wizardSubmitBtn');
    if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = '确认安装'; }
    modal.classList.add('active');
}

function closeWizard() {
    // ★ 加强版：取消时先停掉轮询
    if (_wizardPollTimer) {
        clearInterval(_wizardPollTimer);
        _wizardPollTimer = null;
    }
    if (currentWizardSessionId) {
        fetch(API_BASE + '/api/wizard/cancel', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({session_id: currentWizardSessionId})
        }).catch(function () { });
        currentWizardSessionId = null;
    }
    _wizardPendingAppID = null;
    var modal = document.getElementById('wizardModal');
    if (modal) modal.classList.remove('active');
}

// ★ 加强版：submitWizard 轮询 /api/wizard/status 查询真实状态
async function submitWizard() {
    var btn = document.getElementById('wizardSubmitBtn');
    if (!btn || btn.disabled) return;
    btn.disabled = true;
    btn.textContent = '提交中...';
    var status = document.getElementById('wizardStatus');
    if (status) status.textContent = '提交中...';

    var inputs = {};
    document.querySelectorAll('#wizardBody input, #wizardBody select, #wizardBody textarea').forEach(function (el) {
        var name = el.name;
        if (!name) return;
        inputs[name] = el.type === 'checkbox' ? (el.checked ? 'true' : 'false') : el.value;
    });

    var sessionId = currentWizardSessionId;
    if (!sessionId) {
        if (status) status.textContent = '会话已过期';
        btn.disabled = false;
        btn.textContent = '确认安装';
        return;
    }

    try {
        var resp = await fetch(API_BASE + '/api/wizard/install', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({session_id: sessionId, inputs: inputs})
        });
        var result = await resp.json();

        // ★ 加强版：异步模式
        if (result.success && result.async) {
            if (status) status.textContent = '安装中，请稍候...';
            btn.textContent = '安装中...';

            // 禁用取消按钮（已经进入执行阶段）
            var cancelBtn = document.querySelector('#wizardModal .btn:not(.btn-primary)');
            if (cancelBtn) cancelBtn.disabled = true;

            // 每 2 秒轮询一次状态
            var checkCount = 0;
            var maxChecks = 60;   // 60 次 × 2 秒 = 120 秒上限
            if (_wizardPollTimer) clearInterval(_wizardPollTimer);
            _wizardPollTimer = setInterval(function () {
                checkCount++;
                if (status) status.textContent = '安装中，请稍候... (' + (checkCount * 2) + 's)';

                fetch(API_BASE + '/api/wizard/status?session_id=' + encodeURIComponent(sessionId))
                    .then(function (r) { return r.json(); })
                    .then(function (d) {
                        if (!d.success) {
                            // 会话不存在 → 说明可能已过期，视为超时
                            return;
                        }

                        if (d.status === 'success') {
                            clearInterval(_wizardPollTimer);
                            _wizardPollTimer = null;
                            if (status) status.textContent = '安装成功';
                            showToast('安装成功', 'success');
                            isInstalling = false;
                            if (installTimeoutTimer) { clearTimeout(installTimeoutTimer); installTimeoutTimer = null; }
                            closeWizard();
                            setTimeout(function () { refreshApps(); }, 500);
                            processInstallQueue();
                        } else if (d.status === 'failed') {
                            clearInterval(_wizardPollTimer);
                            _wizardPollTimer = null;
                            var errMsg = d.message || '未知错误';
                            if (status) status.textContent = '安装失败: ' + errMsg;
                            showToast('安装失败: ' + errMsg, 'error');
                            isInstalling = false;
                            if (installTimeoutTimer) { clearTimeout(installTimeoutTimer); installTimeoutTimer = null; }
                            btn.disabled = false;
                            btn.textContent = '确认安装';
                            if (cancelBtn) cancelBtn.disabled = false;
                            processInstallQueue();
                        }
                        // running / pending 继续轮询
                    })
                    .catch(function () {});

                if (checkCount >= maxChecks) {
                    clearInterval(_wizardPollTimer);
                    _wizardPollTimer = null;
                    if (status) status.textContent = '安装超时，请刷新页面查看结果';
                    showToast('安装超时，请刷新页面查看', 'warning');
                    isInstalling = false;
                    if (installTimeoutTimer) { clearTimeout(installTimeoutTimer); installTimeoutTimer = null; }
                    btn.disabled = false;
                    btn.textContent = '确认安装';
                    if (cancelBtn) cancelBtn.disabled = false;
                    setTimeout(function () { refreshApps(); }, 1000);
                    processInstallQueue();
                }
            }, 2000);
            return;
        }

        // 兼容老服务端：同步返回
        if (result.success) {
            if (status) status.textContent = '安装成功';
            showToast('安装成功', 'success');
            closeWizard();
            isInstalling = false;
            if (installTimeoutTimer) { clearTimeout(installTimeoutTimer); installTimeoutTimer = null; }
            processInstallQueue();
            setTimeout(function () { refreshApps(); }, 2000);
        } else {
            if (status) status.textContent = result.message;
            btn.disabled = false;
            btn.textContent = '确认安装';
            isInstalling = false;
            if (installTimeoutTimer) { clearTimeout(installTimeoutTimer); installTimeoutTimer = null; }
            processInstallQueue();
        }
    } catch (e) {
        if (status) status.textContent = e.message;
        btn.disabled = false;
        btn.textContent = '确认安装';
        isInstalling = false;
        if (installTimeoutTimer) { clearTimeout(installTimeoutTimer); installTimeoutTimer = null; }
        processInstallQueue();
    }
}

async function loadSources(force) {
    var container = document.getElementById('sourceList');
    if (!container) return;
    if (_loadingSources) return;
    _loadingSources = true;
    var oldHtml = container.innerHTML;
    container.innerHTML = '<div style="text-align:center;padding:12px;color:var(--text-muted);font-size:11px;">加载中...</div>';
    try {
        var resp = await fetch(API_BASE + '/api/sources?force=' + (force ? 'true' : 'false'));
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        var data = await resp.json();
        if (!data.success || !data.data) throw new Error(data.message || '加载失败');
        var sources = data.data;
        if (sources.length === 0) {
            container.innerHTML = '<div style="text-align:center;padding:12px;color:var(--text-muted);font-size:11px;">暂无软件源</div>';
            _loadingSources = false;
            return;
        }
        var countEl = document.getElementById('settingsSourceCount');
        if (countEl) countEl.textContent = sources.length;

        container.innerHTML = sources.map(function (source) {
            var statusColor = source.status === 'online' ? '#5a8a5a' : source.status === 'disabled' ? '#999' : source.status === 'offline' ? '#b55a5a' : '#999';
            var statusText = source.status === 'online' ? '在线' : source.status === 'disabled' ? '已禁用' : source.status === 'offline' ? '离线' : '未知';
            var isDefault = source.id === 'official' || source.id === 'official_backup';
            var displayUrl = isDefault ? '●●●●●●●' : source.url;

            var toggleBtn = '';
            if (!isDefault) {
                if (source.enabled) {
                    toggleBtn = '<button class="btn btn-disable" onclick="toggleSource(\'' + source.id + '\',false)">禁用</button>';
                } else {
                    toggleBtn = '<button class="btn btn-enable" onclick="toggleSource(\'' + source.id + '\',true)">启用</button>';
                }
            }

            return '<div class="source-item">' +
                '<div class="info">' +
                '<div class="name-row">' +
                '<span class="name">' + source.name + '</span>' +
                (isDefault ? '<span class="badge">官方</span>' : '') +
                '<span class="status" style="color:' + statusColor + ';">● ' + statusText + '</span>' +
                '</div>' +
                '<div class="url">' + displayUrl + '</div>' +
                (source.status_msg && source.status !== 'online' ? '<div class="status-msg">' + source.status_msg + '</div>' : '') +
                '</div>' +
                '<div class="actions">' +
                toggleBtn +
                (isDefault ? '' : '<button class="btn btn-delete" onclick="removeSource(\'' + source.id + '\')">删除</button>') +
                '</div>' +
                '</div>';
        }).join('');
    } catch (e) {
        if (oldHtml) {
            container.innerHTML = oldHtml;
            showToast('加载源列表失败，显示上次缓存', 'warning');
        } else {
            container.innerHTML = '<div style="text-align:center;padding:12px;color:#b55a5a;font-size:11px;">加载失败: ' + e.message + '</div>';
        }
    } finally {
        _loadingSources = false;
    }
}

    try {
        var data;
        if (hasCache) {
            data = homeNoticeCache;
        } else {
            var resp = await fetch(API_BASE + '/api/notice');

            data = await resp.json();
            homeNoticeCache = data;
            homeNoticeCacheTime = now;

        homeNoticeData = data;

        renderNoticeRecords(data);

                var el = document.getElementById(id);
                if (el) el.innerHTML = '<div class="empty">加载中...</div>';

        homeLoaded = true;
    } catch (e) {
        if (homeNoticeCache) {

            homeNoticeData = data;
            renderCarousel(data);
            renderNoticeRecords(data);

function sanitizeDesc(html) {
    var allowedTags = ['p', 'a', 'b', 'strong', 'h1', 'h2', 'h3', 'h4', 'h5', 'br'];
    var allowedStyles = ['font-size', 'color'];
    var parser = new DOMParser();
    var doc = parser.parseFromString(html, 'text/html');

    function cleanNode(node) {
        if (node.nodeType === Node.TEXT_NODE) return document.createTextNode(node.textContent);
        if (node.nodeType !== Node.ELEMENT_NODE) return document.createTextNode('');
        var tag = node.tagName.toLowerCase();
        if (allowedTags.indexOf(tag) === -1) {
            var fragment = document.createDocumentFragment();
            node.childNodes.forEach(function (child) {fragment.appendChild(cleanNode(child));});
            return fragment;
        }
        var newEl = document.createElement(tag);
        if (tag === 'a') {
            var href = node.getAttribute('href');
            if (href) {newEl.setAttribute('href', href); newEl.setAttribute('target', '_blank'); newEl.setAttribute('rel', 'noopener noreferrer');}
        }
        var style = node.getAttribute('style');
        if (style) {
            var allowedStyle = '';
            style.split(';').forEach(function (rule) {
                var parts = rule.trim().split(':');
                if (parts.length === 2) {
                    var prop = parts[0].trim().toLowerCase();
                    var val = parts[1].trim();
                    if (allowedStyles.indexOf(prop) !== -1 && val) allowedStyle += prop + ':' + val + ';';
                }
            });
            if (allowedStyle) newEl.setAttribute('style', allowedStyle);
        }
        node.childNodes.forEach(function (child) {newEl.appendChild(cleanNode(child));});
        return newEl;
    }

    var fragment = document.createDocumentFragment();
    doc.body.childNodes.forEach(function (child) {fragment.appendChild(cleanNode(child));});
    return fragment.innerHTML || html;
}

    var cachedData = readAppsCache();
    if (cachedData) {
        allAppsData = cachedData;
        setTimeout(function () {
            renderFilterButtons();
            renderFilteredApps();
            var badge = document.getElementById('statusBadge');
            if (badge) {badge.textContent = '缓存'; badge.className = 'badge cached';}
            if (typeof updateSourceFilterOptions === 'function') updateSourceFilterOptions();
            if (typeof updateHomeQuickCards === 'function') updateHomeQuickCards();
            _loadingApps = false;
        }, 100);
        loadAppsFromServer(true);
        return;
    }
    await loadAppsFromServer(false);
}

async function loadAppsFromServer(silent) {
    try {
        var controller = new AbortController();
        setTimeout(function () {controller.abort();}, 30000);
        var resp = await fetch(API_BASE + '/api/apps', {signal: controller.signal});
        if (resp.status === 429) {
            var data = await resp.json();
            if (!silent) showToast(data.message, 'warning');
            startCooldown(data.retry_after || 30);
            var grid = document.getElementById('appGrid');
            if (grid) grid.innerHTML = '<div class="empty-state"><div class="icon">⏳</div><p>请求过于频繁，请 ' + (data.retry_after || 30) + ' 秒后点击刷新</p></div>';
            _loadingApps = false;
            return;
        }
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        var data = await resp.json();
        if (data.success && data.data.length > 0) {
            allAppsData = data.data;
            await loadInstalledVersions();
            renderFilterButtons();
            currentPage = 1;
            renderFilteredApps();
            if (!silent) {
                var badge = document.getElementById('statusBadge');
                if (badge) {badge.textContent = '在线'; badge.className = 'badge connected';}
                updateLastRefreshTime();
            }
            writeAppsCache(allAppsData);
            if (typeof updateSourceFilterOptions === 'function') updateSourceFilterOptions();
            if (typeof updateHomeQuickCards === 'function') updateHomeQuickCards();

            var devTab = document.getElementById('tabDevelopers');
            if (devTab && devTab.classList.contains('active') && typeof renderDevelopers === 'function') {
                renderDevelopers();
            }
        } else if (!silent) {
            var grid = document.getElementById('appGrid');
            if (grid) grid.innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><p>加载失败，请点击右上角「刷新」重试</p></div>';
        }
    } catch (e) {
        if (e.name !== 'AbortError') {
            var fallbackData = readAppsCache();
            if (fallbackData) {
                allAppsData = fallbackData;
                renderFilterButtons();
                renderFilteredApps();
                if (typeof updateHomeQuickCards === 'function') updateHomeQuickCards();
                if (!silent) showToast('使用离线缓存（网络异常）', 'warning');
            } else if (!silent) {
                showToast('加载失败: ' + e.message, 'error');
                var grid = document.getElementById('appGrid');
                if (grid) grid.innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><p>加载失败，请点击右上角「刷新」重试</p></div>';
            }
        }
    } finally {
        _loadingApps = false;
    }
}

function restoreAppsView() {
    try {
        var cachedData = readAppsCache();
        if (cachedData) {
            allAppsData = cachedData;
            renderFilterButtons();
            renderFilteredApps();
            var badge = document.getElementById('statusBadge');
            if (badge) {badge.textContent = '缓存'; badge.className = 'badge cached';}
            if (typeof updateSourceFilterOptions === 'function') updateSourceFilterOptions();
            return;
        }
    } catch (e) {}
    if (allAppsData && allAppsData.length > 0) {
        renderFilteredApps();
        if (typeof updateSourceFilterOptions === 'function') updateSourceFilterOptions();
        return;
    }
    loadApps();
}

async function loadInstalledVersions() {
    try {
        var resp = await fetch(API_BASE + '/api/installed');
        var data = await resp.json();
        if (data.success) {
            installedAppsCache = {};
            data.apps.forEach(function (app) {installedAppsCache[app.id] = app.version;});
            var now = Date.now();
            allAppsData.forEach(function (app) {
                // ★ v2.9.0 补丁：刚装完 30 秒内，以本地状态为准，忽略服务端老 manifest
                if (app._justInstalledAt && now - app._justInstalledAt < 30000) {
                    return;
                }
                if (app.id in installedAppsCache) {
                    app.installed = true;
                    app.installed_version = installedAppsCache[app.id];
                    app.has_update = app.installed_version && app.version && compareVersions(app.version, app.installed_version) > 0;
                } else {
                    app.installed = false;
                    app.has_update = false;
                }
            });
            writeAppsCache(allAppsData);
            if (typeof updateHomeQuickCards === 'function') updateHomeQuickCards();
            _installedLoaded = true;
        }
    } catch (e) {}
}

function updateLastRefreshTime() {
    var el = document.getElementById('lastRefresh');
    if (el) el.textContent = '上次刷新: ' + new Date().toLocaleTimeString();
}

async function refreshApps() {
    var btn = document.getElementById('refreshBtn');
    var badge = document.getElementById('statusBadge');
    if (!btn || !badge) return;
    if (refreshCooldown || btn.disabled) {showToast('请稍后再试', 'warning'); return;}
    btn.disabled = true;
    btn.textContent = '刷新中...';
    badge.textContent = '加载中';
    badge.className = 'badge loading';
    try {
        var resp = await fetch(API_BASE + '/api/refresh', {method: 'POST', headers: {'Content-Type': 'application/json'}});
        var data = await resp.json();
        if (resp.status === 429) {
            showToast(data.message, 'warning');
            startCooldown(data.retry_after || 30);
            badge.textContent = '限流中';
            badge.className = 'badge error';
            return;
        }
        if (data.success) {
            allAppsData = data.data;
            await loadInstalledVersions();
            renderFilterButtons();
            currentPage = 1;
            renderFilteredApps();
            showToast(data.message, 'success');
            updateLastRefreshTime();
            badge.textContent = '在线';
            badge.className = 'badge connected';
            writeAppsCache(allAppsData);
            if (typeof updateSourceFilterOptions === 'function') updateSourceFilterOptions();

            var devTab2 = document.getElementById('tabDevelopers');
            if (devTab2 && devTab2.classList.contains('active') && typeof renderDevelopers === 'function') {
                renderDevelopers();
            }
        } else {
            showToast('刷新失败: ' + data.message, 'error');
            badge.textContent = '失败';
            badge.className = 'badge error';
        }
    } catch (e) {
        showToast('刷新失败: ' + e.message, 'error');
        badge.textContent = '错误';
        badge.className = 'badge error';
    } finally {
        startCooldown(REFRESH_COOLDOWN);
        btn.disabled = false;
        btn.textContent = '刷新';
    }
}

function startCooldown(seconds) {
    var btn = document.getElementById('refreshBtn');
    if (!btn) return;
    refreshCooldown = true;
    var remaining = seconds;
    if (refreshTimer) clearInterval(refreshTimer);
    btn.classList.add('cooldown');
    refreshTimer = setInterval(function () {
        remaining--;
        if (remaining <= 0) {
            clearInterval(refreshTimer);
            refreshTimer = null;
            refreshCooldown = false;
            btn.disabled = false;
            btn.textContent = '刷新';
            btn.classList.remove('cooldown');
        } else {
            btn.textContent = remaining + 's';
        }
    }, 1000);
}

        } else {

        }
    });
});

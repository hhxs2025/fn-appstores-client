{% extends "layout.html" %}

{% block extra_css %}
<style>
    /* ===== 全局通用样式 ===== */
    * {
        transition: background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 4px;
        flex-shrink: 0;
        margin-bottom: 2px;
        padding: 4px 0 2px;
    }

    .toolbar .left {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .toolbar .count {
        color: var(--text-secondary);
        font-size: 11px;
        font-weight: 400;
    }

    .toolbar .count strong {
        color: var(--text-primary);
        font-weight: 500;
    }

    .toolbar .badge {
        padding: 1px 10px;
        border-radius: 4px;
        font-size: 9px;
        font-weight: 400;
        background: #e8eaed;
        color: #6b6b6b;
    }

    .toolbar .badge.cached {
        background: #e8eaed;
        color: #6b6b6b;
    }

    .toolbar .badge.connected {
        background: #e8eaed;
        color: #6b6b6b;
    }

    .toolbar .badge.loading {
        background: #e8eaed;
        color: #6b6b6b;
    }

    .toolbar .badge.error {
        background: #f5e6e0;
        color: #b55a5a;
    }

    .refresh-btn {
        background: transparent;
        color: var(--text-secondary);
        border: 1px solid #d5d7dd;
        padding: 2px 14px;
        border-radius: 4px;
        font-size: 10px;
        font-weight: 400;
        cursor: pointer;
        min-width: 56px;
        transition: all 0.2s ease;
    }

    .refresh-btn:hover:not(:disabled) {
        background: #e8eaed;
        border-color: #b8bac2;
    }

    .refresh-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .refresh-btn.cooldown {
        color: var(--text-muted);
        border-color: var(--border);
    }

    .search-bar {
        display: flex;
        gap: 4px;
        flex-shrink: 0;
        margin-bottom: 4px;
        padding: 2px 0;
    }

    .search-bar input {
        flex: 1;
        padding: 5px 12px;
        border: 1px solid #d5d7dd;
        border-radius: 6px;
        font-size: 11px;
        outline: none;
        transition: all 0.2s ease;
        background: #ffffff;
        color: var(--text-primary);
    }

    .search-bar input:focus {
        border-color: #b0a8a0;
        box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.03);
    }

    .search-bar input::placeholder {
        color: var(--text-muted);
    }

    .filter-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        flex-shrink: 0;
        margin-bottom: 4px;
        background: transparent;
        padding: 2px 0;
    }

    .filter-btn {
        background: transparent;
        border: 1px solid #d5d7dd;
        padding: 2px 12px;
        border-radius: 4px;
        font-size: 10px;
        font-weight: 400;
        cursor: pointer;
        color: var(--text-secondary);
        line-height: 1.4;
        transition: all 0.2s ease;
    }

    .filter-btn:hover {
        background: #e8eaed;
        border-color: #b8bac2;
    }

    .filter-btn.active {
        background: #e8eaed;
        border-color: #b0a8a0;
        color: var(--text-primary);
    }

    .tab-content.active .toolbar:first-of-type {
        border-bottom: 1px solid #e8e8ee;
        padding-bottom: 6px;
        margin-bottom: 4px;
    }

    .app-grid-wrapper {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
    }

    .app-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 10px;
        flex: 1;
        align-content: start;
        overflow-y: auto;
        padding: 4px 0 8px;
        min-height: 0;
        height: 100%;
        max-height: 100%;
    }

    /* ===== 应用卡片 ===== */
    .app-card {
        background: #ffffff;
        border-radius: 10px;
        padding: 14px 16px;
        border: 1px solid #e5e7eb;
        display: flex;
        flex-direction: column;
        cursor: pointer;
        transition: all 0.25s ease;
        min-height: 148px;
    }

    .app-card:hover {
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        border-color: #c5c7d0;
        transform: translateY(-1px);
        background: #fafcfd;
    }

    .app-card .top {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        margin-bottom: 4px;
    }

    .app-card .icon {
        width: 38px;
        height: 38px;
        border-radius: 8px;
        background: #e8eaed;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        overflow: hidden;
    }

    .app-card .icon img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .app-card .info {
        flex: 1;
        min-width: 0;
    }

    .app-card .info .name {
        font-size: 14px;
        font-weight: 500;
        color: var(--text-primary);
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px;
    }

    .app-card .info .version-text {
        font-size: 9px;
        color: var(--text-muted);
        background: transparent;
        padding: 0;
        font-weight: 400;
    }

    .app-card .info .update-badge {
        font-size: 8px;
        color: #8a7a5a;
        background: #f5efe0;
        padding: 0 6px;
        border-radius: 3px;
        font-weight: 400;
    }

    .app-card .info .installed-badge {
        font-size: 8px;
        color: #4a7a5a;
        background: #e6f0e6;
        padding: 0 6px;
        border-radius: 3px;
        font-weight: 400;
    }

    .app-card .info .author {
        font-size: 11px;
        color: var(--text-secondary);
        margin-top: 1px;
    }

    .app-card .info .source-tag {
        color: var(--text-muted);
        font-size: 9px;
        background: transparent;
        padding: 0;
        display: inline-block;
        margin-top: 2px;
        font-weight: 400;
    }

    .app-card .stats {
        display: flex;
        gap: 12px;
        font-size: 10px;
        color: var(--text-muted);
        margin: 3px 0 4px;
    }

    .app-card .stats span {
        display: flex;
        align-items: center;
        gap: 3px;
    }

    .app-card .tags,
    .modal-tags-detail {
        margin: 2px 0 5px;
        display: flex;
        flex-wrap: wrap;
        gap: 3px;
    }

    .app-card .tags .tag,
    .modal-tags-detail .tag {
        background: #eff6ff;
        color: #2563eb;
        font-size: 9px;
        padding: 0 10px;
        border-radius: 3px;
        font-weight: 400;
        border: none;
    }

    .app-card .desc {
        font-size: 11px;
        color: var(--text-secondary);
        line-height: 1.4;
        margin: 0 0 5px;
        flex: 1;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }

    /* ===== 卡片按钮 ===== */
    .app-card .actions {
        display: flex;
        gap: 4px;
        margin-top: 4px;
        flex-wrap: wrap;
    }

    .app-card .actions .btn {
        padding: 3px 16px;
        border: none;
        border-radius: 4px;
        font-size: 10px;
        font-weight: 400;
        cursor: pointer;
        flex: none;
        text-align: center;
        transition: all 0.2s ease;
    }

    .app-card .actions .btn-primary {
        background: #2563ea;
        color: #ffffff;
        border: none;
    }

    .app-card .actions .btn-primary:hover:not(:disabled) {
        background: #1d4ed8;
    }

    .app-card .actions .btn-primary:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .app-card .actions .btn-danger {
        background: transparent;
        color: #b55a5a;
        border: 1px solid #e8d0d0;
        padding: 3px 16px;
    }

    .app-card .actions .btn-danger:hover:not(:disabled) {
        background: #f5e8e8;
        border-color: #d0b0b0;
    }

    .app-card .actions .btn-warning {
        background: #fef3c7;
        color: #92400e;
        border: none;
        padding: 3px 16px;
    }

    .app-card .actions .btn-warning:hover:not(:disabled) {
        background: #fde68a;
    }

    .app-card .actions .btn-secondary {
        background: #e6f0e6;
        color: #4a7a5a;
        border: none;
        cursor: default;
        padding: 3px 16px;
    }

    .app-card .actions .btn-repo {
        background: transparent;
        color: var(--text-secondary);
        border: 1px solid #d5d7dd;
        padding: 3px 12px;
        border-radius: 4px;
        font-size: 10px;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        transition: all 0.2s ease;
        cursor: pointer;
    }

    .app-card .actions .btn-repo:hover {
        background: #e8eaed;
        border-color: #b8bac2;
    }

    /* ===== 进度条 ===== */
    .app-card .progress-container {
        display: none;
        margin-top: 6px;
        padding: 4px 0 2px;
    }

    .app-card .progress-container.show {
        display: block;
    }

    .app-card .progress-bar-bg {
        width: 100%;
        height: 3px;
        background: #e8e0d8;
        border-radius: 2px;
        overflow: hidden;
    }

    .app-card .progress-bar-fill {
        height: 100%;
        width: 0%;
        border-radius: 2px;
        background: #8aacd0;
        transition: width 0.3s ease;
    }

    .app-card .progress-bar-fill.complete {
        background: #7a9b7a;
    }

    .app-card .progress-bar-fill.error {
        background: #c47a7a;
    }

    .app-card .progress-text {
        font-size: 9px;
        color: var(--text-secondary);
        margin-top: 3px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .app-card .progress-text .status-msg {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .app-card .progress-details {
        font-size: 8px;
        color: var(--text-muted);
        margin-top: 1px;
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
    }

    .app-card .progress-details .speed {
        color: var(--text-secondary);
    }

    .app-card .status-text {
        font-size: 9px;
        display: none;
        padding: 1px 0;
        margin-top: 2px;
    }

    .app-card .status-text.show {
        display: block;
    }

    .app-card .status-text.success {
        color: #5a8a5a;
    }

    .app-card .status-text.error {
        color: #b55a5a;
    }

    .app-card .status-text.installing {
        color: var(--text-muted);
    }

    .empty-state {
        grid-column: 1 / -1;
        text-align: center;
        padding: 40px 20px;
        color: var(--text-muted);
    }

    .empty-state .icon {
        font-size: 36px;
        margin-bottom: 8px;
        opacity: 0.5;
    }

    .empty-state p {
        font-size: 12px;
    }

    .pagination {
        display: none;
        justify-content: center;
        align-items: center;
        gap: 8px;
        padding: 4px 0 2px;
        flex-shrink: 0;
    }

    .pagination.show {
        display: flex;
    }

    .page-btn {
        background: transparent;
        color: var(--text-secondary);
        border: 1px solid #d5d7dd;
        padding: 1px 12px;
        border-radius: 4px;
        font-size: 10px;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .page-btn:hover:not(:disabled) {
        background: #e8eaed;
    }

    .page-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
    }

    #pageInfo {
        color: var(--text-muted);
        font-size: 11px;
    }

    /* ===== 日志 ===== */
    #tabLogs {
        background: var(--card-bg);
        border-radius: 10px;
        padding: 12px 16px;
        overflow-y: auto;
        flex: 1;
        border: 1px solid var(--border);
        min-height: 0;
    }

    .log-item {
        padding: 3px 0;
        font-size: 11px;
        color: var(--text-secondary);
        border-bottom: 1px solid var(--border);
        font-family: "SF Mono", "Cascadia Code", monospace;
    }

    .log-item:last-child {
        border-bottom: none;
    }

    .log-empty {
        text-align: center;
        padding: 30px 0;
        color: var(--text-muted);
        font-size: 12px;
    }
    /* ===== 弹窗 ===== */
    .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(60, 60, 60, 0.3);
        z-index: 1000;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .modal-overlay.active {
        display: flex;
    }

    .modal-content {
        background: var(--card-bg);
        border-radius: 10px;
        max-width: 480px;
        width: 100%;
        max-height: 85vh;
        overflow-y: auto;
        padding: 20px 24px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
        animation: modalIn 0.2s ease;
    }

    @keyframes modalIn {
        from {
            opacity: 0;
            transform: scale(0.98) translateY(6px);
        }

        to {
            opacity: 1;
            transform: scale(1) translateY(0);
        }
    }

    .modal-close {
        float: right;
        background: none;
        border: none;
        font-size: 18px;
        cursor: pointer;
        color: var(--text-muted);
        line-height: 1;
        padding: 0 4px;
    }

    .modal-close:hover {
        color: var(--text-primary);
    }

    .modal-title {
        font-size: 16px;
        font-weight: 500;
        color: var(--text-primary);
        margin-bottom: 14px;
    }

    .modal-content .form-group {
        margin-bottom: 10px;
    }

    .modal-content .form-group label {
        display: block;
        font-size: 11px;
        font-weight: 400;
        color: var(--text-secondary);
        margin-bottom: 2px;
    }

    .modal-content .form-group input,
    .modal-content .form-group select {
        width: 100%;
        padding: 6px 10px;
        border: 1px solid #d5d7dd;
        border-radius: 4px;
        font-size: 11px;
        outline: none;
        transition: all 0.2s ease;
        background: var(--card-bg);
        color: var(--text-primary);
    }

    .modal-content .form-group input:focus,
    .modal-content .form-group select:focus {
        border-color: #b0a8a0;
        box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.03);
    }

    .modal-content .form-group .hint {
        font-size: 9px;
        color: var(--text-muted);
        margin-top: 1px;
    }

    .modal-actions .btn {
        padding: 6px 16px;
        border: 1px solid #d5d7dd;
        border-radius: 4px;
        font-size: 12px;
        font-weight: 400;
        cursor: pointer;
        transition: all 0.2s ease;
        width: 100%;
        background: transparent;
        color: var(--text-secondary);
    }

    .modal-actions .btn-primary {
        background: transparent;
        color: var(--text-secondary);
        border-color: #d5d7dd;
    }

    .modal-actions .btn-primary:hover:not(:disabled) {
        background: #e8eaed;
        border-color: #b8bac2;
    }

    .modal-actions .btn-primary:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    /* ===== 详情弹窗 ===== */
    .modal-overlay-detail {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(60, 60, 60, 0.3);
        z-index: 1000;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .modal-overlay-detail.active {
        display: flex;
    }

    .modal-content-detail {
        background: #ffffff;
        border-radius: 10px;
        width: 640px;
        max-width: 94vw;
        max-height: 90vh;
        overflow-y: auto;
        padding: 20px 28px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
        animation: modalIn 0.2s ease;
    }

    .modal-close-detail {
        float: right;
        background: none;
        border: none;
        font-size: 18px;
        cursor: pointer;
        color: var(--text-muted);
        line-height: 1;
        padding: 0 4px;
    }

    .modal-close-detail:hover {
        color: var(--text-primary);
    }

    .modal-icon-detail {
        width: 48px;
        height: 48px;
        border-radius: 8px;
        background: #e8eaed;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        margin-bottom: 6px;
    }

    .modal-icon-detail img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .modal-title-detail {
        font-size: 18px;
        font-weight: 500;
        color: var(--text-primary);
    }

    .modal-version-detail {
        font-size: 12px;
        color: var(--text-muted);
        margin-left: 6px;
    }

    .modal-author-detail {
        font-size: 12px;
        color: var(--text-secondary);
        margin: 2px 0 4px;
    }

    .modal-desc-detail {
        font-size: 13px;
        color: var(--text-secondary);
        line-height: 1.6;
        padding: 10px 14px;
        background: #f8fafc;
        border-radius: 6px;
        margin: 6px 0 10px;
        border-left: 2px solid #e5e7eb;
    }

    .modal-desc-detail p {
        margin: 0 0 6px;
    }

    .modal-desc-detail p:last-child {
        margin-bottom: 0;
    }

    /* ===== 标签页样式 ===== */
    .detail-tabs {
        display: flex;
        gap: 0;
        margin: 10px 0 8px;
        border-bottom: 1px solid var(--border);
    }

    .detail-tab {
        padding: 6px 16px;
        font-size: 12px;
        font-weight: 400;
        color: var(--text-secondary);
        background: transparent;
        border: none;
        border-bottom: 2px solid transparent;
        cursor: pointer;
        transition: all 0.2s ease;
        border-radius: 0;
    }

    .detail-tab:hover {
        color: var(--text-primary);
        background: #f5f5f5;
    }

    .detail-tab.active {
        color: var(--text-primary);
        border-bottom-color: #2563ea;
        font-weight: 500;
    }

    .detail-panel {
        display: none;
        min-height: 60px;
        max-height: 300px;
        overflow-y: auto;
        padding: 4px 0;
    }

    .detail-panel.active {
        display: block;
    }

    .detail-panel .modal-desc-detail {
        margin: 0;
    }

    /* ===== 轮播 ===== */
    .modal-screenshots-detail {
        margin: 10px 0;
    }

    .modal-screenshots-detail .screenshot-title {
        font-size: 12px;
        font-weight: 400;
        color: var(--text-secondary);
        margin-bottom: 6px;
    }

    .carousel-container {
        position: relative;
        overflow: hidden;
        border-radius: 6px;
        background: #e8eaed;
        min-height: 80px;
        display: none;
    }

    .carousel-track {
        display: flex;
        transition: transform 0.35s ease;
    }

    .carousel-track img {
        width: 100%;
        flex-shrink: 0;
        max-height: 220px;
        object-fit: contain;
        background: #f8f5f0;
        cursor: pointer;
    }

    .carousel-btn {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(60, 60, 60, 0.3);
        color: white;
        border: none;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 14px;
        display: none;
        align-items: center;
        justify-content: center;
        transition: background 0.15s ease;
        z-index: 5;
    }

    .carousel-btn:hover {
        background: rgba(60, 60, 60, 0.5);
    }

    .carousel-btn.prev {
        left: 6px;
    }

    .carousel-btn.next {
        right: 6px;
    }

    .carousel-btn.show {
        display: flex;
    }

    .carousel-dots {
        display: flex;
        justify-content: center;
        gap: 4px;
        padding: 5px 0 2px;
    }

    .carousel-dots .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #d0c8c0;
        border: none;
        cursor: pointer;
        transition: all 0.15s ease;
        padding: 0;
    }

    .carousel-dots .dot.active {
        background: #8a8a8a;
        width: 16px;
        border-radius: 3px;
    }

    .modal-stats-detail {
        display: flex;
        gap: 14px;
        font-size: 11px;
        color: var(--text-muted);
        padding: 6px 0;
        border-top: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
        margin: 4px 0 10px;
        flex-wrap: wrap;
    }

    .modal-actions-detail {
        display: flex;
        gap: 6px;
        margin-top: 4px;
        flex-wrap: wrap;
    }

    .modal-actions-detail .btn {
        padding: 4px 20px;
        border: 1px solid #d5d7dd;
        border-radius: 4px;
        font-size: 12px;
        font-weight: 400;
        cursor: pointer;
        transition: all 0.2s ease;
        background: transparent;
        color: var(--text-secondary);
        flex: none;
        min-width: 80px;
        text-align: center;
    }

    .modal-actions-detail .btn-primary {
        background: #2563ea;
        color: #ffffff;
        border: none;
    }

    .modal-actions-detail .btn-primary:hover:not(:disabled) {
        background: #1d4ed8;
    }

    .modal-actions-detail .btn-danger {
        background: transparent;
        color: #b55a5a;
        border: 1px solid #e8d0d0;

{% block content %}

<!-- ===== Toast ===== -->
<div class="toast" id="toast"></div>

<!-- ===== 应用列表 ===== -->
<div id="tabApps" class="tab-content active">
    <div class="toolbar">
        <div class="left">
            <span class="badge" id="statusBadge">在线</span>
            <span class="count">共 <strong id="appCount">0</strong> 个应用</span>
            <span class="count" style="font-size:10px;color:var(--text-muted);" id="lastRefresh">--</span>
        </div>
        <button class="refresh-btn" id="refreshBtn" onclick="refreshApps()">刷新</button>
    </div>

    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="搜索应用名称、描述、作者..." oninput="searchApps()">
    </div>

    <div class="filter-bar" id="filterBar">
        <button class="filter-btn active" data-tag="all" onclick="filterByTag('all')">全部</button>
    </div>

    <div class="app-grid-wrapper">
        <div class="app-grid" id="appGrid">
            <div class="empty-state">
                <div class="icon">·</div>
                <p>加载中...</p>
            </div>
        </div>
        <div class="pagination" id="pagination">
            <button class="page-btn" onclick="prevPage()" id="prevBtn">上一页</button>
            <span id="pageInfo">1/1</span>
            <button class="page-btn" onclick="nextPage()" id="nextBtn">下一页</button>
        </div>
    </div>
</div>

<!-- ===== 关于 ===== -->
<div id="tabAbout" class="tab-content">
    <div id="aboutContent" class="about-container">
        <span style="color:var(--text-muted);font-size:12px;">加载中...</span>
    </div>
</div>

<!-- ===== 源管理（独立Tab） ===== -->

        <div class="left">

        </div>

                <input type="text" id="newSourceUrl" placeholder="http://xxx:5660" style="flex:2;min-width:140px;padding:4px 10px;border:1px solid var(--border);border-radius:4px;font-size:12px;background:var(--bg);color:var(--text-primary);">

<!-- ===== 大图预览弹窗 ===== -->

        </div>
        <div class="image-counter" id="imageCounter">1 / 1</div>

<div class="modal-overlay" id="wizardModal" onclick="if(event.target===this) closeWizard()">

        <button class="modal-close" onclick="closeWizard()">✕</button>

        <div id="wizardBody"></div>

            <button class="btn btn-primary" id="wizardSubmitBtn" onclick="submitWizard()">确认安装</button>
            <button class="btn"

    </div>
</div>

{% block extra_js %}

<script>
    // ================================================================
    // ✅ API 基础地址（2.2.0）
    // ================================================================
    var API_BASE = window.location.origin;

    var currentTag = 'all';
    var currentPage = 1;
    var pageSize = 8;
    var allAppsData = [];
    var installedAppsCache = {};
    var currentDetailApp = null;
    var currentSlide = 0;
    var slideCount = 0;

    var refreshCooldown = false;
    var refreshTimer = null;
    var REFRESH_COOLDOWN = 30;

    var currentWizardSessionId = null;

    var imageList = [];
    var currentImageIndex = 0;

    // ================================================================
    // Toast
    // ================================================================
    function showToast(msg, type) {
        var toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.className = 'toast show ' + (type || '');
        var durations = {success: 2500, error: 4000, warning: 3000, info: 2000};
        var duration = durations[type] || 3000;
        clearTimeout(toast._timer);
        toast._timer = setTimeout(function () {toast.classList.remove('show');}, duration);
    }

    // ================================================================
    // 工具函数
    // ================================================================
    function compareVersions(v1, v2) {
        if (!v1 || !v2) return 0;
        v1 = String(v1).replace(/^v/, '');
        v2 = String(v2).replace(/^v/, '');
        var parts1 = v1.split('.').map(Number);
        var parts2 = v2.split('.').map(Number);
        for (var i = 0; i < Math.max(parts1.length, parts2.length); i++) {
            var a = parts1[i] || 0;
            var b = parts2[i] || 0;
            if (a > b) return 1;
            if (a < b) return -1;
        }
        return 0;
    }

    function getTagsArray(tags) {
        if (!tags) return [];
        if (Array.isArray(tags)) return tags;
        if (typeof tags === 'string') {
            return tags.split(',').map(function (s) {return s.trim();}).filter(function (s) {return s;});
        }
        return [];
    }

    // 主题切换
    // ================================================================

    }

    function setTheme(theme) {
        localStorage.setItem('fnsoft_theme', theme);

    // 标签页切换
    // ================================================================
    function switchDetailTab(tabName) {
        document.querySelectorAll('.detail-tab').forEach(function (tab) {
            tab.classList.toggle('active', tab.dataset.tab === tabName);

    // ================================================================
    // 应用列表过滤与分页
    // ================================================================
    function searchApps() {
        currentPage = 1;
        renderFilteredApps();
    }

    function filterByTag(tag) {
        currentTag = tag;
        document.querySelectorAll('.filter-btn').forEach(function (btn) {
            btn.classList.toggle('active', btn.dataset.tag === tag);
        });
        currentPage = 1;
        renderFilteredApps();
    }

    function renderFilterButtons(apps) {
        var tagSet = new Set();
        apps.forEach(function (app) {
            var tags = getTagsArray(app.tags);
            tags.forEach(function (t) {if (t) tagSet.add(t);});
        });
        var tags = ['all', ...tagSet];
        var container = document.getElementById('filterBar');
        var tagLabels = {'all': '全部'};
        container.innerHTML = tags.map(function (tag) {
            return '<button class="filter-btn' + (tag === 'all' ? ' active' : '') + '" data-tag="' + tag + '" onclick="filterByTag(\'' + tag + '\')">' + (tagLabels[tag] || tag) + '</button>';
        }).join('');
    }

    function getCurrentPageData(apps) {
        var start = (currentPage - 1) * pageSize;
        return apps.slice(start, start + pageSize);
    }

    function renderPagination(total) {
        var totalPages = Math.ceil(total / pageSize);
        var el = document.getElementById('pagination');
        if (totalPages <= 1) {
            el.classList.remove('show');
            return;
        }
        el.classList.add('show');
        document.getElementById('pageInfo').textContent = currentPage + '/' + totalPages;
        document.getElementById('prevBtn').disabled = currentPage === 1;
        document.getElementById('nextBtn').disabled = currentPage === totalPages;
    }

    function prevPage() {
        if (currentPage > 1) {currentPage--; renderFilteredApps();}
    }
    function nextPage() {
        var totalPages = Math.ceil(getFilteredApps().length / pageSize);
        if (currentPage < totalPages) {currentPage++; renderFilteredApps();}
    }

    function getFilteredApps() {
        var result = allAppsData;
        var keyword = document.getElementById('searchInput').value.toLowerCase().trim();
        if (keyword) {
            result = result.filter(function (app) {
                return (app.name && app.name.toLowerCase().includes(keyword)) ||
                    (app.desc && app.desc.toLowerCase().includes(keyword)) ||
                    (app.author && app.author.toLowerCase().includes(keyword));
            });
        }
        if (currentTag !== 'all') {
            var tagsArray = getTagsArray(currentTag);
            result = result.filter(function (app) {
                var appTags = getTagsArray(app.tags);
                return appTags.some(function (t) {return tagsArray.includes(t);});
            });
        }
        return result;
    }

    function renderFilteredApps() {
        var filtered = getFilteredApps();
        var pageData = getCurrentPageData(filtered);
        renderApps(pageData);
        renderPagination(filtered.length);
        document.getElementById('appCount').textContent = filtered.length;
    }

    // ================================================================
    // 轮播
    // ================================================================
    function initCarousel(screenshots) {
        var container = document.getElementById('carouselContainer');
        var track = document.getElementById('carouselTrack');
        var prevBtn = document.getElementById('carouselPrev');
        var nextBtn = document.getElementById('carouselNext');
        var dotsContainer = document.getElementById('carouselDots');
        slideCount = screenshots.length;
        currentSlide = 0;
        if (slideCount === 0) {
            container.style.display = 'none';
            return;
        }
        container.style.display = 'block';
        window._currentScreenshots = screenshots;
        track.innerHTML = screenshots.map(function (url, index) {
            return '<img src="' + url + '" alt="应用截图" loading="lazy" onerror="this.style.display=\'none\'" onclick="event.stopPropagation();openImageModal(window._currentScreenshots || [], ' + index + ')">';
        }).join('');
        prevBtn.classList.toggle('show', slideCount > 1);
        nextBtn.classList.toggle('show', slideCount > 1);
        if (slideCount > 1) {
            dotsContainer.innerHTML = screenshots.map(function (_, i) {
                return '<button class="dot' + (i === 0 ? ' active' : '') + '" onclick="goToSlide(' + i + ')"></button>';
            }).join('');
        } else {
            dotsContainer.innerHTML = '';
        }
        updateCarousel();
    }

    function updateCarousel() {
        var track = document.getElementById('carouselTrack');
        track.style.transform = 'translateX(-' + (currentSlide * 100) + '%)';
        document.querySelectorAll('.carousel-dots .dot').forEach(function (dot, i) {
            dot.classList.toggle('active', i === currentSlide);
        });
    }

    function carouselPrev() {
        if (slideCount <= 1) return;
        currentSlide = (currentSlide - 1 + slideCount) % slideCount;
        updateCarousel();
    }
    function carouselNext() {
        if (slideCount <= 1) return;
        currentSlide = (currentSlide + 1) % slideCount;
        updateCarousel();
    }
    function goToSlide(index) {
        currentSlide = index;
        updateCarousel();
    }

        currentDetailApp = app;

        document.getElementById('modalIcon').innerHTML = app.icon ? '<img src="' + app.icon + '" alt="' + app.name + '">' : '·';
        document.getElementById('modalTitle').textContent = app.name;

        var versionText = app.installed ? (app.installed_version || app.version) : app.version;

        document.getElementById('modalVersion').textContent = 'v' + versionText;
        document.getElementById('modalVersionInfo').textContent = app.version;

        document.getElementById('modalAuthor').textContent = app.author || '作者';
        document.getElementById('modalDesc').innerHTML = app.desc || '暂无描述';
        document.getElementById('modalSource').textContent = app._source_name || '未知源';

        } else {

        // 安装按钮
        var btn = document.getElementById('modalInstallBtn');
        if (app.installed) {
            if (app.has_update) {
                btn.textContent = '更新';
                btn.className = 'btn btn-warning';
                btn.disabled = false;
                btn.dataset.action = 'update';
            } else {
                btn.textContent = '已安装';
                btn.className = 'btn btn-secondary';
                btn.disabled = true;
                btn.dataset.action = 'none';

            btn.textContent = '安装';
            btn.className = 'btn btn-primary';
            btn.disabled = false;
            btn.dataset.action = 'install';

        btn.dataset.appId = app.id;

        if (app.repo) {
            repoBtn.href = app.repo;
            repoBtn.style.display = 'inline-flex';

    function modalInstall() {
        var btn = document.getElementById('modalInstallBtn');
        var appId = btn.dataset.appId;
        if (!appId) return;
        if (btn.dataset.action === 'none') {
            showToast('应用已安装', 'info');

            closeDetail();
            setTimeout(function () {installApp(appId);}, 200);

    // ================================================================
    // 加载应用列表（支持前端缓存）
    // ================================================================
    async function loadApps() {
        var hasCache = false;
        try {
            var cached = localStorage.getItem('fnsoft_apps_cache');
            if (cached) {
                var cacheData = JSON.parse(cached);
                if (Date.now() - cacheData.timestamp < 10 * 60 * 1000) {
                    allAppsData = cacheData.data;
                    setTimeout(function() { restoreAppsView(); }, 100);
                    document.getElementById('statusBadge').textContent = '缓存';
                    document.getElementById('statusBadge').className = 'badge cached';
                    hasCache = true;
                    return;
                }
            }
        } catch (e) { }

        try {
            var controller = new AbortController();
            var timeoutId = setTimeout(function () { controller.abort(); }, 30000);
            var resp = await fetch(API_BASE + '/api/apps', { signal: controller.signal });
            clearTimeout(timeoutId);

            if (resp.status === 429) {
                var data = await resp.json();
                showToast(data.message, 'warning');
                startCooldown(data.retry_after || 30);
                document.getElementById('appGrid').innerHTML =
                    '<div class="empty-state"><div class="icon">⏳</div><p>请求过于频繁，请 ' + (data.retry_after || 30) + ' 秒后点击刷新</p></div>';
                document.getElementById('appCount').textContent = '0';
                return;
            }

            var data = await resp.json();
            if (data.success && data.data.length > 0) {
                allAppsData = data.data;
                await loadInstalledVersions();
                renderFilterButtons(allAppsData);
                currentPage = 1;
                setTimeout(function() {
                    restoreAppsView();
                }, 300);

                document.getElementById('statusBadge').textContent = '在线';
                document.getElementById('statusBadge').className = 'badge connected';
                updateLastRefreshTime();

                localStorage.setItem('fnsoft_apps_cache', JSON.stringify({
                    timestamp: Date.now(),
                    data: allAppsData
                }));
            } else if (!hasCache) {
                document.getElementById('appGrid').innerHTML =
                    '<div class="empty-state"><div class="icon">⚠️</div><p>加载失败，请点击右上角「刷新」重试</p></div>';
                document.getElementById('appCount').textContent = '0';
                allAppsData = [];
            }
        } catch (e) {
            if (e.name === 'AbortError') {
                showToast('请求超时，请点击刷新重试', 'error');
            } else {
                showToast('加载失败: ' + e.message, 'error');
            }
            if (!hasCache) {
                allAppsData = [];
                document.getElementById('appGrid').innerHTML =
                    '<div class="empty-state"><div class="icon">⚠️</div><p>加载失败，请点击右上角「刷新」重试</p></div>';
                document.getElementById('appCount').textContent = '0';
            }
        }
    }

    // ================================================================
    // 恢复应用列表视图（供 Tab 切换时调用）
    // ================================================================
    function restoreAppsView() {
        try {
            var cached = localStorage.getItem('fnsoft_apps_cache');
            if (cached) {
                var cacheData = JSON.parse(cached);
                if (Date.now() - cacheData.timestamp < 10 * 60 * 1000) {
                    allAppsData = cacheData.data;
                    renderFilteredApps();
                    document.getElementById('statusBadge').textContent = '缓存';
                    document.getElementById('statusBadge').className = 'badge cached';
                    return;
                }
            }
        } catch (e) {}

        if (allAppsData && allAppsData.length > 0) {
            renderFilteredApps();
            return;
        }

        loadApps();
    }

    async function loadInstalledVersions() {
        try {
            var resp = await fetch(API_BASE + '/api/installed');
            var data = await resp.json();
            if (data.success) {
                installedAppsCache = {};
                data.apps.forEach(function (app) {
                    installedAppsCache[app.id] = app.version;
                });
                allAppsData.forEach(function (app) {
                    if (app.id in installedAppsCache) {
                        app.installed = true;
                        app.installed_version = installedAppsCache[app.id];
                        app.has_update = app.installed_version && app.version &&
                            compareVersions(app.version, app.installed_version) > 0;
                    } else {
                        app.installed = false;
                        app.has_update = false;
                    }
                });
            }
        } catch (e) {
            console.warn('获取已安装版本失败:', e);
        }
    }

    function updateLastRefreshTime() {
        var el = document.getElementById('lastRefresh');
        if (el) {
            var now = new Date();
            el.textContent = '上次刷新: ' + now.toLocaleTimeString();
        }
    }

    async function refreshApps() {
        var btn = document.getElementById('refreshBtn');
        var badge = document.getElementById('statusBadge');

        if (refreshCooldown) {
            showToast('刷新冷却中，请稍后再试', 'warning');
            return;
        }
        if (btn.disabled) {
            showToast('正在加载中，请稍候...', 'warning');
            return;
        }

        btn.disabled = true;
        btn.textContent = '刷新中...';
        badge.textContent = '加载中';
        badge.className = 'badge loading';

        try {
            var resp = await fetch(API_BASE + '/api/refresh', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'}
            });
            var data = await resp.json();

            if (resp.status === 429) {
                var waitTime = data.retry_after || 30;
                showToast(data.message, 'warning');
                startCooldown(waitTime);
                badge.textContent = '限流中';
                badge.className = 'badge error';
                return;
            }

            if (data.success) {
                allAppsData = data.data;
                await loadInstalledVersions();
                renderFilterButtons(allAppsData);
                currentPage = 1;
                renderFilteredApps();
                showToast(data.message, 'success');
                updateLastRefreshTime();
                badge.textContent = '在线';
                badge.className = 'badge connected';

                localStorage.setItem('fnsoft_apps_cache', JSON.stringify({
                    timestamp: Date.now(),
                    data: allAppsData
                }));
            } else {
                showToast('刷新失败: ' + data.message, 'error');
                badge.textContent = '失败';
                badge.className = 'badge error';
            }
        } catch (e) {
            showToast('刷新失败: ' + e.message, 'error');
            badge.textContent = '错误';
            badge.className = 'badge error';
        } finally {
            startCooldown(REFRESH_COOLDOWN);
            btn.disabled = false;
            btn.textContent = '刷新';
        }
    }

    function startCooldown(seconds) {
        var btn = document.getElementById('refreshBtn');
        refreshCooldown = true;
        var remaining = seconds;
        if (refreshTimer) clearInterval(refreshTimer);
        btn.classList.add('cooldown');
        refreshTimer = setInterval(function () {
            remaining--;
            if (remaining <= 0) {
                clearInterval(refreshTimer);
                refreshTimer = null;
                refreshCooldown = false;
                btn.disabled = false;
                btn.textContent = '刷新';
                btn.classList.remove('cooldown');
            } else {
                btn.textContent = remaining + 's';
            }
        }, 1000);
    }

    // ================================================================
    // WebSocket
    // ================================================================
    var ws = null;
    var wsReady = false;
    var reconnectTimer = null;

    function connectWS() {
                              
        var url = window.location.origin.replace(/^http/,'ws') + '/ws';
        try {
            if (ws && (ws.readyState === WebSocket.CONNECTING || ws.readyState === WebSocket.OPEN)) return;
            ws = new WebSocket(url);
            ws.onopen = function () {console.log('WebSocket 已连接'); wsReady = true;};
            ws.onmessage = function (e) {
                try {
                    var msg = JSON.parse(e.data);
                    handleWsMessage(msg);
                } catch (err) {
                    console.warn('解析WS消息失败:', err);
                }
            };
            ws.onclose = function () {
                console.log('WebSocket 已断开');
                wsReady = false;
                ws = null;
                if (reconnectTimer) clearTimeout(reconnectTimer);
                reconnectTimer = setTimeout(connectWS, 3000);
            };
            ws.onerror = function () {ws.close();};
        } catch (e) {
            wsReady = false;
            if (reconnectTimer) clearTimeout(reconnectTimer);
            reconnectTimer = setTimeout(connectWS, 3000);
        }
    }

    function handleWsMessage(msg) {
        if (msg.event === 'wizard.show') {
            var data = msg.data;
            showWizardFromSession(data.session_id, data.steps, data.title);
            return;
        }

        if (msg.event === 'progress') {
            var data = msg.data;
            var appId = data.app_id;

            var btn = document.getElementById('installBtn-' + appId);
            if (btn) {
                btn.disabled = true;
                btn.textContent = '安装中...';
            }

            var progressContainer = document.getElementById('progress-' + appId);
            if (progressContainer) {
                progressContainer.classList.add('show');
            }

            var progressBar = document.getElementById('progressBar-' + appId);
            if (progressBar) {
                var pct = data.progress || 0;
                progressBar.style.width = Math.min(100, pct) + '%';
                progressBar.className = 'progress-bar-fill';
            }

            var msgEl = document.getElementById('progressMsg-' + appId);
            if (msgEl) {
                msgEl.textContent = data.msg || '处理中...';
            }

            var speedEl = document.getElementById('speed-' + appId);
            if (speedEl) {
                speedEl.textContent = data.speed_str || '';
            }

            var etaEl = document.getElementById('eta-' + appId);
            if (etaEl) {
                if (data.eta !== undefined && data.eta > 0) {
                    etaEl.textContent = '剩余 ' + data.eta + 's';
                } else if (data.eta === 0 && data.stage === 'download') {
                    etaEl.textContent = '即将完成';
                } else {
                    etaEl.textContent = '';
                }
            }

            var statusDiv = document.getElementById('status-' + appId);
            if (statusDiv) {
                statusDiv.className = 'status-text show installing';
            }
            return;
        }

        if (msg.event === 'result') {
            var data = msg.data;
            var appId = data.app_id;

            var progressContainer = document.getElementById('progress-' + appId);
            var progressBar = document.getElementById('progressBar-' + appId);
            var statusDiv = document.getElementById('status-' + appId);
            var btn = document.getElementById('installBtn-' + appId);

            if (data.status === 'success') {
                if (progressBar) {
                    progressBar.style.width = '100%';
                    progressBar.className = 'progress-bar-fill complete';
                }
                var msgEl = document.getElementById('progressMsg-' + appId);
                if (msgEl) msgEl.textContent = '安装完成';
                if (statusDiv) {
                    statusDiv.className = 'status-text show success';
                    statusDiv.textContent = '✓ ' + data.msg;
                }
                if (btn) {
                    btn.disabled = true;
                    btn.textContent = '已安装';
                }

                var app = allAppsData.find(function (a) {return a.id === appId;});
                var appName = app ? app.name : appId;
                showToast(appName + ' 安装成功', 'success');

                setTimeout(function () {
                    if (progressContainer) progressContainer.classList.remove('show');
                }, 5000);

                setTimeout(function () {
                    refreshApps();
                }, 3000);
            } else {
                if (progressBar) {
                    progressBar.className = 'progress-bar-fill error';
                }
                var msgEl2 = document.getElementById('progressMsg-' + appId);
                if (msgEl2) msgEl2.textContent = data.msg;

                if (statusDiv) {
                    statusDiv.className = 'status-text show error';
                    statusDiv.textContent = '✗ ' + data.msg;
                }
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = '安装';
                }
                showToast(data.msg, 'error');
            }
            return;
        }
    }

    // ================================================================
    // 安装 / 更新
    // ================================================================
    async function installApp(appId) {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
            showToast('连接中，请稍候...', '');
            if (typeof connectWS === 'function') {
                connectWS();
                setTimeout(function () {
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        installApp(appId);
                    } else {
                        showToast('连接失败，请刷新页面重试', 'error');
                    }
                }, 2000);
            }
            return;
        }

        var btn = document.getElementById('installBtn-' + appId);
        if (btn && btn.disabled) return;
        if (btn) {btn.disabled = true; btn.textContent = '安装中...';}

        var progressContainer = document.getElementById('progress-' + appId);
        if (progressContainer) progressContainer.classList.add('show');
        var msgEl = document.getElementById('progressMsg-' + appId);
        if (msgEl) msgEl.textContent = '准备中...';

        try {
            var resp = await fetch(API_BASE + '/api/app/' + appId);
            var data = await resp.json();
            if (!data.success || !data.data.download_url) {
                showToast('获取下载地址失败', 'error');
                if (btn) {btn.disabled = false; btn.textContent = '安装';}
                if (progressContainer) progressContainer.classList.remove('show');
                return;
            }
            ws.send(JSON.stringify({event: 'install', data: {app_id: appId, download_url: data.data.download_url}}));
            showToast('开始安装...', '');
        } catch (e) {
            showToast(e.message, 'error');
            if (btn) {btn.disabled = false; btn.textContent = '安装';}
            if (progressContainer) progressContainer.classList.remove('show');
        }
    }

    async function updateApp(appId) {
        if (!confirm('确定要更新该应用吗？')) return;

        if (!ws || ws.readyState !== WebSocket.OPEN) {
            showToast('连接中，请稍候...', '');
            if (typeof connectWS === 'function') {
                connectWS();
                setTimeout(function () {
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        updateApp(appId);
                    } else {
                        showToast('连接失败，请刷新页面重试', 'error');
                    }
                }, 2000);
            }
            return;
        }

        var btn = document.getElementById('updateBtn-' + appId);
        if (btn) {btn.disabled = true; btn.textContent = '更新中...';}
        try {
            var resp = await fetch(API_BASE + '/api/app/' + appId);
            var data = await resp.json();
            if (!data.success || !data.data.download_url) {
                showToast('获取下载地址失败', 'error');
                if (btn) {btn.disabled = false; btn.textContent = '更新';}
                return;
            }
            ws.send(JSON.stringify({event: 'install', data: {app_id: appId, download_url: data.data.download_url}}));

        } catch (e) {
            showToast(e.message, 'error');
            if (btn) {btn.disabled = false; btn.textContent = '更新';}
        }
    }

    // ================================================================
    // 向导
    // ================================================================
    function showWizardFromSession(sessionId, steps, title) {
        currentWizardSessionId = sessionId;
        var modal = document.getElementById('wizardModal');
        var body = document.getElementById('wizardBody');
        var status = document.getElementById('wizardStatus');
        document.getElementById('wizardTitle').textContent = title || '安装向导';
        status.textContent = '请填写配置项';

        var htmlContent = '';
        if (steps && steps.length > 0) {
            var items = steps.flatMap(function (step) { return step.items || []; });
            if (items.length === 0) {
                htmlContent = '<p>无配置项，点击确认安装</p>';
            } else {
                items.forEach(function (item) {
                    // ===== 先处理 tips 类型 =====
                    if (item.type === 'tips') {
                        // 优先使用 helpText，若为空则尝试 label，再尝试 initValue，最后默认“提示信息”
                        var tipText = item.helpText || item.label || item.initValue || '提示信息';
                        htmlContent += '<div class="wizard-field">';
                        htmlContent += '<div class="hint" style="margin-bottom:8px;">' + tipText + '</div>';
                        htmlContent += '</div>';
                        return; // 跳过后续 label 和输入框渲染
                    }

                    // ===== 非 tips 类型 =====
                    var required = item.rules && item.rules.some(function (r) { return r.required; });
                    htmlContent += '<div class="wizard-field">';
                    htmlContent += '<label>' + (item.label || item.field) + (required ? ' <span class="required">*</span>' : '') + '</label>';

                    if (item.type === 'text' || item.type === 'password') {
                        var inputType = item.type === 'password' ? 'password' : 'text';
                        htmlContent += '<input type="' + inputType + '" id="wizard_' + item.field + '" name="' + item.field + '" value="' + (item.initValue || '') + '"' + (required ? ' required' : '') + '>';
                    } else if (item.type === 'radio' || item.type === 'select') {
                        htmlContent += '<select id="wizard_' + item.field + '" name="' + item.field + '">';
                        (item.options || []).forEach(function (opt) {
                            htmlContent += '<option value="' + opt.value + '"' + (opt.value === item.initValue ? ' selected' : '') + '>' + opt.label + '</option>';
                        });
                        htmlContent += '</select>';
                    } else if (item.type === 'switch') {
                        var checked = item.initValue === 'true' || item.initValue === true;
                        htmlContent += '<div style="display:flex;align-items:center;gap:4px;"><input type="checkbox" id="wizard_' + item.field + '" name="' + item.field + '"' + (checked ? ' checked' : '') + '> ' + item.label + '</div>';
                    } else {
                        // 未知类型默认文本输入
                        htmlContent += '<input type="text" id="wizard_' + item.field + '" name="' + item.field + '" value="' + (item.initValue || '') + '">';
                    }

                    // 如果非 tips 类型有 helpText，作为辅助提示
                    if (item.helpText && item.type !== 'tips') {
                        htmlContent += '<div class="hint">' + item.helpText + '</div>';
                    }
                    htmlContent += '</div>';
                });
            }
        } else {
            htmlContent = '<p>无配置项，点击确认安装</p>';
        }
        body.innerHTML = htmlContent;
        document.getElementById('wizardSubmitBtn').disabled = false;
        modal.classList.add('active');
    }

    function closeWizard() {
        if (currentWizardSessionId) {
            fetch(API_BASE + '/api/wizard/cancel', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({session_id: currentWizardSessionId})
            }).catch(function () { });
            currentWizardSessionId = null;
        }
        document.getElementById('wizardModal').classList.remove('active');
    }

    async function submitWizard() {
        var btn = document.getElementById('wizardSubmitBtn');
        if (btn.disabled) return;
        btn.disabled = true;
        var status = document.getElementById('wizardStatus');
        status.textContent = '安装中...';

        var inputs = {};
        var fields = document.querySelectorAll('#wizardBody input, #wizardBody select, #wizardBody textarea');
        fields.forEach(function (el) {
            var name = el.name;
            if (!name) return;
            if (el.type === 'checkbox') {
                inputs[name] = el.checked ? 'true' : 'false';
            } else {
                inputs[name] = el.value;
            }
        });

        try {
            var resp = await fetch(API_BASE + '/api/wizard/install', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({session_id: currentWizardSessionId, inputs: inputs})
            });
            var result = await resp.json();
            if (result.success) {
                status.textContent = '安装成功';
                showToast('安装成功', 'success');
                closeWizard();
                setTimeout(function () {refreshApps();}, 2000);
            } else {
                status.textContent = result.message;
                btn.disabled = false;
            }
        } catch (e) {
            status.textContent = e.message;
            btn.disabled = false;
        }
    }

    // ================================================================
    // 🆕 软件源管理（2.2.0-beta开始）
    // ================================================================

    async function loadSources(force = false) {
        var container = document.getElementById('sourceList');
        container.innerHTML = '<div style="text-align:center;padding:12px;color:var(--text-muted);font-size:11px;">加载中...</div>';

        try {
            var resp = await fetch(API_BASE + '/api/sources?force=' + (force ? 'true' : 'false'));
            var data = await resp.json();
            if (!data.success || !data.data) {
                container.innerHTML = '<div style="text-align:center;padding:12px;color:#b55a5a;font-size:11px;">加载失败</div>';
                return;
            }

            var sources = data.data;
            if (sources.length === 0) {
                container.innerHTML = '<div style="text-align:center;padding:12px;color:var(--text-muted);font-size:11px;">暂无软件源</div>';
                return;
            }

           container.innerHTML = sources.map(function(source) {
                var statusColor = source.status === 'online' ? '#5a8a5a' :
                      source.status === 'disabled' ? '#999' :
                      source.status === 'offline' ? '#b55a5a' : '#999';
                var statusText = source.status === 'online' ? '在线' :
                     source.status === 'disabled' ? '已禁用' :
                     source.status === 'offline' ? '离线' : '未知';
                var isDefault = source.id === 'official' || source.id === 'official_backup';

                return '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border);">' +
                    '<div style="flex:1;min-width:0;">' +
                    '<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">' +
                    '<span style="font-size:13px;font-weight:500;color:var(--text-primary);">' + source.name + '</span>' +
                    (isDefault ? '<span style="font-size:8px;background:#e8eaed;color:#6b6b6b;padding:0 6px;border-radius:3px;">官方</span>' : '') +
                    '<span style="font-size:9px;color:' + statusColor + ';">● ' + statusText + '</span>' +
                    '</div>' +
                    '<div style="font-size:10px;color:var(--text-muted);word-break:break-all;">' + source.url + '</div>' +
                    (source.status_msg && source.status !== 'online' ? '<div style="font-size:9px;color:#b55a5a;">' + source.status_msg + '</div>' : '') +
                    '</div>' +
                    '<div style="display:flex;gap:4px;flex-shrink:0;margin-left:8px;">' +
                    (source.enabled ?
                        '<button onclick="toggleSource(\'' + source.id + '\',false)" style="padding:1px 8px;border:1px solid #5a8a5a;border-radius:3px;background:transparent;color:#5a8a5a;cursor:pointer;font-size:9px;">启用</button>' :
                        '<button onclick="toggleSource(\'' + source.id + '\',true)" style="padding:1px 8px;border:1px solid #999;border-radius:3px;background:transparent;color:#999;cursor:pointer;font-size:9px;">禁用</button>'
                    ) +
                    (isDefault ? '' : '<button onclick="removeSource(\'' + source.id + '\')" style="padding:1px 8px;border:1px solid #b55a5a;border-radius:3px;background:transparent;color:#b55a5a;cursor:pointer;font-size:9px;">删除</button>') +
                    '</div>' +
                    '</div>';
            }).join('');
        } catch (e) {
            container.innerHTML = '<div style="text-align:center;padding:12px;color:#b55a5a;font-size:11px;">加载失败: ' + e.message + '</div>';
        }
    }

    async function addSource() {
        var nameEl = document.getElementById('newSourceName');
        var urlEl = document.getElementById('newSourceUrl');
        var name = nameEl.value.trim();
        var url = urlEl.value.trim();

        if (!name || !url) {
            showToast('请填写名称和地址', 'warning');
            return;
        }

        try {
            var resp = await fetch(API_BASE + '/api/sources/add', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name: name, url: url})
            });
            var data = await resp.json();
            if (data.success) {
                showToast('添加成功', 'success');
                nameEl.value = '';
                urlEl.value = '';
                document.getElementById('testResult').textContent = '';
                loadSources();
                setTimeout(function() { refreshApps(); }, 500);
            } else {
                showToast(data.message, 'error');
            }
        } catch (e) {
            showToast('添加失败: ' + e.message, 'error');
        }
    }

    async function removeSource(sourceId) {
        if (!confirm('确定要删除该软件源吗？')) return;

        try {
            var resp = await fetch(API_BASE + '/api/sources/remove', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({id: sourceId})
            });
            var data = await resp.json();
            if (data.success) {
                showToast('删除成功', 'success');
                loadSources();
                setTimeout(function() { refreshApps(); }, 500);
            } else {
                showToast(data.message, 'error');
            }
        } catch (e) {
            showToast('删除失败: ' + e.message, 'error');
        }
    }

    async function toggleSource(sourceId, enabled) {
        try {
            var resp = await fetch(API_BASE + '/api/sources/toggle', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({id: sourceId, enabled: enabled})
            });
            var data = await resp.json();
            if (data.success) {
                showToast(data.message, 'success');
                loadSources();
                setTimeout(function() { refreshApps(); }, 500);
            } else {
                showToast(data.message, 'error');
            }
        } catch (e) {
            showToast('操作失败: ' + e.message, 'error');
        }
    }

    async function testSourceUrl() {
        var urlEl = document.getElementById('newSourceUrl');
        var url = urlEl.value.trim();
        var resultEl = document.getElementById('testResult');

        if (!url) {
            resultEl.textContent = '⚠️ 请输入地址';
            resultEl.style.color = '#b55a5a';
            return;
        }

        resultEl.textContent = '⏳ 测试中...';
        resultEl.style.color = 'var(--text-muted)';

        try {
            var resp = await fetch(API_BASE + '/api/sources/test', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({url: url})
            });
            var data = await resp.json();
            if (data.success) {
                resultEl.textContent = '✅ ' + data.message;
                resultEl.style.color = '#5a8a5a';
            } else {
                resultEl.textContent = '❌ ' + data.message;
                resultEl.style.color = '#b55a5a';
            }
        } catch (e) {
            resultEl.textContent = '❌ 测试失败: ' + e.message;
            resultEl.style.color = '#b55a5a';
        }
    }

    // ================================================================
    // 📢 公告板（v2.2.0）
    // ================================================================
    async function loadNotice() {
        var container = document.getElementById('aboutContent');
      
        console.log('loadNotice 被调用了'); 

        try {
            var resp = await fetch(API_BASE + '/api/notice');
            var data = await resp.json();

            console.log('公告数据:', data);

            if (data.enabled && data.content) {
                container.innerHTML = data.content;
            } else {
                container.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);">暂无公告</div>';

            console.error('加载公告失败:', e);  
            container.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);">加载失败</div>';
        }
    }

    // ================================================================
    // 初始化
    // ================================================================
    document.addEventListener('DOMContentLoaded', function () {
        initTheme();
        connectWS();
        setTimeout(function() {
            loadApps();
        }, 300);
        //loadLogs();//
        loadNotice();  // 🆕 加载公告
        // 源管理已独立，会在切换Tab时通过 switchTab 调用 loadSources
    });
</script>

{% extends "layout.html" %}

{% block content %}
<div id="tabHome" class="tab-content active">{% include "home.html" %}</div>
<div id="tabApps" class="tab-content">{% include "apps.html" %}</div>
<div id="tabSources" class="tab-content">{% include "sources.html" %}</div>
<div id="tabSettings" class="tab-content">{% include "settings.html" %}</div>
{% include "modals.html" %}
{% endblock %}

{% block extra_js %}
<script>
// ================================================================
// 固定分类标签
// ================================================================
var FIXED_TAGS = ['全部', '影音', '办公', '下载', 'AI', '设计', '社交', '网络', '工具', '生活', '商务', '教育', '效率', '开发', '游戏'];

var API_BASE = window.location.origin;
var currentTag = '全部';
var currentAppType = 'all';
var currentSourceFilter = 'all';
var currentSort = 'default';  // ✅ 新增：排序方式
var currentPage = 1;
var pageSize = 8;
var allAppsData = [];
var installedAppsCache = {};
var currentDetailApp = null;
var currentSlide = 0;
var slideCount = 0;
var refreshCooldown = false;
var refreshTimer = null;
var REFRESH_COOLDOWN = 30;
var currentWizardSessionId = null;
var imageList = [];
var currentImageIndex = 0;
var homeSlideIndex = 0;
var homeSlideCount = 0;
var homeNoticeData = null;
var homeLoaded = false;

// ================================================================
// 📢 首页公告缓存（5分钟 TTL）
// ================================================================
var homeNoticeCache = null;
var homeNoticeCacheTime = 0;
var HOME_CACHE_TTL = 5 * 60 * 1000;  // 5 分钟

// ================================================================
// Toast
// ================================================================
function showToast(msg, type) {
    var toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.className = 'toast show ' + (type || '');
    var durations = { success: 2500, error: 4000, warning: 3000, info: 2000 };
    clearTimeout(toast._timer);
    toast._timer = setTimeout(function() { toast.classList.remove('show'); }, durations[type] || 3000);
}

// ================================================================
// 工具函数
// ================================================================
function compareVersions(v1, v2) {
    if (!v1 || !v2) return 0;
    v1 = String(v1).replace(/^v/, '');
    v2 = String(v2).replace(/^v/, '');
    var parts1 = v1.split('.').map(Number);
    var parts2 = v2.split('.').map(Number);
    for (var i = 0; i < Math.max(parts1.length, parts2.length); i++) {
        var a = parts1[i] || 0;
        var b = parts2[i] || 0;
        if (a > b) return 1;
        if (a < b) return -1;
    }
    return 0;
}

function getTagsArray(tags) {
    if (!tags) return [];
    if (Array.isArray(tags)) return tags;
    if (typeof tags === 'string') {
        return tags.split(',').map(function(s) { return s.trim(); }).filter(function(s) { return s; });
    }
    return [];
}

// ================================================================
// 导出日志
// ================================================================
function exportLogs() {
    window.open(API_BASE + '/api/logs/export', '_blank');
    showToast('正在导出日志...', 'info');
}

// ================================================================
// ✅ 清除本地缓存
// ================================================================
function clearCache() {
    if (!confirm('确定要清除所有本地缓存吗？\n\n清除后下次打开将重新加载数据。')) {
        return;
    }
    localStorage.removeItem('fnsoft_apps_cache');
    localStorage.removeItem('fnsoft_notice_cache');
    localStorage.removeItem('fnsoft_downloaded_version');
    // 保留主题设置（不清除 fnsoft_theme）
    showToast('缓存已清除，即将刷新页面', 'success');
    setTimeout(function() {
        location.reload();
    }, 800);
}

// ================================================================
// 设置页标签切换
// ================================================================
function switchSettingTab(tab) {
    document.querySelectorAll('.settings-tab').forEach(function(el) {
        el.classList.toggle('active', el.dataset.stab === tab);
    });
    document.querySelectorAll('.settings-panel').forEach(function(el) {
        el.classList.toggle('active', el.id === 'spanel-' + tab);
    });
}

// ================================================================
// 详情弹窗切换
// ================================================================
function switchDetailTab(tabName) {
    document.querySelectorAll('.detail-tab').forEach(function(tab) {
        tab.classList.toggle('active', tab.dataset.tab === tabName);
    });
    document.querySelectorAll('.detail-panel').forEach(function(panel) {
        panel.classList.remove('active');
        panel.style.display = 'none';
    });
    var activePanel = document.getElementById('panel-' + tabName);
    if (activePanel) {
        activePanel.classList.add('active');
        activePanel.style.display = 'block';
    }
}

// ================================================================
// 应用列表过滤与分页
// ================================================================
function searchApps() { currentPage = 1; renderFilteredApps(); }

function filterByTag(tag) {
    currentTag = tag;
    document.querySelectorAll('.filter-btn[data-tag]').forEach(function(btn) {
        btn.classList.toggle('active', btn.dataset.tag === tag);
    });
    currentPage = 1;
    renderFilteredApps();
}

function filterByAppType(type) {
    currentAppType = type;
    document.querySelectorAll('.type-filter-btn').forEach(function(btn) {
        btn.classList.toggle('active', btn.dataset.type === type);
    });
    currentPage = 1;
    renderFilteredApps();
}

function filterBySource(sourceName) {
    currentSourceFilter = sourceName || 'all';
    currentPage = 1;
    renderFilteredApps();
}

// ✅ 排序切换
function changeSort() {
    var select = document.getElementById('sortSelect');
    currentSort = select ? select.value : 'default';
    currentPage = 1;
    renderFilteredApps();
}

function renderFilterButtons() {
    var container = document.getElementById('filterBar');
    var html = '';
    FIXED_TAGS.forEach(function(tag) {
        html += '<button class="filter-btn' + (tag === currentTag ? ' active' : '') + '" data-tag="' + tag + '" onclick="filterByTag(\'' + tag + '\')">' + tag + '</button>';
    });
    container.innerHTML = html;
}

function getUniqueSourceNames() {
    var names = {};
    allAppsData.forEach(function(app) {
        if (app.id === 'fn-appstores-client') return;
        var src = app._source_name || '未知源';
        names[src] = true;
    });
    return Object.keys(names).sort();
}

function updateSourceFilterOptions() {
    var select = document.getElementById('sourceFilterSelect');
    if (!select) return;
    var names = getUniqueSourceNames();
    var html = '<option value="all">全部源</option>';
    names.forEach(function(name) {
        var selected = currentSourceFilter === name ? ' selected' : '';
        html += '<option value="' + name + '"' + selected + '>' + name + '</option>';
    });
    select.innerHTML = html;
}

// ✅ 排序函数
function sortApps(apps) {
    if (currentSort === 'default') return apps;
    
    var sorted = apps.slice();
    switch (currentSort) {
        case 'name':
            sorted.sort(function(a, b) {
                return (a.name || '').localeCompare(b.name || '');
            });
            break;
        case 'downloads':
            sorted.sort(function(a, b) {
                return (b.downloads || 0) - (a.downloads || 0);
            });
            break;
        case 'updated':
            sorted.sort(function(a, b) {
                var dateA = a.updated_at || '1970-01-01';
                var dateB = b.updated_at || '1970-01-01';
                return new Date(dateB) - new Date(dateA);
            });
            break;
    }
    return sorted;
}

function getCurrentPageData(apps) {
    return apps.slice((currentPage - 1) * pageSize, currentPage * pageSize);
}

function renderPagination(total) {
    var totalPages = Math.ceil(total / pageSize);
    var el = document.getElementById('pagination');
    if (totalPages <= 1) { el.classList.remove('show'); return; }
    el.classList.add('show');
    document.getElementById('pageInfo').textContent = currentPage + '/' + totalPages;
    document.getElementById('prevBtn').disabled = currentPage === 1;
    document.getElementById('nextBtn').disabled = currentPage === totalPages;
}

function prevPage() { if (currentPage > 1) { currentPage--; renderFilteredApps(); } }
function nextPage() {
    var totalPages = Math.ceil(getFilteredApps().length / pageSize);
    if (currentPage < totalPages) { currentPage++; renderFilteredApps(); }
}

// ================================================================
// 过滤掉 fn-appstores-client，使其不显示在应用列表
// ================================================================
function getFilteredApps() {
    var result = allAppsData.filter(function(app) { return app.id !== 'fn-appstores-client'; });
    var keyword = document.getElementById('searchInput').value.toLowerCase().trim();
    if (keyword) {
        result = result.filter(function(app) {
            return (app.name && app.name.toLowerCase().includes(keyword)) ||
                (app.desc && app.desc.toLowerCase().includes(keyword)) ||
                (app.author && app.author.toLowerCase().includes(keyword));
        });
    }
    if (currentTag !== '全部') {
        result = result.filter(function(app) {
            var appTags = getTagsArray(app.tags);
            return appTags.some(function(t) { return t === currentTag; });
        });
    }

    if (currentAppType === 'docker') {
        result = result.filter(function(app) {
            if (app.type) {
                var typeLower = String(app.type).toLowerCase();
                if (typeLower === 'docker' || typeLower === '容器') {
                    return true;
                }
            }
            var tags = getTagsArray(app.tags);
            return tags.some(function(t) {
                var tl = t.toLowerCase();
                return tl.includes('docker') || tl.includes('容器');
            });
        });
    } else if (currentAppType === 'native') {
        result = result.filter(function(app) {
            if (app.type) {
                var typeLower = String(app.type).toLowerCase();
                if (typeLower === '原生' || typeLower === 'native' || typeLower === '本地') {
                    return true;
                }
                if (typeLower === 'docker' || typeLower === '容器') {
                    return false;
                }
            }
            var tags = getTagsArray(app.tags);
            return !tags.some(function(t) {
                var tl = t.toLowerCase();
                return tl.includes('docker') || tl.includes('容器');
            });
        });
    }

    if (currentSourceFilter !== 'all') {
        result = result.filter(function(app) {
            return (app._source_name || '未知源') === currentSourceFilter;
        });
    }

    // ✅ 排序（放在最后）
    result = sortApps(result);
    return result;
}

function renderFilteredApps() {
    var filtered = getFilteredApps();
    renderApps(getCurrentPageData(filtered));
    renderPagination(filtered.length);
    document.getElementById('appCount').textContent = filtered.length;
    updateSettingsStats();
}

// ================================================================
// 轮播（应用详情）
// ================================================================
function initCarousel(screenshots) {
    var container = document.getElementById('carouselContainer');
    var track = document.getElementById('carouselTrack');
    var dotsContainer = document.getElementById('carouselDots');
    slideCount = screenshots.length;
    currentSlide = 0;
    if (slideCount === 0) { container.style.display = 'none'; return; }
    container.style.display = 'block';
    window._currentScreenshots = screenshots;
    track.innerHTML = screenshots.map(function(url, index) {
        return '<img src="' + url + '" alt="应用截图" loading="lazy" onerror="this.style.display=\'none\'" onclick="event.stopPropagation();openImageModal(window._currentScreenshots || [], ' + index + ')">';
    }).join('');
    document.getElementById('carouselPrev').classList.toggle('show', slideCount > 1);
    document.getElementById('carouselNext').classList.toggle('show', slideCount > 1);
    dotsContainer.innerHTML = slideCount > 1 ? screenshots.map(function(_, i) {
        return '<button class="dot' + (i === 0 ? ' active' : '') + '" onclick="goToSlide(' + i + ')"></button>';
    }).join('') : '';
    updateCarousel();
}

function updateCarousel() {
    document.getElementById('carouselTrack').style.transform = 'translateX(-' + (currentSlide * 100) + '%)';
    document.querySelectorAll('.carousel-dots .dot').forEach(function(dot, i) {
        dot.classList.toggle('active', i === currentSlide);
    });
}

function carouselPrev() { if (slideCount > 1) { currentSlide = (currentSlide - 1 + slideCount) % slideCount; updateCarousel(); } }
function carouselNext() { if (slideCount > 1) { currentSlide = (currentSlide + 1) % slideCount; updateCarousel(); } }
function goToSlide(index) { currentSlide = index; updateCarousel(); }

// ================================================================
// 大图预览
// ================================================================
function openImageModal(images, index) {
    if (!images || images.length === 0) return;
    imageList = images;
    currentImageIndex = index || 0;
    var img = document.getElementById('modalImage');
    img.src = imageList[currentImageIndex];
    document.getElementById('imageCounter').textContent = (currentImageIndex + 1) + ' / ' + imageList.length;
    document.getElementById('imagePrevBtn').style.display = imageList.length > 1 ? 'flex' : 'none';
    document.getElementById('imageNextBtn').style.display = imageList.length > 1 ? 'flex' : 'none';
    document.getElementById('imageModal').classList.add('active');
}
function closeImageModal() { document.getElementById('imageModal').classList.remove('active'); }
function imagePrev() {
    if (imageList.length === 0) return;
    currentImageIndex = (currentImageIndex - 1 + imageList.length) % imageList.length;
    document.getElementById('modalImage').src = imageList[currentImageIndex];
    document.getElementById('imageCounter').textContent = (currentImageIndex + 1) + ' / ' + imageList.length;
}
function imageNext() {
    if (imageList.length === 0) return;
    currentImageIndex = (currentImageIndex + 1) % imageList.length;
    document.getElementById('modalImage').src = imageList[currentImageIndex];
    document.getElementById('imageCounter').textContent = (currentImageIndex + 1) + ' / ' + imageList.length;
}

document.addEventListener('keydown', function(e) {
    var modal = document.getElementById('imageModal');
    if (!modal.classList.contains('active')) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); imagePrev(); }
    if (e.key === 'ArrowRight') { e.preventDefault(); imageNext(); }
    if (e.key === 'Escape') { e.preventDefault(); closeImageModal(); }
});

// ================================================================
// 详情弹窗
// ================================================================
function openDetail(appId) {
    if (appId === 'fn-appstores-client') {
        switchTab('settings');
        setTimeout(function() { switchSettingTab('system'); }, 300);
        showToast('请在「设置 → 系统」中检查更新', 'info');
        return;
    }

    var app = allAppsData.find(function(a) { return a.id === appId; });
    if (!app) return;
    currentDetailApp = app;

    document.getElementById('modalIcon').innerHTML = app.icon ? '<img src="' + app.icon + '" alt="' + app.name + '">' : '·';
    document.getElementById('modalTitle').textContent = app.name;

    var versionText = app.installed ? (app.installed_version || app.version) : app.version;
    if (app.installed && app.has_update) versionText += ' (⬆ ' + app.version + ')';
    document.getElementById('modalVersion').textContent = 'v' + versionText;
    document.getElementById('modalVersionInfo').textContent = app.version;
    document.getElementById('modalAuthor').textContent = app.author || '作者';
    document.getElementById('modalDesc').innerHTML = app.desc || '暂无描述';
    document.getElementById('modalSource').textContent = app._source_name || '未知源';

    var tags = getTagsArray(app.tags);
    var tagsContainer = document.getElementById('modalTags');
    if (tags.length > 0) {
        tagsContainer.innerHTML = tags.map(function(t) { return '<span class="tag">' + t + '</span>'; }).join('');
        tagsContainer.style.display = 'flex';
    } else { tagsContainer.style.display = 'none'; }

    switchDetailTab('desc');

    if (app.screenshots && app.screenshots.length > 0) {
        initCarousel(app.screenshots);
    } else {
        document.getElementById('carouselContainer').style.display = 'none';
    }

    var btn = document.getElementById('modalInstallBtn');
    if (app.installed && app.has_update) {
        btn.textContent = '更新';
        btn.className = 'btn btn-warning';
        btn.disabled = false;
        btn.dataset.action = 'update';
    } else if (app.installed) {
        btn.textContent = '已安装';
        btn.className = 'btn btn-secondary';
        btn.disabled = true;
        btn.dataset.action = 'none';
    } else {
        btn.textContent = '安装';
        btn.className = 'btn btn-primary';
        btn.disabled = false;
        btn.dataset.action = 'install';
    }
    btn.dataset.appId = app.id;

    var repoBtn = document.getElementById('modalRepoBtn');
    if (app.repo) {
        repoBtn.href = app.repo;
        repoBtn.style.display = 'inline-flex';
    } else {
        repoBtn.style.display = 'none';
    }

    document.getElementById('detailModal').classList.add('active');
}

function closeDetail() {
    document.getElementById('detailModal').classList.remove('active');
    currentDetailApp = null;
}

function modalInstall() {
    var btn = document.getElementById('modalInstallBtn');
    var appId = btn.dataset.appId;
    if (!appId) return;
    if (btn.dataset.action === 'none') { showToast('应用已安装', 'info'); return; }
    closeDetail();
    setTimeout(function() {
        if (btn.dataset.action === 'update') updateApp(appId);
        else installApp(appId);
    }, 200);
}

// ================================================================
// 渲染应用卡片
// ================================================================
function renderApps(apps) {
    var grid = document.getElementById('appGrid');
    if (!apps || apps.length === 0) {
        grid.innerHTML = '<div class="empty-state"><div class="icon">·</div><p>暂无符合条件的应用</p></div>';
        return;
    }
    grid.innerHTML = apps.map(function(app) {
        var btnHtml = '';
        if (app.installed && app.has_update) {
            btnHtml = '<button class="btn btn-warning" id="updateBtn-' + app.id + '" onclick="updateApp(\'' + app.id + '\')">更新</button>';
        } else if (app.installed) {
            btnHtml = '<button class="btn btn-secondary" disabled>已安装</button>';
        } else {
            btnHtml = '<button class="btn btn-primary" id="installBtn-' + app.id + '" onclick="installApp(\'' + app.id + '\')">安装</button>';
        }

        var versionDisplay = app.installed ? (app.installed_version || app.version) : app.version;
        var versionHtml = '<span class="version-text">v' + versionDisplay + '</span>';
        if (app.installed && app.has_update) versionHtml += ' <span class="update-badge">⬆ ' + app.version + '</span>';
        if (app.installed && !app.has_update) versionHtml += ' <span class="installed-badge">✓</span>';

        var sourceLabel = '';
        if (app._source_name) {
            var displayName = app._source_name;
            var prefix = '';
            var isOfficial = app._source_id === 'official';
            var isUserAdded = app._source_id && app._source_id.startsWith('source_') && !isOfficial;
            if (isOfficial) { prefix = 'FN软仓官方源'; displayName = ''; }
            else if (!isUserAdded && app._source_id) { prefix = '✅FN-'; }
            sourceLabel = '<span class="source-tag">' + prefix + displayName + '</span>';
        }

        var tagsHtml = '';
        var tags = getTagsArray(app.tags);
        if (tags.length > 0) {
            tagsHtml = '<div class="tags">' + tags.map(function(t) { return '<span class="tag">' + t + '</span>'; }).join('') + '</div>';
        }

        return '<div class="app-card" id="card-' + app.id + '" onclick="openDetail(\'' + app.id + '\')">' +
            '<div class="top">' +
            '<div class="icon">' + (app.icon ? '<img src="' + app.icon + '" alt="' + app.name + '">' : '·') + '</div>' +
            '<div class="info">' +
            '<div class="name"><span class="app-name-text">' + app.name + '</span> ' + versionHtml + '</div>' +
            '<div class="author">' + (app.author || '未知') + '</div>' +
            sourceLabel +
            '</div>' +
            '</div>' +
            tagsHtml +
            '<div class="desc">' + (app.desc || '暂无描述') + '</div>' +
            '<div class="actions" onclick="event.stopPropagation();">' +
            btnHtml +
            '<span class="download-count">📥 ' + (app.downloads || 0) + '</span>' +
            '</div>' +
            '<div class="progress-container" id="progress-' + app.id + '">' +
            '<div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBar-' + app.id + '"></div></div>' +
            '<div class="progress-text">' +
                '<span class="status-msg" id="progressMsg-' + app.id + '">准备中...</span>' +
                '<span class="progress-percent" id="progressPercent-' + app.id + '">0%</span>' +
            '</div>' +
            '<div class="progress-details"><span class="speed" id="speed-' + app.id + '"></span><span class="eta" id="eta-' + app.id + '"></span></div>' +
            '</div>' +
            '<div class="status-text" id="status-' + app.id + '"></div>' +
            '</div>';
    }).join('');
}

// ================================================================
// 加载应用列表
// ================================================================
async function loadApps() {
    var hasCache = false;
    try {
        var cached = localStorage.getItem('fnsoft_apps_cache');
        if (cached) {
            var cacheData = JSON.parse(cached);
            if (Date.now() - cacheData.timestamp < 10 * 60 * 1000) {
                allAppsData = cacheData.data;
                setTimeout(function() { restoreAppsView(); }, 100);
                document.getElementById('statusBadge').textContent = '缓存';
                document.getElementById('statusBadge').className = 'badge cached';
                hasCache = true;
                return;
            }
        }
    } catch (e) {}

    try {
        var controller = new AbortController();
        setTimeout(function() { controller.abort(); }, 30000);
        var resp = await fetch(API_BASE + '/api/apps', { signal: controller.signal });
        if (resp.status === 429) {
            var data = await resp.json();
            showToast(data.message, 'warning');
            startCooldown(data.retry_after || 30);
            document.getElementById('appGrid').innerHTML = '<div class="empty-state"><div class="icon">⏳</div><p>请求过于频繁，请 ' + (data.retry_after || 30) + ' 秒后点击刷新</p></div>';
            return;
        }
        var data = await resp.json();
        if (data.success && data.data.length > 0) {
            allAppsData = data.data;
            await loadInstalledVersions();
            renderFilterButtons();
            currentPage = 1;
            setTimeout(function() { restoreAppsView(); }, 300);
            document.getElementById('statusBadge').textContent = '在线';
            document.getElementById('statusBadge').className = 'badge connected';
            updateLastRefreshTime();
            localStorage.setItem('fnsoft_apps_cache', JSON.stringify({ timestamp: Date.now(), data: allAppsData }));
            if (typeof updateSourceFilterOptions === 'function') updateSourceFilterOptions();
        } else if (!hasCache) {
            document.getElementById('appGrid').innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><p>加载失败，请点击右上角「刷新」重试</p></div>';
            allAppsData = [];
        }
    } catch (e) {
        if (e.name !== 'AbortError') showToast('加载失败: ' + e.message, 'error');
        if (!hasCache) { allAppsData = []; document.getElementById('appGrid').innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><p>加载失败，请点击右上角「刷新」重试</p></div>'; }
    }
}

function restoreAppsView() {
    try {
        var cached = localStorage.getItem('fnsoft_apps_cache');
        if (cached) {
            var cacheData = JSON.parse(cached);
            if (Date.now() - cacheData.timestamp < 10 * 60 * 1000) {
                allAppsData = cacheData.data;
                renderFilterButtons();
                renderFilteredApps();
                document.getElementById('statusBadge').textContent = '缓存';
                document.getElementById('statusBadge').className = 'badge cached';
                if (typeof updateSourceFilterOptions === 'function') updateSourceFilterOptions();
                return;
            }
        }
    } catch (e) {}
    if (allAppsData && allAppsData.length > 0) {
        renderFilteredApps();
        if (typeof updateSourceFilterOptions === 'function') updateSourceFilterOptions();
        return;
    }
    loadApps();
}

async function loadInstalledVersions() {
    try {
        var resp = await fetch(API_BASE + '/api/installed');
        var data = await resp.json();
        if (data.success) {
            installedAppsCache = {};
            data.apps.forEach(function(app) { installedAppsCache[app.id] = app.version; });
            allAppsData.forEach(function(app) {
                if (app.id in installedAppsCache) {
                    app.installed = true;
                    app.installed_version = installedAppsCache[app.id];
                    app.has_update = app.installed_version && app.version && compareVersions(app.version, app.installed_version) > 0;
                } else {
                    app.installed = false;
                    app.has_update = false;
                }
            });
        }
        if (typeof updateHomeQuickCards === 'function') updateHomeQuickCards();
    } catch (e) { console.warn('获取已安装版本失败:', e); }
}

function updateLastRefreshTime() {
    var el = document.getElementById('lastRefresh');
    if (el) el.textContent = '上次刷新: ' + new Date().toLocaleTimeString();
}

// ================================================================
// 刷新
// ================================================================
async function refreshApps() {
    var btn = document.getElementById('refreshBtn');
    var badge = document.getElementById('statusBadge');
    if (refreshCooldown || btn.disabled) { showToast('请稍后再试', 'warning'); return; }

    btn.disabled = true;
    btn.textContent = '刷新中...';
    badge.textContent = '加载中';
    badge.className = 'badge loading';

    try {
        var resp = await fetch(API_BASE + '/api/refresh', { method: 'POST', headers: { 'Content-Type': 'application/json' } });
        var data = await resp.json();
        if (resp.status === 429) {
            showToast(data.message, 'warning');
            startCooldown(data.retry_after || 30);
            badge.textContent = '限流中';
            badge.className = 'badge error';
            return;
        }
        if (data.success) {
            allAppsData = data.data;
            await loadInstalledVersions();
            renderFilterButtons();
            currentPage = 1;
            renderFilteredApps();
            showToast(data.message, 'success');
            updateLastRefreshTime();
            badge.textContent = '在线';
            badge.className = 'badge connected';
            localStorage.setItem('fnsoft_apps_cache', JSON.stringify({ timestamp: Date.now(), data: allAppsData }));
            if (typeof updateSourceFilterOptions === 'function') updateSourceFilterOptions();
        } else {
            showToast('刷新失败: ' + data.message, 'error');
            badge.textContent = '失败';
            badge.className = 'badge error';
        }
    } catch (e) {
        showToast('刷新失败: ' + e.message, 'error');
        badge.textContent = '错误';
        badge.className = 'badge error';
    } finally {
        startCooldown(REFRESH_COOLDOWN);
        btn.disabled = false;
        btn.textContent = '刷新';
    }
}

function startCooldown(seconds) {
    var btn = document.getElementById('refreshBtn');
    refreshCooldown = true;
    var remaining = seconds;
    if (refreshTimer) clearInterval(refreshTimer);
    btn.classList.add('cooldown');
    refreshTimer = setInterval(function() {
        remaining--;
        if (remaining <= 0) {
            clearInterval(refreshTimer);
            refreshTimer = null;
            refreshCooldown = false;
            btn.disabled = false;
            btn.textContent = '刷新';
            btn.classList.remove('cooldown');
        } else {
            btn.textContent = remaining + 's';
        }
    }, 1000);
}

// ================================================================
// WebSocket
// ================================================================
var ws = null;
var wsReady = false;
var reconnectTimer = null;

function connectWS() {
    var url = window.location.origin.replace(/^http/, 'ws') + '/ws';
    try {
        if (ws && (ws.readyState === WebSocket.CONNECTING || ws.readyState === WebSocket.OPEN)) return;
        ws = new WebSocket(url);
        ws.onopen = function() { console.log('WebSocket 已连接'); wsReady = true; };
        ws.onmessage = function(e) {
            try { var msg = JSON.parse(e.data); handleWsMessage(msg); } catch (err) { console.warn('解析WS消息失败:', err); }
        };
        ws.onclose = function() {
            console.log('WebSocket 已断开');
            wsReady = false;
            ws = null;
            if (reconnectTimer) clearTimeout(reconnectTimer);
            reconnectTimer = setTimeout(connectWS, 3000);
        };
        ws.onerror = function() { ws.close(); };
    } catch (e) {
        wsReady = false;
        if (reconnectTimer) clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(connectWS, 3000);
    }
}

function handleWsMessage(msg) {
    if (msg.event === 'wizard.show') {
        showWizardFromSession(msg.data.session_id, msg.data.steps, msg.data.title);
        return;
    }
    if (msg.event === 'progress') {
        var data = msg.data;
        var appId = data.app_id;
        var btn = document.getElementById('installBtn-' + appId);
        if (btn) { btn.disabled = true; btn.textContent = '安装中...'; }
        var progressContainer = document.getElementById('progress-' + appId);
        if (progressContainer) progressContainer.classList.add('show');
        var progressBar = document.getElementById('progressBar-' + appId);
        if (progressBar) {
            var pct = Math.min(100, data.progress || 0);
            progressBar.style.width = pct + '%';
            progressBar.className = 'progress-bar-fill';
        }
        var pctEl = document.getElementById('progressPercent-' + appId);
        if (pctEl) {
            pctEl.textContent = Math.min(100, data.progress || 0) + '%';
        }
        var msgEl = document.getElementById('progressMsg-' + appId);
        if (msgEl) msgEl.textContent = data.msg || '处理中...';
        var speedEl = document.getElementById('speed-' + appId);
        if (speedEl) speedEl.textContent = data.speed_str || '';
        var etaEl = document.getElementById('eta-' + appId);
        if (etaEl) etaEl.textContent = (data.eta !== undefined && data.eta > 0) ? '剩余 ' + data.eta + 's' : '';
        var statusDiv = document.getElementById('status-' + appId);
        if (statusDiv) statusDiv.className = 'status-text show installing';
        return;
    }
    if (msg.event === 'result') {
        var data = msg.data;
        var appId = data.app_id;
        var progressContainer = document.getElementById('progress-' + appId);
        var progressBar = document.getElementById('progressBar-' + appId);
        var statusDiv = document.getElementById('status-' + appId);
        var btn = document.getElementById('installBtn-' + appId);

        if (data.status === 'success') {
            if (progressBar) { progressBar.style.width = '100%'; progressBar.className = 'progress-bar-fill complete'; }
            var pctEl = document.getElementById('progressPercent-' + appId);
            if (pctEl) pctEl.textContent = '100%';
            var msgEl = document.getElementById('progressMsg-' + appId);
            if (msgEl) msgEl.textContent = '安装完成';
            if (statusDiv) { statusDiv.className = 'status-text show success'; statusDiv.textContent = '✓ ' + data.msg; }
            if (btn) { btn.disabled = true; btn.textContent = '已安装'; }
            var app = allAppsData.find(function(a) { return a.id === appId; });
            showToast((app ? app.name : appId) + ' 安装成功', 'success');
            
            // ✅ 优化：直接更新应用卡片状态，无需刷新整个列表
            if (app) {
                app.installed = true;
                app.installed_version = data.version || app.version;
                app.has_update = false;
                // 更新卡片按钮
                var card = document.getElementById('card-' + appId);
                if (card) {
                    var cardBtn = card.querySelector('.actions .btn');
                    if (cardBtn) {
                        cardBtn.textContent = '已安装';
                        cardBtn.disabled = true;
                        cardBtn.className = 'btn btn-secondary';
                    }
                }
                // 更新首页快捷卡片
                if (typeof updateHomeQuickCards === 'function') {
                    updateHomeQuickCards();
                }
                // 更新统计
                updateSettingsStats();
            }
            
            setTimeout(function() { if (progressContainer) progressContainer.classList.remove('show'); }, 5000);
            // ✅ 延迟刷新列表，但状态已经更新，用户感知更好
            setTimeout(function() { refreshApps(); }, 5000);
        } else {
            if (progressBar) progressBar.className = 'progress-bar-fill error';
            var msgEl2 = document.getElementById('progressMsg-' + appId);
            if (msgEl2) msgEl2.textContent = data.msg;
            if (statusDiv) { statusDiv.className = 'status-text show error'; statusDiv.textContent = '✗ ' + data.msg; }
            if (btn) { btn.disabled = false; btn.textContent = '安装'; }
            showToast(data.msg, 'error');
        }
        return;
    }
}

async function installApp(appId) {

        switchTab('settings');
        setTimeout(function() { switchSettingTab('system'); }, 300);
        return;
    }

    if (!ws || ws.readyState !== WebSocket.OPEN) {
        showToast('连接中，请稍候...', '');
        connectWS();
        setTimeout(function() {
            if (ws && ws.readyState === WebSocket.OPEN) installApp(appId);
            else showToast('连接失败，请刷新页面重试', 'error');
        }, 2000);
        return;
    }
    var btn = document.getElementById('installBtn-' + appId);
    if (btn && btn.disabled) return;
    if (btn) { btn.disabled = true; btn.textContent = '安装中...'; }
    var progressContainer = document.getElementById('progress-' + appId);
    if (progressContainer) progressContainer.classList.add('show');
    var msgEl = document.getElementById('progressMsg-' + appId);
    if (msgEl) msgEl.textContent = '准备中...';

        if (!data.success || !data.data.download_url) {
            showToast('获取下载地址失败', 'error');

        }
        ws.send(JSON.stringify({ event: 'install', data: { app_id: appId, download_url: data.data.download_url } }));
        showToast('开始安装...', '');
    } catch (e) {
        showToast(e.message, 'error');
        if (btn) { btn.disabled = false; btn.textContent = '安装'; }
        if (progressContainer) progressContainer.classList.remove('show');
    }
}

async function checkClientUpdate() {
    var btn = document.getElementById('checkUpdateBtn');
    var status = document.getElementById('updateStatus');
    btn.disabled = true;
    btn.textContent = '检查中...';
    status.textContent = '⏳ 正在检查...';

    try {
        var resp = await fetch(API_BASE + '/api/check-update');
        var data = await resp.json();
        if (data.has_update) {
            var downloadedVer = localStorage.getItem('fnsoft_downloaded_version');
            if (downloadedVer && downloadedVer === data.version) {
                if (confirm('已下载 v' + data.version + '，是否重新下载？（如果文件已删除请点"确定"）')) {
                    localStorage.removeItem('fnsoft_downloaded_version');
                    downloadAndInstall(data);
                } else {
                    btn.disabled = false;
                    btn.textContent = '检查更新';
                    status.textContent = '';
                    btn.onclick = function() { checkClientUpdate(); };
                }
                return;
            }
            downloadAndInstall(data);
        } else {
            status.textContent = '✅ 已是最新版本 (' + data.version + ')';
            btn.textContent = '已是最新';
            btn.disabled = true;
        }
    } catch (e) {
        status.textContent = '❌ 检查失败: ' + e.message;
        btn.textContent = '重试';
        btn.disabled = false;
    }
}

function downloadAndInstall(data) {
    var btn = document.getElementById('checkUpdateBtn');
    var status = document.getElementById('updateStatus');
    status.textContent = '📥 发现新版本 ' + data.version + '，开始下载...';
    btn.textContent = '下载中...';
    btn.disabled = true;

    var a = document.createElement('a');
    a.href = data.download_url;
    a.download = 'fn-appstores-client-' + data.version + '.fpk';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    status.textContent = '✅ v' + data.version + ' 已下载！请到应用中心手动安装。';
    btn.textContent = '重新下载';
    btn.disabled = false;
    btn.onclick = function() { reDownload(); };
    localStorage.setItem('fnsoft_downloaded_version', data.version);
    setTimeout(function() {
        alert('✅ FPK 已下载完成！\n\n请前往：飞牛应用中心 → 手动安装 → 上传 FPK 文件');
    }, 500);
}

function reDownload() {
    localStorage.removeItem('fnsoft_downloaded_version');
    var btn = document.getElementById('checkUpdateBtn');
    var status = document.getElementById('updateStatus');
    btn.textContent = '检查更新';
    btn.disabled = false;
    btn.onclick = function() { checkClientUpdate(); };
    status.textContent = '';
    checkClientUpdate();
}

function checkAndShowDownloaded() {
    var downloadedVer = localStorage.getItem('fnsoft_downloaded_version');

    }
}

// ================================================================
// 向导
// ================================================================
function showWizardFromSession(sessionId, steps, title) {
    currentWizardSessionId = sessionId;
    var modal = document.getElementById('wizardModal');
    var body = document.getElementById('wizardBody');
    var status = document.getElementById('wizardStatus');
    document.getElementById('wizardTitle').textContent = title || '安装向导';
    status.textContent = '请填写配置项';

    var htmlContent = '';
    if (steps && steps.length > 0) {
        var items = steps.flatMap(function(step) { return step.items || []; });
        if (items.length === 0) {
            htmlContent = '<p>无配置项，点击确认安装</p>';
        } else {
            items.forEach(function(item) {
                if (item.type === 'tips') {
                    htmlContent += '<div class="wizard-field"><div class="hint" style="margin-bottom:8px;">' + (item.helpText || item.label || item.initValue || '提示信息') + '</div></div>';
                    return;
                }
                var required = item.rules && item.rules.some(function(r) { return r.required; });
                htmlContent += '<div class="wizard-field"><label>' + (item.label || item.field) + (required ? ' <span class="required">*</span>' : '') + '</label>';
                if (item.type === 'text' || item.type === 'password') {
                    var inputType = item.type === 'password' ? 'password' : 'text';
                    htmlContent += '<input type="' + inputType + '" id="wizard_' + item.field + '" name="' + item.field + '" value="' + (item.initValue || '') + '"' + (required ? ' required' : '') + '>';
                } else if (item.type === 'radio' || item.type === 'select') {
                    htmlContent += '<select id="wizard_' + item.field + '" name="' + item.field + '">';
                    (item.options || []).forEach(function(opt) {
                        htmlContent += '<option value="' + opt.value + '"' + (opt.value === item.initValue ? ' selected' : '') + '>' + opt.label + '</option>';
                    });
                    htmlContent += '</select>';
                } else if (item.type === 'switch') {
                    var checked = item.initValue === 'true' || item.initValue === true;
                    htmlContent += '<div style="display:flex;align-items:center;gap:4px;"><input type="checkbox" id="wizard_' + item.field + '" name="' + item.field + '"' + (checked ? ' checked' : '') + '> ' + item.label + '</div>';
                } else {
                    htmlContent += '<input type="text" id="wizard_' + item.field + '" name="' + item.field + '" value="' + (item.initValue || '') + '">';
                }
                if (item.helpText && item.type !== 'tips') htmlContent += '<div class="hint">' + item.helpText + '</div>';
                htmlContent += '</div>';
            });
        }
    } else {
        htmlContent = '<p>无配置项，点击确认安装</p>';
    }
    body.innerHTML = htmlContent;
    document.getElementById('wizardSubmitBtn').disabled = false;
    modal.classList.add('active');
}

function closeWizard() {
    if (currentWizardSessionId) {
        fetch(API_BASE + '/api/wizard/cancel', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ session_id: currentWizardSessionId }) }).catch(function() {});
        currentWizardSessionId = null;
    }
    document.getElementById('wizardModal').classList.remove('active');
}

async function submitWizard() {
    var btn = document.getElementById('wizardSubmitBtn');
    if (btn.disabled) return;
    btn.disabled = true;
    var status = document.getElementById('wizardStatus');
    status.textContent = '安装中...';

    var inputs = {};
    document.querySelectorAll('#wizardBody input, #wizardBody select, #wizardBody textarea').forEach(function(el) {
        var name = el.name;
        if (!name) return;
        inputs[name] = el.type === 'checkbox' ? (el.checked ? 'true' : 'false') : el.value;
    });

    try {
        var resp = await fetch(API_BASE + '/api/wizard/install', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ session_id: currentWizardSessionId, inputs: inputs })
        });
        var result = await resp.json();
        if (result.success) {
            status.textContent = '安装成功';
            showToast('安装成功', 'success');
            closeWizard();
            setTimeout(function() { refreshApps(); }, 2000);
        } else {
            status.textContent = result.message;
            btn.disabled = false;
        }
    } catch (e) {
        status.textContent = e.message;
        btn.disabled = false;
    }
}

// 软件源管理（包含官方源处理）

async function loadSources(force) {
    var container = document.getElementById('sourceList');
    container.innerHTML = '<div style="text-align:center;padding:12px;color:var(--text-muted);font-size:11px;">加载中...</div>';

    try {
        var resp = await fetch(API_BASE + '/api/sources?force=' + (force ? 'true' : 'false'));
        var data = await resp.json();
        if (!data.success || !data.data) {
            container.innerHTML = '<div style="text-align:center;padding:12px;color:#b55a5a;font-size:11px;">加载失败</div>';
            return;
        }
        var sources = data.data;
        if (sources.length === 0) {
            container.innerHTML = '<div style="text-align:center;padding:12px;color:var(--text-muted);font-size:11px;">暂无软件源</div>';
            return;
        }
        document.getElementById('settingsSourceCount').textContent = sources.length;

        container.innerHTML = sources.map(function(source) {
            var statusColor = source.status === 'online' ? '#5a8a5a' : source.status === 'disabled' ? '#999' : source.status === 'offline' ? '#b55a5a' : '#999';
            var statusText = source.status === 'online' ? '在线' : source.status === 'disabled' ? '已禁用' : source.status === 'offline' ? '离线' : '未知';
            var isDefault = source.id === 'official' || source.id === 'official_backup';

            var displayUrl = isDefault ? '●●●●●●●' : source.url;

            var toggleBtn = '';
            if (!isDefault) {
                if (source.enabled) {
                    toggleBtn = '<button class="btn btn-disable" onclick="toggleSource(\'' + source.id + '\',false)">禁用</button>';
                } else {
                    toggleBtn = '<button class="btn btn-enable" onclick="toggleSource(\'' + source.id + '\',true)">启用</button>';
                }
            }

            return '<div class="source-item">' +
                '<div class="info">' +
                '<div class="name-row">' +
                '<span class="name">' + source.name + '</span>' +
                (isDefault ? '<span class="badge">官方</span>' : '') +
                '<span class="status" style="color:' + statusColor + ';">● ' + statusText + '</span>' +
                '</div>' +
                '<div class="url">' + displayUrl + '</div>' +
                (source.status_msg && source.status !== 'online' ? '<div class="status-msg">' + source.status_msg + '</div>' : '') +
                '</div>' +
                '<div class="actions">' +
                toggleBtn +
                (isDefault ? '' : '<button class="btn btn-delete" onclick="removeSource(\'' + source.id + '\')">删除</button>') +
                '</div>' +
                '</div>';
        }).join('');
    } catch (e) {
        container.innerHTML = '<div style="text-align:center;padding:12px;color:#b55a5a;font-size:11px;">加载失败: ' + e.message + '</div>';
    }
}

            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: url })
        });
        var data = await resp.json();
        if (data.success) {
            resultEl.textContent = '✅ ' + data.message;
            resultEl.style.color = '#5a8a5a';
        } else {
            resultEl.textContent = '❌ ' + data.message;
            resultEl.style.color = '#b55a5a';
        }
    } catch (e) {
        resultEl.textContent = '❌ 测试失败: ' + e.message;
        resultEl.style.color = '#b55a5a';
    }
}

// ================================================================
// 📢 首页（优化版：不等待应用列表加载，带5分钟公告缓存）
// ================================================================
async function loadHome() {
    if (homeLoaded) return;

    var now = Date.now();
    var hasCache = homeNoticeCache && (now - homeNoticeCacheTime) < HOME_CACHE_TTL;

    try {
        var data;

        if (hasCache) {
            data = homeNoticeCache;
        } else {
            var resp = await fetch(API_BASE + '/api/notice');
            data = await resp.json();
            homeNoticeCache = data;
            homeNoticeCacheTime = now;
        }

        homeNoticeData = data;
        renderCarousel(data);
        renderNoticeRecords(data);

        if (allAppsData && allAppsData.length > 0) {
            updateHomeQuickCards();
        } else {
            ['quickInstalledList', 'quickUpdatableList', 'quickHotList', 'quickNewestList'].forEach(function(id) {
                var el = document.getElementById(id);
                if (el) el.innerHTML = '<div class="empty">加载中...</div>';
            });
            checkAndShowDownloaded();
        }
        homeLoaded = true;
    } catch (e) {
        console.warn('加载首页失败:', e);
        if (homeNoticeCache) {
            data = homeNoticeCache;
            homeNoticeData = data;
            renderCarousel(data);
            renderNoticeRecords(data);
            homeLoaded = true;
        } else {
            document.getElementById('homeNoticeContent').innerHTML = '<div style="color:var(--text-muted);font-size:12px;text-align:center;padding:12px 0;">加载公告失败</div>';
            homeLoaded = true;
        }
    }
}

function renderCarousel(data) {
    var track = document.getElementById('homeCarouselTrack');
    var dotsContainer = document.getElementById('homeCarouselDots');
    if (data.enabled && data.carousel && data.carousel.length > 0) {
        var baseUrl = window.location.origin;
        var images = data.carousel.map(function(url) { return url.startsWith('/') ? baseUrl + url : url; });
        homeSlideCount = images.length;
        homeSlideIndex = 0;
        track.innerHTML = images.map(function(url) {
            return '<div class="home-carousel-slide" style="background-image:url(' + url + ');"></div>';
        }).join('');
        dotsContainer.innerHTML = homeSlideCount > 1 ? images.map(function(_, i) {
            return '<button class="dot' + (i === 0 ? ' active' : '') + '" onclick="homeCarouselGoTo(' + i + ')"></button>';
        }).join('') : '';
    } else {
        track.innerHTML = '<div class="home-carousel-slide" style="background:var(--card-bg);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text-muted);">暂无轮播图</div>';
        homeSlideCount = 1;
        homeSlideIndex = 0;
        dotsContainer.innerHTML = '';
    }
}

function renderNoticeRecords(data) {
    var container = document.getElementById('homeNoticeContent');
    if (!data.enabled || !data.records || data.records.length === 0) {
        container.innerHTML = '<div style="color:var(--text-muted);font-size:12px;text-align:center;padding:12px 0;">暂无公告</div>';
        return;
    }
    var html = '<div class="notice-records">';
    data.records.slice(0, 5).forEach(function(record, index) {
        html += '<div class="notice-record" onclick="openNoticeDetail(' + index + ')">' +
            '<div class="record-date">' + record.date + '</div>' +
            '<div class="record-title">' + record.title + '</div>' +
            '</div>';
    });
    if (data.records.length > 5) html += '<div class="notice-more" onclick="openAllNotices()">查看全部公告 →</div>';
    html += '</div>';
    container.innerHTML = html;
}

function homeCarouselUpdate() {
    var track = document.getElementById('homeCarouselTrack');
    if (track) track.style.transform = 'translateX(-' + (homeSlideIndex * 100) + '%)';
    document.querySelectorAll('#homeCarouselDots .dot').forEach(function(dot, i) {
        dot.classList.toggle('active', i === homeSlideIndex);
    });
}

function homeCarouselPrev(e) { if (e) e.stopPropagation(); if (homeSlideCount <= 1) return; homeSlideIndex = (homeSlideIndex - 1 + homeSlideCount) % homeSlideCount; homeCarouselUpdate(); }
function homeCarouselNext(e) { if (e) e.stopPropagation(); if (homeSlideCount <= 1) return; homeSlideIndex = (homeSlideIndex + 1) % homeSlideCount; homeCarouselUpdate(); }
function homeCarouselGoTo(index) { if (index < 0 || index >= homeSlideCount) return; homeSlideIndex = index; homeCarouselUpdate(); }

// ================================================================
// 首页快捷卡片过滤掉 fn-appstores-client
// ================================================================
function updateHomeQuickCards() {
    if (!allAppsData || allAppsData.length === 0) {
        ['quickInstalledList', 'quickUpdatableList', 'quickHotList', 'quickNewestList'].forEach(function(id) {
            document.getElementById(id).innerHTML = '<div class="empty">加载中...</div>';
        });
        return;
    }
    var filteredData = allAppsData.filter(function(app) { return app.id !== 'fn-appstores-client'; });
    var installed = filteredData.filter(function(app) { return app.installed; });
    document.getElementById('quickInstalledCount').textContent = installed.length;
    renderQuickList('quickInstalledList', installed, 'installed');

    var updatable = filteredData.filter(function(app) { return app.has_update; });
    document.getElementById('quickUpdatableCount').textContent = updatable.length;
    renderQuickList('quickUpdatableList', updatable, 'updatable');

    var hot = filteredData.slice().sort(function(a, b) { return (b.downloads || 0) - (a.downloads || 0); }).slice(0, 10);
    renderQuickList('quickHotList', hot, 'hot');

    var newest = filteredData.slice().sort(function(a, b) {
        return new Date(b.updated_at || '1970-01-01') - new Date(a.updated_at || '1970-01-01');
    }).slice(0, 10);
    renderQuickList('quickNewestList', newest, 'newest');
}

function renderQuickList(containerId, apps, type) {
    var container = document.getElementById(containerId);
    if (!apps || apps.length === 0) { container.innerHTML = '<div class="empty">暂无应用</div>'; return; }
    var html = '';
    apps.forEach(function(app) {
        var iconHtml = app.icon ? '<img src="' + app.icon + '" alt="">' : '·';
        var meta = type === 'hot' ? '↓ ' + (app.downloads || 0) :
            type === 'installed' ? 'v' + (app.installed_version || app.version) :
            type === 'updatable' ? '⬆ ' + app.version :
            '📅 ' + (app.updated_at || '');
        html += '<div class="item" onclick="openDetail(\'' + app.id + '\')">' +
            '<span class="icon-sm">' + iconHtml + '</span>' +
            '<span class="name">' + app.name + '</span>' +
            '<span class="meta">' + meta + '</span>' +
            '</div>';
    });
    container.innerHTML = html;
}

// ================================================================
// 公告详情
// ================================================================
function openNoticeDetail(index) {
    var data = homeNoticeData;
    if (!data || !data.records || !data.records[index]) return;
    var record = data.records[index];
    document.getElementById('noticeDetailTitle').textContent = record.title;
    document.getElementById('noticeDetailBody').innerHTML = sanitizeDesc(record.content);
    document.getElementById('noticeDetailModal').classList.add('active');
}

function openAllNotices() {
    var data = homeNoticeData;
    if (!data || !data.records || data.records.length === 0) return;
    document.getElementById('noticeDetailTitle').textContent = '全部公告';
    var html = '';
    data.records.forEach(function(record, idx) {
        html += '<div style="margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border);">' +
            '<div style="font-size:11px;color:var(--text-muted);">' + record.date + '</div>' +
            '<div style="font-size:14px;font-weight:600;color:var(--text-primary);cursor:pointer;" onclick="event.stopPropagation();openNoticeDetail(' + idx + ')">' + record.title + '</div>' +
            '</div>';
    });
    document.getElementById('noticeDetailBody').innerHTML = html;
    document.getElementById('noticeDetailModal').classList.add('active');
}

function closeNoticeDetail() {
    document.getElementById('noticeDetailModal').classList.remove('active');
}

function sanitizeDesc(html) {
    var allowedTags = ['p', 'a', 'b', 'strong', 'h1', 'h2', 'h3', 'h4', 'h5', 'br'];
    var allowedStyles = ['font-size', 'color'];
    var parser = new DOMParser();
    var doc = parser.parseFromString(html, 'text/html');

    function cleanNode(node) {
        if (node.nodeType === Node.TEXT_NODE) return document.createTextNode(node.textContent);
        if (node.nodeType !== Node.ELEMENT_NODE) return document.createTextNode('');
        var tag = node.tagName.toLowerCase();
        if (allowedTags.indexOf(tag) === -1) {
            var fragment = document.createDocumentFragment();
            node.childNodes.forEach(function(child) { fragment.appendChild(cleanNode(child)); });
            return fragment;
        }
        var newEl = document.createElement(tag);
        if (tag === 'a') {
            var href = node.getAttribute('href');
            if (href) { newEl.setAttribute('href', href); newEl.setAttribute('target', '_blank'); newEl.setAttribute('rel', 'noopener noreferrer'); }
        }
        var style = node.getAttribute('style');
        if (style) {
            var allowedStyle = '';
            style.split(';').forEach(function(rule) {
                var parts = rule.trim().split(':');
                if (parts.length === 2) {
                    var prop = parts[0].trim().toLowerCase();
                    var val = parts[1].trim();
                    if (allowedStyles.indexOf(prop) !== -1 && val) allowedStyle += prop + ':' + val + ';';
                }
            });
            if (allowedStyle) newEl.setAttribute('style', allowedStyle);
        }
        node.childNodes.forEach(function(child) { newEl.appendChild(cleanNode(child)); });
        return newEl;
    }

    var fragment = document.createDocumentFragment();
    doc.body.childNodes.forEach(function(child) { fragment.appendChild(cleanNode(child)); });
    return fragment.innerHTML || html;
}

// ================================================================

// ================================================================
function updateSettingsStats() {
    if (!allAppsData || allAppsData.length === 0) return;
    var filteredData = allAppsData.filter(function(app) { return app.id !== 'fn-appstores-client'; });
    document.getElementById('settingsTotalApps').textContent = filteredData.length;
    document.getElementById('settingsInstalled').textContent = filteredData.filter(function(app) { return app.installed; }).length;
    document.getElementById('settingsUpdatable').textContent = filteredData.filter(function(app) { return app.has_update; }).length;
}

    var versionEl = document.getElementById('settingsVersion');
